name: DATA-204 Review Fix

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: github.head_ref == 'agent/data-204-legacy-password-upgrade'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply explicit result guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          postgres = Path('server/src/__tests__/core1b.postgres.integration.test.ts')
          text = postgres.read_text()
          old = '''    const ownerToken = (\n      await authBeforeRestart.loginDurable(\n        `owner-${suffix}@example.com`,\n        "password123",\n        ownerId,\n      )\n    ).token!;\n    const otherToken = (\n      await authBeforeRestart.loginDurable(\n        `other-${suffix}@example.com`,\n        "password123",\n        otherId,\n      )\n    ).token!;\n'''
          new = '''    const ownerLogin = await authBeforeRestart.loginDurable(\n      `owner-${suffix}@example.com`,\n      "password123",\n      ownerId,\n    );\n    if (!ownerLogin.token) {\n      throw new Error("Owner login did not return an access token");\n    }\n    const ownerToken = ownerLogin.token;\n\n    const otherLogin = await authBeforeRestart.loginDurable(\n      `other-${suffix}@example.com`,\n      "password123",\n      otherId,\n    );\n    if (!otherLogin.token) {\n      throw new Error("Other-user login did not return an access token");\n    }\n    const otherToken = otherLogin.token;\n'''
          if old not in text:
              raise SystemExit('PostgreSQL login token block not found')
          postgres.write_text(text.replace(old, new), encoding='utf-8')

          bug = Path('server/src/__tests__/bugConditionExploration.test.ts')
          text = bug.read_text()
          old = '''            expect(credentials1).toBeDefined();\n            expect(credentials2).toBeDefined();\n            expect(credentials1!.passwordHash).not.toBe(\n              credentials2!.passwordHash,\n            );\n            expect(credentials1!.passwordHash).toMatch(/^\\$2[aby]\\$12\\$/);\n            expect(credentials2!.passwordHash).toMatch(/^\\$2[aby]\\$12\\$/);\n'''
          new = '''            if (!credentials1 || !credentials2) {\n              throw new Error("Registration did not persist both credentials");\n            }\n            expect(credentials1.passwordHash).not.toBe(credentials2.passwordHash);\n            expect(credentials1.passwordHash).toMatch(/^\\$2[aby]\\$12\\$/);\n            expect(credentials2.passwordHash).toMatch(/^\\$2[aby]\\$12\\$/);\n'''
          if old not in text:
              raise SystemExit('Dual credential assertion block not found')
          text = text.replace(old, new)
          old = '''            expect(credentials).toBeDefined();\n            expect(credentials!.passwordHash).toMatch(/^\\$2[aby]\\$12\\$/);\n'''
          new = '''            if (!credentials) {\n              throw new Error("Registration did not persist credentials");\n            }\n            expect(credentials.passwordHash).toMatch(/^\\$2[aby]\\$12\\$/);\n'''
          if old not in text:
              raise SystemExit('Single credential assertion block not found')
          bug.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove temporary workflow and refresh inventories
        run: |
          git rm .github/workflows/data-204-review-fix.yml
          node scripts/cleanup/generate-tracked-inventories.mjs

      - name: Validate bounded change
        run: |
          npx prettier --check server/src/__tests__/core1b.postgres.integration.test.ts server/src/__tests__/bugConditionExploration.test.ts
          npm run typecheck
          npm run lint
          npx vitest run server/src/__tests__/bugConditionExploration.test.ts
          npm run validate

      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/__tests__/core1b.postgres.integration.test.ts server/src/__tests__/bugConditionExploration.test.ts _inventory_raw.txt ProjectStructure.txt project_structure.txt
          git diff --cached --quiet && exit 0
          git commit -m "test(data-204): guard durable login results"
          git push origin HEAD:${{ github.head_ref }}
