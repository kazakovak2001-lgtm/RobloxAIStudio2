name: Inventory Repair

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate

permissions:
  contents: write

jobs:
  inventory-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Regenerate final tracked-file inventory
        run: |
          git ls-files \
            | grep -v '^.github/workflows/inventory-evidence.yml$' \
            | LC_ALL=C sort \
            > _inventory_raw.txt
          git rm .github/workflows/inventory-evidence.yml

      - name: Commit exact inventory and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _inventory_raw.txt .github/workflows/inventory-evidence.yml
          git commit -m "chore(cleanup): refresh tracked-file inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
