name: SECURITY-2G-E Roadmap Reconciliation Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-security2gE-roadmap-reconciliation.py
      - run: node node_modules/prettier/bin/prettier.cjs --check docs/00-project-control/ROADMAP_STATUS.md scripts/validate.ts
      - name: Verify roadmap authority
        run: |
          grep -F 'In progress — `SECURITY-2G-E`' docs/00-project-control/ROADMAP_STATUS.md
          grep -F '204 classified operations' docs/00-project-control/ROADMAP_STATUS.md
          grep -F '50 test files and 137 tests' docs/00-project-control/ROADMAP_STATUS.md
          grep -F 'In progress — `SECURITY-2G-E`' scripts/validate.ts
          ! grep -F 'Application RBAC | Not yet inventoried' docs/00-project-control/ROADMAP_STATUS.md
          ! grep -F 'In progress — `SECURITY-2G-D`' docs/00-project-control/ROADMAP_STATUS.md
          ! grep -F 'In progress — `SECURITY-2G-D`' scripts/validate.ts
      - run: npm run validate
      - name: Publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/00-project-control/ROADMAP_STATUS.md scripts/validate.ts
          git diff --cached --quiet && exit 0
          git commit -m "docs(security): reconcile rbac roadmap authority"
          git push origin HEAD:agent/security-2g-e-rbac-parity
