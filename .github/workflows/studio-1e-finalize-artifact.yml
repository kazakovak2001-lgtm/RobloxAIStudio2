name: Studio 1e Finalization Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  finalize-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Synchronize STUDIO-1e control state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one match in {path}, found {count}: {old[:80]}"
                  )
              file.write_text(content.replace(old, new), encoding="utf-8")

          current = "docs/00-project-control/CURRENT_STATE.md"
          replace_once(current, "**Last Updated**: July 24, 2026", "**Last Updated**: July 25, 2026")
          replace_once(
              current,
              "**Phase**: STUDIO-1 — Manual Roblox Studio Evidence (STUDIO-1d canonical plugin implementation verified)",
              "**Phase**: STUDIO-1 — Manual Roblox Studio Evidence (STUDIO-1e deterministic package automation verified)",
          )
          replace_once(
              current,
              "**Build Status**: Backend CI is green on Node.js 22 / npm 10, including the full normal test suite, canonical plugin contract coverage, strict PostgreSQL restart acceptance, repository validation, formatting, linting, commitlint, and the aggregate merge gate; standalone frontend CI passes TypeScript, Workspace logic tests, production build, and production-artifact responsive browser QA",
              "**Build Status**: Backend CI is green on Node.js 22 / npm 10, including the full normal test suite, canonical plugin source and deterministic package coverage, strict PostgreSQL restart acceptance, repository validation, formatting, linting, commitlint, and the aggregate merge gate; the Studio package workflow builds, parses, checksum-verifies, and uploads the installable `.rbxmx`; standalone frontend CI passes TypeScript, Workspace logic tests, production build, and production-artifact responsive browser QA",
          )
          replace_once(current, "- **Files**: 574 TypeScript files in 48 subsystems", "- **Files**: 576 TypeScript files in 48 subsystems")
          replace_once(
              current,
              "- **Canonical Studio plugin**: `studio-plugin/` v1.8 reuses the existing connector, lifecycle manager, sync manager, artifact loader, events, and UI. It connects with the exact backend project ID, polls `EXPORT_PROJECT`, acknowledges delivery, materializes structured Lua scripts and non-Lua metadata as Roblox instances, reports one exact ID/hash receipt per pipeline artifact, and shows Verified only after the backend accepts the evidence.",
              "- **Canonical Studio plugin**: `studio-plugin/` v1.8 reuses the existing connector, lifecycle manager, sync manager, artifact loader, events, and UI. It connects with the exact backend project ID, polls `EXPORT_PROJECT`, acknowledges delivery, materializes structured Lua scripts and non-Lua metadata as Roblox instances, reports one exact ID/hash receipt per pipeline artifact, and shows Verified only after the backend accepts the evidence.\n- **Studio plugin package**: `npm run studio:package` creates a deterministic installable `.rbxmx`, a source/bundle manifest, and SHA-256 checksums from an explicit active-module allowlist. The dedicated package workflow validates XML structure and checksums before uploading the desktop acceptance artifact.",
          )
          replace_once(
              current,
              "| STUDIO-1d plugin  | Canonical plugin command/import contract                 | July 24, 2026 |",
              "| STUDIO-1d plugin  | Canonical plugin command/import contract                 | July 24, 2026 |\n| STUDIO-1e package | Deterministic installable plugin and acceptance runbook     | July 25, 2026 |",
          )
          replace_once(
              current,
              "2. **Manual Roblox Studio acceptance evidence**: the backend ACK/result verifier and canonical `studio-plugin/` implementation are CI-verified. STUDIO-1 remains active only until a real desktop Studio session installs the plugin, polls `EXPORT_PROJECT`, creates or updates every expected instance, reports matching receipts, and project status returns `artifactVerified=true` for the same execution.",
              "2. **Manual Roblox Studio acceptance evidence**: the backend ACK/result verifier, canonical `studio-plugin/` implementation, deterministic `.rbxmx` package, checksum manifest, and acceptance runbook are CI-verified. STUDIO-1 remains active only until a real desktop Studio session installs the verified package, polls `EXPORT_PROJECT`, creates or updates every expected instance, reports matching receipts, and project status returns `artifactVerified=true` for the same execution.",
          )
          replace_once(
              current,
              "## Last Changes\n\n- July 24, 2026: STUDIO-1d canonical plugin implementation verified",
              "## Last Changes\n\n- July 25, 2026: STUDIO-1e acceptance packaging verified — `npm run studio:package` now creates a deterministic installable `.rbxmx`, source/bundle manifest, and SHA-256 checksum file from the explicit active plugin allowlist. The package workflow parses the Roblox XML model, verifies checksums, and publishes a downloadable artifact. The standard test suite proves repeat builds are byte-identical, and the desktop runbook defines installation, status capture, evidence fields, and failure triage. Real Roblox Studio evidence remains the only STUDIO-1 gate. See `STUDIO-1E_DESKTOP_ACCEPTANCE_RUNBOOK.md`.\n- July 24, 2026: STUDIO-1d canonical plugin implementation verified",
          )

          roadmap = "docs/00-project-control/ROADMAP_STATUS.md"
          replace_once(roadmap, "**Last Updated**: July 24, 2026", "**Last Updated**: July 25, 2026")
          replace_once(
              roadmap,
              "🟡 1a–1d code verified; desktop evidence pending",
              "🟡 1a–1e code/package verified; desktop evidence pending",
          )
          replace_once(
              roadmap,
              "See [STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md](./STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md) for the CI-verified canonical plugin implementation and manual Studio evidence checklist.",
              "See [STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md](./STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md) for the CI-verified canonical plugin implementation.\nSee [STUDIO-1E_DESKTOP_ACCEPTANCE_RUNBOOK.md](./STUDIO-1E_DESKTOP_ACCEPTANCE_RUNBOOK.md) for the deterministic installable package, checksum contract, and manual evidence procedure.",
          )
          replace_once(
              roadmap,
              "STUDIO-1 code preparation is complete through STUDIO-1d. The remaining valid project step is a human-run Roblox Studio acceptance session against the existing implementation:",
              "STUDIO-1 code and package preparation is complete through STUDIO-1e. The remaining valid project step is a human-run Roblox Studio acceptance session against the verified installable artifact:",
          )
          replace_once(
              roadmap,
              "1. install the canonical `studio-plugin/` hierarchy;\n2. enable HTTP Requests and script editing permission;\n3. enter the exact standalone Workspace project ID;\n4. connect and poll the queued `EXPORT_PROJECT` command;\n5. acknowledge the command;\n6. create or update every expected Roblox instance;\n7. report the exact durable execution ID and artifact ID/SHA-256 receipts;\n8. capture plugin state **Verified** and project status `artifactVerified=true` for the same execution.",
              "1. download or build `RobloxAIStudioPlugin-v1.8.0.rbxmx`;\n2. verify the bundle SHA-256 from the packaged checksum file;\n3. install the model as a local plugin and enable required HTTP/script permissions;\n4. enter the exact standalone Workspace project ID;\n5. connect and poll the queued `EXPORT_PROJECT` command;\n6. acknowledge the command and create or update every expected Roblox instance;\n7. report the exact durable execution ID and artifact ID/SHA-256 receipts;\n8. capture plugin state **Verified**, Explorer hierarchy, logs, and project status `artifactVerified=true` for the same execution.",
          )
          replace_once(
              roadmap,
              "CUTOVER-1 must not begin until this evidence exists. A synthetic success response, queue delivery, backend-only test, or source-contract test is not sufficient as final desktop proof.",
              "CUTOVER-1 must not begin until this evidence exists. A synthetic success response, queue delivery, backend-only test, source-contract test, or successful package build is not sufficient as final desktop proof.",
          )

          runbook = "docs/00-project-control/STUDIO-1E_DESKTOP_ACCEPTANCE_RUNBOOK.md"
          replace_once(
              runbook,
              "**Status:** Installable package automation implemented; human-run Roblox Studio evidence pending",
              "**Status:** Deterministic package automation and CI artifact verified; human-run Roblox Studio evidence pending",
          )
          PY
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            package.json \
            scripts/package-studio-plugin.ts \
            server/src/__tests__/studio1.plugin-package.test.ts \
            .github/workflows/studio-plugin-package.yml \
            studio-plugin/README.md \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1E_DESKTOP_ACCEPTANCE_RUNBOOK.md
      - name: Create finalization artifact
        run: |
          tar -czf studio-1e-finalized.tgz \
            package.json \
            scripts/package-studio-plugin.ts \
            server/src/__tests__/studio1.plugin-package.test.ts \
            .github/workflows/studio-plugin-package.yml \
            studio-plugin/README.md \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1E_DESKTOP_ACCEPTANCE_RUNBOOK.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio-1e-finalized-${{ github.sha }}
          path: studio-1e-finalized.tgz
          retention-days: 2
