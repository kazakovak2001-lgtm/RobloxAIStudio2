name: SECURITY-2G-E Lua Generation Scope Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-security2gE-lua-generation-scope.py
      - run: node --import tsx scripts/generate-authorization-matrix.ts
      - run: node node_modules/prettier/bin/prettier.cjs --write server/src/routes/luaGeneration.ts server/src/index.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.lua-generation-scope.test.ts
      - run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.lua-generation-scope.test.ts
      - run: npm run typecheck
      - name: Publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/routes/luaGeneration.ts server/src/index.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.lua-generation-scope.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): scope lua generation operations"
          git push origin HEAD:agent/security-2g-e-rbac-parity
