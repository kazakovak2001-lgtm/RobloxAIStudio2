name: SECURITY-2G-E Concept Resolver Finalizer

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate

permissions:
  contents: write

jobs:
  finalize-concept-resolvers:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add fail-closed concept resource resolvers
        run: |
          python - <<'PY'
          from pathlib import Path

          concept = Path('server/src/routes/concept.ts')
          text = concept.read_text()

          import_anchor = 'import { DurableStorageError } from "../platform/storage/StorageProvider";\n'
          import_line = 'import type { ProjectAccessControl } from "./projects";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('concept import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          signature = '''export function createConceptRouter(
            agentRegistry: AgentRegistry,
            generationHistory: GenerationHistoryRepository,
          ): Router {'''
          replacement = '''export function createConceptRouter(
            agentRegistry: AgentRegistry,
            generationHistory: GenerationHistoryRepository,
            access: ProjectAccessControl,
          ): Router {'''
          if 'access: ProjectAccessControl' not in text:
              if signature not in text:
                  raise SystemExit('concept router signature anchor not found')
              text = text.replace(signature, replacement, 1)

          engine_anchor = '''  const router = Router();
            const pipelineEngine = new PipelineEngine();
          '''
          resolver_block = '''  const router = Router();
            const pipelineEngine = new PipelineEngine();
            const concealProjectAccess = async (
              req: Request,
              res: Response,
              projectId: string,
              resourceName: "Pipeline" | "Artifact",
            ): Promise<boolean> => {
              if (access.hasProjectAccess) {
                if (await access.hasProjectAccess(req, projectId)) return true;
              } else if (await access.requireProjectAccess(req, res, projectId)) {
                return true;
              }
              if (!res.headersSent) {
                res.status(404).json({
                  success: false,
                  error: `${resourceName} not found`,
                });
              }
              return false;
            };

            router.param("pipelineId", async (req, res, next, value) => {
              const state = pipelineEngine.getState(value);
              if (!state) {
                res.status(404).json({ success: false, error: "Pipeline not found" });
                return;
              }
              if (!(await concealProjectAccess(req, res, state.projectId, "Pipeline"))) {
                return;
              }
              next();
            });

            router.param("artifactId", async (req, res, next, value) => {
              const artifact = pipelineEngine.getArtifact(value);
              const state = artifact
                ? pipelineEngine.getState(artifact.pipelineId)
                : undefined;
              if (!artifact || !state) {
                res.status(404).json({ success: false, error: "Artifact not found" });
                return;
              }
              if (!(await concealProjectAccess(req, res, state.projectId, "Artifact"))) {
                return;
              }
              next();
            });
          '''
          if 'router.param("pipelineId"' not in text:
              if engine_anchor not in text:
                  raise SystemExit('pipeline engine anchor not found')
              text = text.replace(engine_anchor, resolver_block, 1)

          concept.write_text(text)

          index = Path('server/src/index.ts')
          index_text = index.read_text()
          old = 'createConceptRouter(agentRegistry, generationHistory)'
          new = 'createConceptRouter(agentRegistry, generationHistory, access)'
          if old in index_text:
              index_text = index_text.replace(old, new, 1)
          elif new not in index_text:
              raise SystemExit('concept router bootstrap anchor not found')
          index.write_text(index_text)
          PY
      - name: Format changed files
        run: node node_modules/prettier/bin/prettier.cjs --write server/src/routes/concept.ts server/src/index.ts server/src/__tests__/security2gE.concept-resource-resolvers.test.ts
      - name: Run focused resolver tests
        run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.concept-resource-resolvers.test.ts
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Commit resolver implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/routes/concept.ts server/src/index.ts server/src/__tests__/security2gE.concept-resource-resolvers.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): authorize concept pipeline and artifact resources"
          git push origin HEAD:agent/security-2g-e-rbac-parity
