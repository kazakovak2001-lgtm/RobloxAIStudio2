name: Temporary Inventory Finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-205-boundary-fixtures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate inventories for final tracked set
        run: |
          git rm .github/workflows/temp-inventory-finalize.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
      - name: Commit only canonical inventories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --only _inventory_raw.txt ProjectStructure.txt -m "chore(architecture): regenerate tracked inventories"
          git push origin HEAD:agent/arch-205-boundary-fixtures
