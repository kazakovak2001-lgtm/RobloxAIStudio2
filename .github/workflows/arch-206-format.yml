name: ARCH-206 Format Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-206-layer-debt-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format ARCH-206 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write scripts/architecture/layer-debt-evidence.ts server/src/__tests__/architecture.layer-debt-evidence.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: arch-206-formatted-files
          path: |
            scripts/architecture/layer-debt-evidence.ts
            server/src/__tests__/architecture.layer-debt-evidence.test.ts
          if-no-files-found: error
          retention-days: 1
