name: SECURITY-2G-E Unclassified Report

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: read

jobs:
  report:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - name: Report unclassified authorization operations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const matrix = JSON.parse(fs.readFileSync('config/security/authorization-matrix.json', 'utf8'));
          const unclassified = matrix.operations.filter((op) => op.classification === 'unclassified');
          const grouped = new Map();
          for (const op of unclassified) grouped.set(op.source, (grouped.get(op.source) || 0) + 1);
          console.log(`TOTAL_OPERATIONS=${matrix.operations.length}`);
          console.log(`UNCLASSIFIED=${unclassified.length}`);
          console.log(`CLASSIFIED=${matrix.operations.length - unclassified.length}`);
          for (const [source, count] of [...grouped.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))) {
            console.log(`${count}\t${source}`);
          }
          NODE
