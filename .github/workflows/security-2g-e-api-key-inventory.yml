name: SECURITY-2G-E API Key Inventory

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - name: List API-key eligible operations
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const matrix = JSON.parse(fs.readFileSync('config/security/authorization-matrix.json', 'utf8'));
          for (const op of matrix.operations.filter((item) => item.principal === 'user-session-or-api-key')) {
            console.log(JSON.stringify({source: op.source, operation: op.operation, capability: op.capability, resourceScope: op.resourceScope}));
          }
          NODE
