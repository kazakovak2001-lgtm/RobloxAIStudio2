name: RUNTIME-205 Merge Diagnostic

on:
  push:
    branches:
      - agent/runtime-2d-bounded-phases

permissions:
  contents: write

concurrency:
  group: runtime-205-merge-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-2d-bounded-phases
          fetch-depth: 0

      - name: Diagnose release merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/cutover-1e-candidate
          mkdir -p .ci
          set +e
          git merge --no-commit --no-ff origin/release/cutover-1e-candidate
          merge_status=$?
          set -e
          if [[ ${merge_status} -eq 0 ]]; then
            printf 'CLEAN\n' > .ci/runtime205-merge-diagnostic.txt
          else
            printf 'CONFLICTS\n' > .ci/runtime205-merge-diagnostic.txt
            git diff --name-only --diff-filter=U | sort >> .ci/runtime205-merge-diagnostic.txt
          fi
          git merge --abort || git reset --hard HEAD

      - name: Commit diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime205-merge-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/runtime205-merge-diagnostic.txt
          git commit --no-verify -m "chore(ci): record runtime 205 merge conflicts"
          git push origin HEAD:agent/runtime-2d-bounded-phases
