name: Sync CUTOVER-1C Acceptance Documentation

on:
  push:
    branches:
      - cutover/composed-release-topology

permissions:
  contents: write

concurrency:
  group: cutover-1c-doc-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/composed-release-topology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Synchronize canonical CUTOVER-1C records
        run: |
          python - <<'PY'
          from pathlib import Path

          result_path = Path("docs/00-project-control/CUTOVER-1C_COMPOSED_RELEASE.md")
          if result_path.exists():
              print("CUTOVER-1C documentation already synchronized")
              raise SystemExit(0)

          current_path = Path("docs/00-project-control/CURRENT_STATE.md")
          current = current_path.read_text()
          replacements = [
              (
                  "**Phase**: CUTOVER-1C — Cross-repository release composition",
                  "**Phase**: CUTOVER-1 — Release promotion and isolated legacy cleanup preparation",
              ),
              (
                  "STUDIO-1, CUTOVER-1A, and CUTOVER-1B are complete. CUTOVER-1C must now prove the composed frontend/backend release topology, CORS, cookies, authenticated REST, Socket.IO, and rollback before legacy frontend removal.",
                  "STUDIO-1 and CUTOVER-1A/1B/1C are complete. CI run #219 proved the composed HTTPS frontend/backend topology, secure host-only cookie authentication for REST and Socket.IO, production origin enforcement, PostgreSQL durability, and rollback preservation. Legacy frontend removal remains blocked pending release-baseline promotion, runtime dependency inventory, rollback rehearsal, and a separately reviewed cleanup change.",
              ),
              (
                  "- **Removal**: CUTOVER-1 is unblocked, but removal is allowed only after every gate in [FRONTEND_CUTOVER.md](./FRONTEND_CUTOVER.md) passes through a separately reviewed cleanup change.",
                  "- **Removal**: CUTOVER-1C is verified, but removal remains allowed only after release-baseline promotion, runtime dependency inventory, rollback rehearsal, and every gate in [FRONTEND_CUTOVER.md](./FRONTEND_CUTOVER.md) passes through a separately reviewed cleanup change.",
              ),
              (
                  "| CUTOVER-1B        | Standalone Frontend SSR release artifact                 | July 27, 2026 |",
                  "| CUTOVER-1B        | Standalone Frontend SSR release artifact                 | July 27, 2026 |\n| CUTOVER-1C        | Composed HTTPS release and authenticated transports       | July 27, 2026 |",
              ),
              (
                  "- **Standalone Frontend release image**: Frontend commit `1036c3ef9705d145cb9700cd14268a33d2abdd58` packages `.output` plus one shared worker-to-Node adapter as a non-root SSR process.\n- **Migration Runner**:",
                  "- **Standalone Frontend release image**: Frontend commit `1036c3ef9705d145cb9700cd14268a33d2abdd58` packages `.output` plus one shared worker-to-Node adapter as a non-root SSR process.\n- **Composed HTTPS release**: backend head `8bee44a284244033d73637b3e3cc4bddf72af035` and exact Frontend commit `1036c3ef9705d145cb9700cd14268a33d2abdd58` passed CI run `30312627413` (#219). Evidence artifact `8670986116` (`cutover-1c-composition-8bee44a284244033d73637b3e3cc4bddf72af035`, digest `sha256:6a941900d9b73bca852d1fe071f148d6ac19eae151b414a9e7f99aa3ad39b57a`) proves healthy PostgreSQL/backend/frontend/proxy services, HTTPS SSR and health, allowed/rejected production origins, secure host-only cookies, authenticated REST, unauthenticated Socket.IO rejection, and authenticated polling → WebSocket upgrade.\n- **Migration Runner**:",
              ),
              (
                  "- **Rollback inventory**: the prior combined `Dockerfile`, `deploy/nginx.conf`, and `deploy/docker-compose.yml` remain unchanged until composed-release and cleanup gates pass.",
                  "- **Rollback inventory**: revert focused PR #25 to remove the composed release; CUTOVER-1A and CUTOVER-1B remain independently deployable. The prior combined `Dockerfile`, `deploy/nginx.conf`, `deploy/docker-compose.yml`, and frozen root `src/` remain unchanged until promotion, rehearsal, and cleanup gates pass.",
              ),
              (
                  "## Last Changes\n\n- July 27, 2026: CUTOVER-1B completed",
                  "## Last Changes\n\n- July 27, 2026: CUTOVER-1C verified — backend head `8bee44a284244033d73637b3e3cc4bddf72af035` composed the exact Frontend release commit `1036c3ef9705d145cb9700cd14268a33d2abdd58` behind one HTTPS origin. CI run #219 and evidence artifact `8670986116` proved healthy services, SSR, CORS allow/deny behavior, secure host-only cookies, authenticated REST, unauthenticated Socket.IO rejection, and authenticated polling → WebSocket upgrade. The prior release stack and legacy frontend remain preserved for rollback. See `CUTOVER-1C_COMPOSED_RELEASE.md`.\n- July 27, 2026: CUTOVER-1B completed",
              ),
          ]
          for old, new in replacements:
              if old not in current:
                  raise SystemExit(f"CURRENT_STATE anchor missing: {old[:80]}")
              current = current.replace(old, new, 1)
          current_path.write_text(current)

          roadmap_path = Path("docs/00-project-control/ROADMAP_STATUS.md")
          roadmap = roadmap_path.read_text()
          replacements = [
              (
                  "| CUTOVER-1     | Release promotion and legacy frontend removal                  | High     | 🟡 Active — 1A/1B complete; 1C next | WORKSPACE-1, STUDIO-1 |",
                  "| CUTOVER-1     | Release promotion and legacy frontend removal                  | High     | 🟡 Active — 1A/1B/1C complete; promotion prep next | WORKSPACE-1, STUDIO-1 |",
              ),
              (
                  "See [`CUTOVER-1B_FRONTEND_SSR_RELEASE.md`](https://github.com/kazakovak2001-lgtm/Frontend/blob/main/docs/CUTOVER-1B_FRONTEND_SSR_RELEASE.md) for the completed standalone Frontend SSR release artifact.",
                  "See [`CUTOVER-1B_FRONTEND_SSR_RELEASE.md`](https://github.com/kazakovak2001-lgtm/Frontend/blob/main/docs/CUTOVER-1B_FRONTEND_SSR_RELEASE.md) for the completed standalone Frontend SSR release artifact.\nSee [CUTOVER-1C_COMPOSED_RELEASE.md](./CUTOVER-1C_COMPOSED_RELEASE.md) for the verified HTTPS composition, authenticated transport evidence, artifact identity, and rollback boundary.",
              ),
              (
                  "## Active CUTOVER-1 Gate\n\nCUTOVER-1A is complete. Backend CI run #195 built `Dockerfile.backend`, started the production container without root `src/`, and received HTTP 200 from `GET /health`.\n\nCUTOVER-1B is complete. Frontend PR #12 merged as `1036c3ef9705d145cb9700cd14268a33d2abdd58`; final CI run #65 built the non-root SSR image, verified independent `/health`, received an HTML document from `/`, and passed desktop/tablet/mobile responsive QA through the same shared Node adapter.\n\nThe prior combined Dockerfile, Nginx configuration, compose stack, and legacy frontend remain unchanged as rollback inventory.\n\nThe next slice is **CUTOVER-1C — cross-repository release composition**. It must compose the independently verified artifacts and prove exact origins, CORS, cookie behavior, authenticated REST, authenticated Socket.IO, health, and rollback before dependency pruning or legacy frontend removal.",
                  "## Active CUTOVER-1 Gate\n\nCUTOVER-1A is complete. Backend CI run #195 built `Dockerfile.backend`, started the production container without root `src/`, and received HTTP 200 from `GET /health`.\n\nCUTOVER-1B is complete. Frontend PR #12 merged as `1036c3ef9705d145cb9700cd14268a33d2abdd58`; final CI run #65 built the non-root SSR image, verified independent `/health`, received an HTML document from `/`, and passed desktop/tablet/mobile responsive QA through the same shared Node adapter.\n\nCUTOVER-1C is verified on backend head `8bee44a284244033d73637b3e3cc4bddf72af035`. CI run `30312627413` (#219) composed the exact Frontend commit `1036c3ef9705d145cb9700cd14268a33d2abdd58` behind `https://localhost:8443`. Evidence artifact `8670986116` proves healthy PostgreSQL/backend/frontend/proxy services, frontend and backend health, SSR HTML, allowed-origin credentialed preflight, disallowed-origin rejection, secure host-only cookies, authenticated REST, unauthenticated Socket.IO rejection, and authenticated polling → WebSocket upgrade.\n\nThe prior combined Dockerfile, Nginx configuration, compose stack, and legacy frontend remain unchanged as rollback inventory. The next gate is release-baseline promotion preparation, runtime dependency inventory, rollback rehearsal, and then a separately reviewed legacy cleanup change. PR #1 must still not be merged directly.",
              ),
              (
                  "- 🟡 CUTOVER-1C NEXT — cross-repository release composition and authenticated transport verification",
                  "- ✅ CUTOVER-1C COMPLETE — composed HTTPS release, secure cookies, REST, and Socket.IO transport verification passed\n- 🟡 CUTOVER-1 NEXT — release-baseline promotion preparation, runtime dependency inventory, and rollback rehearsal",
              ),
              (
                  "- **Current Cutover Decision**: ▶️ CUTOVER-1A and CUTOVER-1B complete; CUTOVER-1C composed-release verification is next",
                  "- **Current Cutover Decision**: ✅ CUTOVER-1A, CUTOVER-1B, and CUTOVER-1C are verified; release-baseline promotion preparation, dependency inventory, and rollback rehearsal are next before isolated legacy cleanup",
              ),
          ]
          for old, new in replacements:
              if old not in roadmap:
                  raise SystemExit(f"ROADMAP_STATUS anchor missing: {old[:80]}")
              roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap)

          decision_path = Path("docs/00-project-control/DECISION_LOG.md")
          decision = decision_path.read_text()
          anchor = "# Decision Log\n\nAll significant architectural and product decisions are recorded here.\n\n---\n"
          section = """# Decision Log

All significant architectural and product decisions are recorded here.

---

## 2026-07-27 — CUTOVER-1C Composed HTTPS Release

**Decision**: Compose the independently verified backend and standalone Frontend release artifacts behind one HTTPS origin. Reuse the existing Express API, Socket.IO server/client, cookie authentication, PostgreSQL storage, and Frontend adapters; do not introduce parallel transport or auth layers.
**Exact inputs**: Backend baseline `2bae4a1299e1094a5d3c3818adb158dbc1b26c77`; verified implementation head `8bee44a284244033d73637b3e3cc4bddf72af035`; exact Frontend release commit `1036c3ef9705d145cb9700cd14268a33d2abdd58`.
**Implementation**: `deploy/docker-compose.release.yml` composes PostgreSQL, backend, standalone Frontend, and an HTTPS Nginx proxy. HTTP and Socket.IO share one production-origin policy derived from `FRONTEND_URL`. Health checks use the Node runtime already present in both minimal images. The acceptance harness verifies secure host-only cookie attributes, authenticated REST, unauthenticated Socket.IO rejection, and authenticated polling-to-WebSocket upgrade.
**Verification**: CI run `30312627413` (#219) passed TypeScript, ESLint, Prettier, full tests, PostgreSQL restart E2E, backend image, repository validation, commitlint, Composed HTTPS Release, and Merge Gate. Evidence artifact `8670986116`, named `cutover-1c-composition-8bee44a284244033d73637b3e3cc4bddf72af035`, has digest `sha256:6a941900d9b73bca852d1fe071f148d6ac19eae151b414a9e7f99aa3ad39b57a`.
**Acceptance result**: Frontend health 200, backend health 200, SSR document 200, allowed CORS preflight 204, disallowed origin 403, authenticated `/api/platform/auth/me` 200, unauthenticated Socket.IO rejected, authenticated Socket.IO connected through polling and upgraded to WebSocket, and cookies remained `Secure`, `HttpOnly`, `SameSite=Lax`, and host-only.
**Rollback**: Revert focused PR #25. CUTOVER-1A and CUTOVER-1B remain independently deployable; the prior combined `Dockerfile`, `deploy/nginx.conf`, `deploy/docker-compose.yml`, and frozen root `src/` remain unchanged. No legacy dependency was pruned in this slice.
**Remaining gate**: Prepare release-baseline promotion, complete runtime dependency inventory, rehearse rollback, and remove the legacy frontend only in a separately reviewed cleanup change. Do not merge PR #1 directly.
**Status**: Verified; ready for focused PR merge.

---
"""
          if anchor not in decision:
              raise SystemExit("DECISION_LOG header anchor missing")
          decision_path.write_text(decision.replace(anchor, section, 1))

          result_path.write_text("""# CUTOVER-1C Composed HTTPS Release

**Status**: Verified  
**Verification date**: July 27, 2026  
**Tracking issue**: #24  
**Implementation pull request**: #25

## Objective

Compose the independently verified backend and standalone Frontend release artifacts behind one HTTPS origin and prove secure browser REST and Socket.IO behavior before any legacy dependency pruning or frontend removal.

## Reuse and Duplication Audit

The release reuses the existing Express API, Socket.IO server, production cookie authentication, PostgreSQL storage provider, standalone Frontend REST adapter, and standalone Frontend realtime client. No second API client, Socket.IO client, auth mechanism, cookie name, or embedded frontend implementation was introduced.

## Exact Release Inputs

- Backend baseline: `2bae4a1299e1094a5d3c3818adb158dbc1b26c77`
- Verified backend implementation head: `8bee44a284244033d73637b3e3cc4bddf72af035`
- Standalone Frontend release commit: `1036c3ef9705d145cb9700cd14268a33d2abdd58`
- CI run: `30312627413` (run #219)
- Evidence artifact ID: `8670986116`
- Evidence artifact name: `cutover-1c-composition-8bee44a284244033d73637b3e3cc4bddf72af035`
- Evidence digest: `sha256:6a941900d9b73bca852d1fe071f148d6ac19eae151b414a9e7f99aa3ad39b57a`

## Verified Topology

```text
https://localhost:8443
├── /                  → standalone Frontend SSR container
├── /api/*             → backend API container
├── /socket.io/*       → backend Socket.IO transport
└── /backend-health    → backend /health
```

PostgreSQL, backend, Frontend, and proxy were all healthy in the composed run. TLS terminated at Nginx while REST and Socket.IO shared the same browser origin and the same host-only access cookie.

## Acceptance Evidence

| Check | Result |
| --- | --- |
| Frontend `/health` | HTTP 200 |
| Backend `/backend-health` | HTTP 200 |
| Frontend SSR `/` | HTTP 200 with HTML document |
| Allowed credentialed CORS preflight | HTTP 204 |
| Disallowed production origin | HTTP 403 |
| Registration and secure cookies | Passed |
| Authenticated `/api/platform/auth/me` | HTTP 200 |
| Unauthenticated Socket.IO | Rejected with `Authentication required` |
| Authenticated Socket.IO | Connected with the issued access cookie |
| Engine.IO transport | Initial `polling`, upgraded to `websocket` |
| Cookie scope | `Secure`, `HttpOnly`, `SameSite=Lax`, host-only |

The artifact contains `compose-ps.txt`, `compose.log`, `smoke-events.jsonl`, and `smoke-result.json`. The final smoke result records `status: passed` and `authenticatedSocketTransport: websocket`.

## Delivered Boundary

- Release compose definition using independently built backend and Frontend images.
- HTTPS reverse proxy for SSR, REST, Socket.IO, and backend health.
- One shared production-origin policy for Express CORS and Socket.IO CORS.
- Removal of the unused `COOKIE_DOMAIN` release variable while preserving host-only cookies.
- Deterministic composition smoke evidence in CI.
- Aggregate Merge Gate dependency on the composed release job.

## Rollback

Revert focused PR #25. CUTOVER-1A and CUTOVER-1B remain independently verified and deployable. The prior combined `Dockerfile`, `deploy/nginx.conf`, `deploy/docker-compose.yml`, and frozen root `src/` were not modified or deleted, so they remain the rollback inventory.

## Remaining Gate

CUTOVER-1C does not authorize legacy frontend deletion. The next work must prepare release-baseline promotion, inventory every runtime/CI/deployment dependency on root `src/`, rehearse rollback, and then perform removal in a dedicated reviewed cleanup pull request. The oversized PR #1 remains prohibited from direct merge.
""")
          PY
      - name: Format and validate documentation
        run: |
          npx prettier --write \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/DECISION_LOG.md \
            docs/00-project-control/CUTOVER-1C_COMPOSED_RELEASE.md
          npm run format:check
          npm run validate
      - name: Commit documentation sync
        run: |
          if git diff --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/00-project-control
          git commit -m "docs(cutover): record composed release acceptance"
          git push origin HEAD:cutover/composed-release-topology
