name: Fix RUNTIME-204 Null Narrowing v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-autonomous:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply null-safe quality score narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server/src/orchestrator/AutonomousOrchestrator.ts")
          text = path.read_text()
          old = '''    if (phase === "repair" && session.qualityScore === null) return true;
              if (
                phase === "repair" &&
                session.qualityScore >= session.goals.targetScore
              ) {
                return true;
              }
              if (phase === "studio_sync" && session.executionMode === "simulation") {
                return true;
              }
              if (
                phase === "studio_sync" &&
                session.qualityScore !== null &&
                session.qualityScore < 50
              ) {
                return true;
              }
          '''
          new = '''    const qualityScore = session.qualityScore;
              if (phase === "repair" && qualityScore === null) return true;
              if (phase === "repair" && qualityScore >= session.goals.targetScore) {
                return true;
              }
              if (phase === "studio_sync" && session.executionMode === "simulation") {
                return true;
              }
              if (
                phase === "studio_sync" &&
                qualityScore !== null &&
                qualityScore < 50
              ) {
                return true;
              }
          '''
          if old not in text:
              raise SystemExit("Expected shouldSkip block was not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Format implementation file
        run: node node_modules/prettier/bin/prettier.cjs --write server/src/orchestrator/AutonomousOrchestrator.ts
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate orchestrator regression tests
        run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/orchestrator/AutonomousOrchestrator.test.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/orchestrator/AutonomousOrchestrator.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "fix(orchestrator): narrow optional quality evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
