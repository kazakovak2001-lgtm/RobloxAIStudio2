name: INTEGRATION-1A Contract Format Repair

on:
  pull_request:
    branches: [release/cutover-1e-candidate]
    paths:
      - .github/workflows/integration-1a-format-fix.yml
      - server/src/contracts/integration/api.ts

permissions:
  contents: write

jobs:
  format-contract:
    if: github.event.pull_request.number == 166 && github.head_ref == 'agent/integration-1a-contract-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format exact contract file
        run: node node_modules/prettier/bin/prettier.cjs --write server/src/contracts/integration/api.ts
      - name: Verify bounded change
        run: |
          test "$(git diff --name-only)" = "server/src/contracts/integration/api.ts"
          git diff --check
          node node_modules/prettier/bin/prettier.cjs --check server/src/contracts/integration/api.ts
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/contracts/integration/api.ts
          git commit -m "style(integration): format runtime API contract"
          git push origin HEAD:${{ github.head_ref }}
