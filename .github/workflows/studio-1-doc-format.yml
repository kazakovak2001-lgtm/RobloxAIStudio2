name: Format STUDIO-1 Documentation

on:
  push:
    branches:
      - docs/studio-1-complete
  pull_request:
    branches:
      - feature/plugin-merge

permissions:
  contents: write

concurrency:
  group: studio-1-doc-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format acceptance documentation
        run: |
          npx prettier --write \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1G_DESKTOP_ACCEPTANCE_RESULT.md
      - name: Commit formatting when required
        run: |
          if git diff --quiet; then
            echo "Documentation already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1G_DESKTOP_ACCEPTANCE_RESULT.md
          git commit -m "docs(studio): format acceptance records"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
