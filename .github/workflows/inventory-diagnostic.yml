name: Inventory Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    name: Regenerate Tracked Inventories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-c-sast-secrets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate and self-clean
        run: |
          git rm .github/workflows/inventory-diagnostic.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inventory_raw.txt ProjectStructure.txt project_structure.txt
          git commit -m "chore(repo): regenerate tracked inventories"
          git push origin HEAD:agent/security-2g-c-sast-secrets
