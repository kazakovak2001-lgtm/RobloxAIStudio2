name: Finalize RUNTIME-203 Clean

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-memory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format memory ownership files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            .github/workflows/runtime-203-finalize-clean.yml \
            config/runtime/runtime-ownership.json \
            package.json \
            scripts/validate-memory-ownership.ts
      - name: Validate memory ownership slice
        run: |
          npm run typecheck
          npm run validate:runtime
          npm run validate:memory
          npm run lint
          npm run format:check
      - name: Regenerate final tracked inventories
        run: |
          git rm .github/workflows/runtime-203-finalize-clean.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
          git restore --staged --worktree .github/workflows/runtime-203-finalize-clean.yml
      - name: Commit finalized memory gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/runtime/runtime-ownership.json \
            package.json \
            scripts/validate-memory-ownership.ts \
            _inventory_raw.txt \
            ProjectStructure.txt \
            project_structure.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "style(memory): finalize ownership gate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
