name: Security SAST and Secrets

on:
  pull_request:
  push:
    branches: [release/cutover-1e-candidate]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Backend CodeQL Evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      SECURITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact SAST source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: artifacts/security-sast
      - name: Bind SAST evidence to source
        if: always()
        run: |
          mkdir -p artifacts/security-sast
          jq --null-input \
            --arg controlId "SECURITY-2G-C" \
            --arg repository "kazakovak2001-lgtm/RobloxAIStudio2" \
            --arg sourceSha "$SECURITY_SOURCE_SHA" \
            --arg scanner "github-codeql/javascript-typescript" \
            --arg querySuite "security-extended" \
            '{controlId: $controlId, repository: $repository, sourceSha: $sourceSha, scanner: $scanner, language: "javascript-typescript", querySuite: $querySuite, blockingSeverity: "high", blockingConfidence: "high"}' \
            > artifacts/security-sast/evidence.json
      - name: Publish SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-2g-c-codeql-${{ env.SECURITY_SOURCE_SHA }}
          path: artifacts/security-sast
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Gitleaks Evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECURITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || '8dd23f88a0b23e2eedf5f2c38a36f0c12570cbab' }}
      SECURITY_HISTORY_BOUNDARY: 8dd23f88a0b23e2eedf5f2c38a36f0c12570cbab
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout exact secret-scan source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install exact validation dependencies
        run: npm ci --ignore-scripts
      - name: Validate security policy
        run: npm run validate:security-policy
      - name: Prepare changed-content scope
        run: |
          mkdir -p artifacts/security-secrets changed-content
          git diff --name-only --diff-filter=ACMR "$SECURITY_BASE_SHA" "$SECURITY_SOURCE_SHA" \
            > artifacts/security-secrets/changed-files.txt
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            [[ -f "$path" ]] || continue
            mkdir -p "changed-content/$(dirname "$path")"
            cp "$path" "changed-content/$path"
          done < artifacts/security-secrets/changed-files.txt
      - name: Scan pull-request changed content
        id: changed-scan
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/workspace" \
            ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION} \
            dir /workspace/changed-content \
            --redact=100 \
            --no-banner \
            --report-format json \
            --report-path /workspace/artifacts/security-secrets/changed-content.json
          status=$?
          set -e
          test -s artifacts/security-secrets/changed-content.json || printf '[]\n' > artifacts/security-secrets/changed-content.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Scan explicit bounded history
        id: history-scan
        shell: bash
        run: |
          test "$(git rev-parse "$SECURITY_HISTORY_BOUNDARY")" = "$SECURITY_HISTORY_BOUNDARY"
          set +e
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION} \
            git . \
            --log-opts="${SECURITY_HISTORY_BOUNDARY}..${SECURITY_SOURCE_SHA}" \
            --redact=100 \
            --no-banner \
            --report-format json \
            --report-path artifacts/security-secrets/bounded-history.json
          status=$?
          set -e
          test -s artifacts/security-secrets/bounded-history.json || printf '[]\n' > artifacts/security-secrets/bounded-history.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Bind secret evidence to source and scope
        if: always()
        env:
          CHANGED_STATUS: ${{ steps.changed-scan.outputs.status || '1' }}
          HISTORY_STATUS: ${{ steps.history-scan.outputs.status || '1' }}
        run: |
          mkdir -p artifacts/security-secrets
          test -f artifacts/security-secrets/changed-files.txt || : > artifacts/security-secrets/changed-files.txt
          test -f artifacts/security-secrets/changed-content.json || printf '[]\n' > artifacts/security-secrets/changed-content.json
          test -f artifacts/security-secrets/bounded-history.json || printf '[]\n' > artifacts/security-secrets/bounded-history.json
          changed_files="$(jq --raw-input --slurp 'split("\n") | map(select(length > 0))' artifacts/security-secrets/changed-files.txt)"
          jq --null-input \
            --arg controlId "SECURITY-2G-C" \
            --arg repository "kazakovak2001-lgtm/RobloxAIStudio2" \
            --arg sourceSha "$SECURITY_SOURCE_SHA" \
            --arg baseSha "$SECURITY_BASE_SHA" \
            --arg historyBoundary "$SECURITY_HISTORY_BOUNDARY" \
            --arg scanner "gitleaks" \
            --arg scannerVersion "$GITLEAKS_VERSION" \
            --argjson changedExitCode "$CHANGED_STATUS" \
            --argjson historyExitCode "$HISTORY_STATUS" \
            --argjson changedFiles "$changed_files" \
            '{controlId: $controlId, repository: $repository, sourceSha: $sourceSha, baseSha: $baseSha, historyBoundary: $historyBoundary, scanner: $scanner, scannerVersion: $scannerVersion, pullRequestScope: "changed-content", plaintextMaterialAllowed: false, changedExitCode: $changedExitCode, historyExitCode: $historyExitCode, changedFiles: $changedFiles}' \
            > artifacts/security-secrets/evidence.json
      - name: Publish secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-2g-c-gitleaks-${{ env.SECURITY_SOURCE_SHA }}
          path: artifacts/security-secrets
          if-no-files-found: error
          retention-days: 14
      - name: Enforce secret threshold
        env:
          CHANGED_STATUS: ${{ steps.changed-scan.outputs.status || '1' }}
          HISTORY_STATUS: ${{ steps.history-scan.outputs.status || '1' }}
        run: |
          test "$CHANGED_STATUS" -eq 0
          test "$HISTORY_STATUS" -eq 0

  security-gate:
    name: Security SAST and Secrets Gate
    runs-on: ubuntu-latest
    needs: [codeql, secrets]
    steps:
      - run: echo "SAST and secret checks passed"
