name: Refresh RUNTIME-201 Snapshots

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-snapshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate canonical inventories for final tracked set
        run: |
          git rm .github/workflows/runtime-201-snapshots.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
          git restore --staged --worktree .github/workflows/runtime-201-snapshots.yml
      - name: Commit canonical inventories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inventory_raw.txt ProjectStructure.txt project_structure.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "chore(runtime): refresh tracked inventories"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
