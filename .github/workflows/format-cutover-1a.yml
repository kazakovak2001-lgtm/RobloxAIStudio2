name: Format CUTOVER-1A Files

on:
  pull_request:
    branches:
      - feature/plugin-merge

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Format CUTOVER-1A files
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            deploy/docker-compose.backend.yml \
            docs/00-project-control/CUTOVER-1A_BACKEND_RELEASE_ARTIFACT.md \
            docs/00-project-control/ROADMAP_STATUS.md
      - name: Publish formatted files
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1a-formatted-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/ci.yml
            deploy/docker-compose.backend.yml
            docs/00-project-control/CUTOVER-1A_BACKEND_RELEASE_ARTIFACT.md
            docs/00-project-control/ROADMAP_STATUS.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
