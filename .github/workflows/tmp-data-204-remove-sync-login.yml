name: Temporary DATA-204 remove sync login

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/data-204-legacy-password-upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-204-legacy-password-upgrade
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded DATA-204 transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          auth_path = Path('server/src/platform/auth/AuthService.ts')
          auth = auth_path.read_text()
          old = '''  login(email: string, password: string, userId: string): LoginResult {
    const normalizedEmail = this.normalizeEmail(email);
    const creds = this.storage.get<StoredCredentials>(
      CREDENTIALS_COLLECTION,
      normalizedEmail,
    );
    if (!creds) {
      return { success: false, error: "Invalid credentials" };
    }
    if (creds.userId !== userId) {
      return { success: false, error: "Invalid credentials" };
    }

    // Migration path: if stored hash is legacy SHA-256 (64 hex chars, no bcrypt prefix)
    const isLegacySha256 = this.isLegacyHash(creds.passwordHash);

    let passwordValid = false;
    if (isLegacySha256) {
      const sha256Hash = createHash("sha256").update(password).digest("hex");
      passwordValid = sha256Hash === creds.passwordHash;
      if (passwordValid) {
        this.storage.set<StoredCredentials>(
          CREDENTIALS_COLLECTION,
          normalizedEmail,
          {
            ...creds,
            passwordHash: bcrypt.hashSync(password, BCRYPT_COST_FACTOR),
          },
        );
      }
    } else {
      passwordValid = bcrypt.compareSync(password, creds.passwordHash);
    }

    if (!passwordValid) {
      return { success: false, error: "Invalid credentials" };
    }

    const role =
      this.storage.get<UserRole>(ROLES_COLLECTION, userId) ?? "creator";
    const issued = this.createSession(userId, role);
    return this.toLoginResult(issued, userId, role);
  }

'''
          if auth.count(old) != 1:
              raise SystemExit(f'Expected one synchronous login block, found {auth.count(old)}')
          auth_path.write_text(auth.replace(old, ''))

          test_path = Path('server/src/__tests__/securityHardening.test.ts')
          test = test_path.read_text()
          test = test.replace(
              '    it("allows Bearer token in production", () => {',
              '    it("allows Bearer token in production", async () => {',
              1,
          )
          old_call = '''      const loginResult = authService.login(
        "sec-test@test.com",
        "password123",
        "user-sec-1",
      );'''
          new_call = '''      const loginResult = await authService.loginDurable(
        "sec-test@test.com",
        "password123",
        "user-sec-1",
      );'''
          if test.count(old_call) != 1:
              raise SystemExit(f'Expected one securityHardening login caller, found {test.count(old_call)}')
          test_path.write_text(test.replace(old_call, new_call))

          inventory_path = Path('config/durability/compatibility-write-inventory.json')
          inventory = json.loads(inventory_path.read_text())
          key = 'server/src/platform/auth/AuthService.ts#AuthService.login#set'
          matches = [entry for entry in inventory['entries'] if entry['key'] == key]
          if len(matches) != 1:
              raise SystemExit(f'Expected one inventory entry for {key}, found {len(matches)}')
          inventory['entries'] = [entry for entry in inventory['entries'] if entry['key'] != key]
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n')
          PY

      - name: Format changed files
        run: npx prettier --write server/src/platform/auth/AuthService.ts server/src/__tests__/securityHardening.test.ts config/durability/compatibility-write-inventory.json

      - name: Validate focused slice
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run server/src/__tests__/securityHardening.test.ts
          npm run validate:repository

      - name: Remove trigger artifact
        run: rm -f .data-204-trigger

      - name: Commit product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "DATA-204 remove synchronous legacy login compatibility"
          git push origin HEAD:agent/data-204-legacy-password-upgrade
