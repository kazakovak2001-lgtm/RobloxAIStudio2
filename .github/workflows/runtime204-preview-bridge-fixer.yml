name: RUNTIME-204 Preview Bridge Fixer

on:
  push:
    branches:
      - agent/runtime-2d-autonomous-truthfulness
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-204-preview-bridge-fixer
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-2d-autonomous-truthfulness
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Patch preview completion bridge and regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("server/src/index.ts")
          index_source = index_path.read_text()
          bridge_marker = '''      emitForProject("pipeline.completed", payload);
                break;
              }
              case "pipeline.failed": {'''
          bridge_replacement = '''      emitForProject("pipeline.completed", payload);
                break;
              }
              case "pipeline.preview.completed": {
                const payload = {
                  ...evt.data,
                  pipelineId: evt.pipelineId,
                  projectId: evt.projectId,
                  timestamp: evt.timestamp.toISOString(),
                  productionCompleted: false,
                };
                console.log(
                  "[pipeline-bridge] forwarding",
                  "pipeline.preview.completed",
                  payload,
                );
                emitForProject("pipeline.preview.completed", payload);
                break;
              }
              case "pipeline.failed": {'''

          if 'case "pipeline.preview.completed": {' not in index_source:
              if index_source.count(bridge_marker) != 1:
                  raise SystemExit("Expected exactly one pipeline bridge insertion point")
              index_source = index_source.replace(
                  bridge_marker,
                  bridge_replacement,
                  1,
              )
              index_path.write_text(index_source)

          test_path = Path("server/src/__tests__/autonomousPipelineIntegration.test.ts")
          test_source = test_path.read_text()
          import_marker = 'import { describe, it, expect } from "vitest";\n'
          import_line = 'import { readFileSync } from "node:fs";\n'
          if import_line not in test_source:
              if test_source.count(import_marker) != 1:
                  raise SystemExit("Expected exactly one Vitest import marker")
              test_source = test_source.replace(
                  import_marker,
                  import_marker + import_line,
                  1,
              )

          test_name = "Integration - Socket.IO preview completion bridge"
          if test_name not in test_source:
              test_source = test_source.rstrip() + '''

          describe("Integration - Socket.IO preview completion bridge", () => {
            it("forwards preview terminal metadata without promoting production completion", () => {
              const source = readFileSync(new URL("../index.ts", import.meta.url), "utf8");
              const start = source.indexOf('case "pipeline.preview.completed": {');
              const end = source.indexOf('case "pipeline.failed": {', start);

              expect(start).toBeGreaterThan(-1);
              expect(end).toBeGreaterThan(start);

              const previewCase = source.slice(start, end);
              expect(previewCase).toContain("...evt.data");
              expect(previewCase).toContain("productionCompleted: false");
              expect(previewCase).toContain(
                'emitForProject("pipeline.preview.completed", payload)',
              );
              expect(previewCase).not.toContain("projectRepository.update");
            });
          });
          ''' + "\n"
              test_path.write_text(test_source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed TypeScript
        run: npx prettier --write server/src/index.ts server/src/__tests__/autonomousPipelineIntegration.test.ts

      - name: Validate changed-file lint
        run: npx eslint server/src/index.ts server/src/__tests__/autonomousPipelineIntegration.test.ts --max-warnings 0

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run focused autonomous integration tests
        run: npm test -- server/src/__tests__/autonomousPipelineIntegration.test.ts

      - name: Remove one-shot fixer
        run: git rm .github/workflows/runtime204-preview-bridge-fixer.yml

      - name: Commit validated bridge fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts server/src/__tests__/autonomousPipelineIntegration.test.ts
          git commit --no-verify -m "fix(runtime): forward preview completion to sockets"
          git push origin HEAD:agent/runtime-2d-autonomous-truthfulness
