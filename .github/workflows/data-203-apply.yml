name: Temporary DATA-203 apply

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/data-203-session-activity-durable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-203-session-activity-durable
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded DATA-203 transformation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "server/src/platform/auth/AuthService.ts",
              '''  validateToken(token: string): AuthSession | null {
              const session = this.storage.get<StoredAuthSession>(
                SESSIONS_COLLECTION,
                token,
              );
              if (!session) return null;
              if (Date.now() > session.expiresAt) {
                this.deleteSession(session);
                return null;
              }
              const updated = { ...session, lastActivity: Date.now() };
              this.storage.set(SESSIONS_COLLECTION, token, updated);
              return this.toPublicSession(updated);
            }''',
              '''  async validateToken(token: string): Promise<AuthSession | null> {
              const session = this.storage.get<StoredAuthSession>(
                SESSIONS_COLLECTION,
                token,
              );
              if (!session) return null;
              if (Date.now() > session.expiresAt) {
                this.deleteSession(session);
                return null;
              }
              const updated = { ...session, lastActivity: Date.now() };
              await this.storage.setDurable(SESSIONS_COLLECTION, token, updated);
              return this.toPublicSession(updated);
            }''',
          )

          security = Path("server/src/common/middleware/security.ts")
          text = security.read_text()
          text, count = re.subn(
              r"export function authMiddleware\((.*?)\n\): void \{",
              r"export async function authMiddleware(\1\n): Promise<void> {",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"security middleware signature: expected one match, found {count}")

          for token_expr in ("token", "cookieToken"):
              old = f"    const session = authService.validateToken({token_expr});"
              new = f'''    let session;
              try {{
                session = await authService.validateToken({token_expr});
              }} catch {{
                res.status(503).json({{
                  success: false,
                  error: "Authentication persistence unavailable",
                }});
                return;
              }}'''
              if text.count(old) != 1:
                  raise SystemExit(f"security {token_expr}: expected one match")
              text = text.replace(old, new, 1)
          security.write_text(text)

          test = Path("server/src/__tests__/securityHardening.test.ts")
          text = test.read_text()
          if 'import { describe, it, expect } from "vitest";' not in text:
              raise SystemExit("vitest import guard failed")
          text = text.replace(
              'import { describe, it, expect } from "vitest";',
              'import { describe, it, expect, vi } from "vitest";',
              1,
          )

          marker = '  describe("Auth middleware logic", () => {'
          if text.count(marker) != 1:
              raise SystemExit("auth middleware test marker guard failed")
          durable_tests = '''  describe("Durable session activity", () => {
            it("publishes session activity only after durable acknowledgement", async () => {
              const now = vi.spyOn(Date, "now").mockReturnValue(1_000);
              const storage = new InMemoryStorageProvider();
              const auth = new AuthService(storage);
              auth.register("activity@test.com", "password123", "activity-user");
              const login = auth.login("activity@test.com", "password123", "activity-user");
              const token = login.token!;
              const before = storage.get<{ lastActivity: number }>("auth_sessions", token)!;
              let releaseMutation: (() => void) | undefined;
              const originalSetDurable = storage.setDurable.bind(storage);
              storage.setDurable = async (collection, id, data) => {
                await new Promise<void>((resolve) => {
                  releaseMutation = resolve;
                });
                await originalSetDurable(collection, id, data);
              };
              now.mockReturnValue(2_000);

              let settled = false;
              const pending = auth.validateToken(token).finally(() => {
                settled = true;
              });
              await Promise.resolve();

              expect(settled).toBe(false);
              expect(storage.get<{ lastActivity: number }>("auth_sessions", token)?.lastActivity).toBe(before.lastActivity);
              if (!releaseMutation) throw new Error("Durable activity mutation was not blocked");
              releaseMutation();
              await expect(pending).resolves.toMatchObject({ lastActivity: 2_000 });
              expect(storage.get<{ lastActivity: number }>("auth_sessions", token)?.lastActivity).toBe(2_000);
              now.mockRestore();
            });

            it("preserves acknowledged activity when persistence rejects", async () => {
              const now = vi.spyOn(Date, "now").mockReturnValue(1_000);
              const storage = new InMemoryStorageProvider();
              const auth = new AuthService(storage);
              auth.register("reject@test.com", "password123", "reject-user");
              const login = auth.login("reject@test.com", "password123", "reject-user");
              const token = login.token!;
              const before = storage.get<{ lastActivity: number }>("auth_sessions", token)!;
              storage.setDurable = async () => {
                throw new Error("rejected activity write");
              };
              now.mockReturnValue(2_000);

              await expect(auth.validateToken(token)).rejects.toThrow("rejected activity write");
              expect(storage.get<{ lastActivity: number }>("auth_sessions", token)?.lastActivity).toBe(before.lastActivity);
              now.mockRestore();
            });
          });

'''
          text = text.replace(marker, durable_tests + marker, 1)

          start = text.index(marker)
          section = text[start:]
          section = re.sub(r'(it\([^\n]+, )\(\) => \{', r'\1async () => {', section)
          section = re.sub(r'(?<!await )authMiddleware\(', 'await authMiddleware(', section)
          text = text[:start] + section
          test.write_text(text)

          inventory = Path("config/durability/compatibility-write-inventory.json")
          text = inventory.read_text()
          pattern = re.compile(
              r'\s*\{\s*"key": "server/src/platform/auth/AuthService\.ts#AuthService\.validateToken#set".*?"migrationTarget": "DATA-201B"\s*\},?',
              re.S,
          )
          text, count = pattern.subn("", text, count=1)
          if count != 1:
              raise SystemExit(f"inventory guard: expected one match, found {count}")
          inventory.write_text(text)
          PY

      - name: Format changed files
        run: npx prettier --write server/src/platform/auth/AuthService.ts server/src/common/middleware/security.ts server/src/__tests__/securityHardening.test.ts config/durability/compatibility-write-inventory.json

      - name: Validate focused slice
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run server/src/__tests__/securityHardening.test.ts
          npm run validate:repository

      - name: Remove temporary handoff artifacts
        run: rm -f data-203.patch docs/00-project-control/DATA-203_IMPLEMENTATION_HANDOFF.md docs/00-project-control/DATA-203_TRIGGER.md docs/00-project-control/DATA-203_TRIGGER_2.md docs/00-project-control/DATA-203_TRIGGER_3.md

      - name: Commit product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "DATA-203 await session activity mutation"
          git push origin HEAD:agent/data-203-session-activity-durable
