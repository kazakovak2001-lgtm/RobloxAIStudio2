name: SECURITY-2G-F Bounded Format

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate
    paths:
      - .github/workflows/security-2g-f-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 162 && github.event.pull_request.head.ref == 'agent/security-2g-f-consolidated-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-f-consolidated-gate
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format exact SECURITY-2G-F files
        run: npx prettier --write config/security/consolidated-gate.json scripts/validate-security-consolidated-gate.ts
      - name: Verify bounded diff
        run: |
          unexpected="$(git diff --name-only | grep -v -E '^(config/security/consolidated-gate\.json|scripts/validate-security-consolidated-gate\.ts)$' || true)"
          test -z "$unexpected"
          git diff --check
      - name: Commit formatting
        run: |
          git add -- config/security/consolidated-gate.json scripts/validate-security-consolidated-gate.ts
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(security): format consolidated gate files'
          git push origin HEAD:agent/security-2g-f-consolidated-gate
