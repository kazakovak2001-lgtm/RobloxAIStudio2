name: SECURITY-2G-E Readiness CI Repair Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-security2gE-readiness-ci-repair.py
      - name: Verify immutable Frontend RBAC adapter
        uses: actions/checkout@v4
        with:
          repository: kazakovak2001-lgtm/Frontend
          ref: 022788ace31982e2b08ea099800de784b4dbe482
          path: readiness-frontend
          persist-credentials: false
      - name: Exercise RBAC contract adaptation
        run: |
          test "$(git -C readiness-frontend hash-object scripts/e2e-backend.mjs)" = "e8b110aa0ba24c46f76f994ced7760b820a6e5fe"
          node scripts/security/adapt-int201-rbac-contract.mjs readiness-frontend/scripts/e2e-backend.mjs
          grep -F 'analytics operator boundary' readiness-frontend/scripts/e2e-backend.mjs
          grep -F 'Analytics operator access required' readiness-frontend/scripts/e2e-backend.mjs
          ! grep -F 'Analytics module returned an empty contract' readiness-frontend/scripts/e2e-backend.mjs
      - name: Format affected files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            .github/workflows/ci.yml \
            scripts/security/adapt-int201-rbac-contract.mjs \
            server/src/platform/security/__tests__/ApiKeyStore.test.ts \
            server/src/routes/__tests__/studioDurability.test.ts
      - name: Run complete test suite
        run: npm run test
      - run: npm run typecheck
      - run: npm run validate
      - name: Remove finalizer inputs and regenerate exact inventories
        run: |
          rm -rf readiness-frontend
          git rm .github/workflows/security-2g-e-readiness-ci-repair-finalizer.yml
          git rm scripts/apply-security2gE-readiness-ci-repair.py
          node scripts/cleanup/generate-tracked-inventories.mjs
          node scripts/cleanup/audit-legacy-frontend-decommission.mjs
      - name: Publish atomic readiness repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/ci.yml \
            scripts/security/adapt-int201-rbac-contract.mjs \
            server/src/platform/security/__tests__/ApiKeyStore.test.ts \
            server/src/routes/__tests__/studioDurability.test.ts \
            _inventory_raw.txt \
            ProjectStructure.txt \
            .github/workflows/security-2g-e-readiness-ci-repair-finalizer.yml \
            scripts/apply-security2gE-readiness-ci-repair.py
          git diff --cached --quiet && exit 0
          git commit -m "test(security): align readiness contracts"
          git push origin HEAD:agent/security-2g-e-rbac-parity
