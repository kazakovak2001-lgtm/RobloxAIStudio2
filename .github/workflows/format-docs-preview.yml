name: Format Docs Preview

on:
  pull_request:
    branches: [feature/plugin-merge]

permissions:
  contents: read

jobs:
  format-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format changed project-control documents
        run: |
          npx prettier --write \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1F_DESKTOP_FINDINGS_AND_RERUN.md
      - name: Publish formatted documents
        uses: actions/upload-artifact@v4
        with:
          name: formatted-studio-1-docs-${{ github.sha }}
          path: |
            docs/00-project-control/CURRENT_STATE.md
            docs/00-project-control/ROADMAP_STATUS.md
            docs/00-project-control/STUDIO-1F_DESKTOP_FINDINGS_AND_RERUN.md
          if-no-files-found: error
          retention-days: 1
