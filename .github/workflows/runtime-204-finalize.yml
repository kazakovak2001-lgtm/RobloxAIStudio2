name: Finalize RUNTIME-204

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-autonomous:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format autonomous truthfulness files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            .github/workflows/runtime-204-finalize.yml \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/OrchestratorTypes.ts \
            server/src/orchestrator/index.ts \
            server/src/routes/autonomous.ts \
            server/src/types/pipeline-events.ts
      - name: Validate autonomous truthfulness slice
        run: |
          npm run typecheck
          npm run validate:runtime
          npm run validate:memory
          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/orchestrator/AutonomousOrchestrator.test.ts
          npm run lint
          npm run format:check
      - name: Regenerate final tracked inventories
        run: |
          git rm .github/workflows/runtime-204-finalize.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
          git restore --staged --worktree .github/workflows/runtime-204-finalize.yml
      - name: Commit finalized autonomous slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/OrchestratorTypes.ts \
            server/src/orchestrator/index.ts \
            server/src/routes/autonomous.ts \
            server/src/types/pipeline-events.ts \
            _inventory_raw.txt \
            ProjectStructure.txt \
            project_structure.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "style(orchestrator): finalize preview truthfulness"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
