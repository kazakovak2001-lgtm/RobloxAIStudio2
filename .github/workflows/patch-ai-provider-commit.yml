name: Patch AI Provider Commit Evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-commit-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch migration commit step
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ai-provider-cycle-migrate.yml")
          content = path.read_text(encoding="utf-8")
          old = '''      - name: Commit migration
                run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A server/src scripts/validate-boundaries.ts architecture.manifest.json \\
                    _inventory_raw.txt ProjectStructure.txt project_structure.txt
                  if git diff --cached --quiet; then
                    echo "Migration already applied."
                    exit 0
                  fi
                  git commit -m "refactor(arch): remove AI provider dependency cycle"
                  git push origin HEAD:${{ github.event.pull_request.head.ref }}
          '''
          new = '''      - name: Capture commit and push evidence
                run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A server/src scripts/validate-boundaries.ts architecture.manifest.json \\
                    _inventory_raw.txt ProjectStructure.txt project_structure.txt
                  git status --short > git-status.log
                  git diff --cached --stat > git-staged-stat.log
                  if git diff --cached --quiet; then
                    echo "Migration already applied." > commit.log
                    echo "0" > commit.exit
                    echo "0" > push.exit
                    : > push.log
                  else
                    set +e
                    git commit -m "refactor(arch): remove AI provider dependency cycle" \\
                      > commit.log 2>&1
                    echo "$?" > commit.exit
                    if test "$(cat commit.exit)" = "0"; then
                      git push origin HEAD:agent/arch-204-cycle-reduction \\
                        > push.log 2>&1
                      echo "$?" > push.exit
                    else
                      echo "Push skipped because commit failed." > push.log
                      echo "1" > push.exit
                    fi
                    set -e
                  fi

              - name: Upload commit and push evidence
                uses: actions/upload-artifact@v4
                with:
                  name: ai-provider-migration-commit-evidence
                  path: |
                    git-status.log
                    git-staged-stat.log
                    commit.log
                    commit.exit
                    push.log
                    push.exit
                  if-no-files-found: error

              - name: Enforce commit and push result
                run: |
                  echo "commit=$(cat commit.exit) push=$(cat push.exit)"
                  test "$(cat commit.exit)" = "0"
                  test "$(cat push.exit)" = "0"
          '''
          if old in content:
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
          elif "Capture commit and push evidence" not in content:
              raise SystemExit("Expected migration commit block not found")
          PY

      - name: Commit workflow patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ai-provider-cycle-migrate.yml
          if git diff --cached --quiet; then
            echo "Commit evidence patch already applied."
            exit 0
          fi
          git commit -m "ci(arch): capture migration commit evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
