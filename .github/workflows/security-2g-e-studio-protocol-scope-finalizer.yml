name: SECURITY-2G-E Studio Protocol Scope Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-security2gE-studio-protocol-scope.py
      - name: Apply protocol type corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/src/routes/studio.ts')
          text = path.read_text()
          text = text.replace(
              'const response = await dispatcher.dispatch(message);',
              'const response = await dispatcher.dispatch(\n        message as unknown as Parameters<typeof dispatcher.dispatch>[0],\n      );',
              1,
          )
          text = text.replace(
              'const { pluginVersion, studioVersion, projectName, projectId, protocolVersion } =',
              'const { pluginVersion, studioVersion, projectId, protocolVersion } =',
              1,
          )
          path.write_text(text)
          PY
      - run: node --import tsx scripts/generate-authorization-matrix.ts
      - run: node node_modules/prettier/bin/prettier.cjs --write server/src/routes/studio.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.studio-protocol-scope.test.ts
      - run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.studio-protocol-scope.test.ts server/src/__tests__/security2gE.studio-client-scope.test.ts server/src/__tests__/security2gE.studio-project-parity.test.ts server/src/__tests__/harden2a.auth-contract.test.ts
      - run: npm run typecheck
      - name: Publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/routes/studio.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.studio-protocol-scope.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): scope studio protocol resources"
          git push origin HEAD:agent/security-2g-e-rbac-parity
