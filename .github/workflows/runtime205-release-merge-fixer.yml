name: RUNTIME-205 Release Merge Fixer

on:
  push:
    branches:
      - agent/runtime-2d-bounded-phases

permissions:
  contents: write

concurrency:
  group: runtime-205-release-merge-fixer
  cancel-in-progress: true

jobs:
  merge-fix-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-2d-bounded-phases
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Merge release and resolve bounded orchestrator conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/cutover-1e-candidate
          set +e
          git merge --no-commit --no-ff origin/release/cutover-1e-candidate
          merge_status=$?
          set -e
          if [[ ${merge_status} -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              "server/src/orchestrator/AutonomousOrchestrator.test.ts"
              "server/src/orchestrator/AutonomousOrchestrator.ts"
            )
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}"
              exit 1
            fi
            git checkout --ours -- "${expected[@]}"
            git add "${expected[@]}"
          fi
          python scripts/fix-runtime205-release-merge.py

      - name: Remove one-shot helpers and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime205-release-merge-fixer.yml
          git rm scripts/fix-runtime205-release-merge.py
          git rm -f .ci/runtime205-merge-diagnostic.txt

      - name: Install dependencies
        run: npm ci

      - name: Format changed TypeScript
        run: |
          npx prettier --write \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts

      - name: Validate focused lint
        run: |
          npx eslint \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            --max-warnings 0

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run focused orchestrator tests
        run: npm test -- server/src/orchestrator/AutonomousOrchestrator.test.ts server/src/orchestrator/AutonomousBoundedPhases.test.ts

      - name: Validate repository formatting
        run: npm run format:check

      - name: Commit validated release merge
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(runtime): preserve bounded execution invariants"
          git push origin HEAD:agent/runtime-2d-bounded-phases
