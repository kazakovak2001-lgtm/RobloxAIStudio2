name: SECURITY-2G-E Refresh Inventories

on:
  push:
    branches:
      - agent/security-2g-e-rbac-parity
    paths:
      - .github/workflows/security-2g-e-refresh-inventories.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate tracked inventories
        run: node scripts/cleanup/generate-tracked-inventories.mjs
      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -v -E '^(_inventory_raw\.txt|ProjectStructure\.txt)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected generated paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
      - name: Commit inventory snapshots
        shell: bash
        run: |
          set -euo pipefail
          git add -- _inventory_raw.txt ProjectStructure.txt
          if git diff --cached --quiet; then
            echo 'Inventories already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): refresh tracked inventories'
          git push origin HEAD:agent/security-2g-e-rbac-parity
