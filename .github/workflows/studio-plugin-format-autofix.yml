name: Studio Plugin Format Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            server/src/__tests__/studio1.plugin-contract.test.ts \
            studio-plugin/README.md \
            docs/00-project-control/STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md
          tar -czf studio-plugin-formatted.tgz \
            server/src/__tests__/studio1.plugin-contract.test.ts \
            studio-plugin/README.md \
            docs/00-project-control/STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio-plugin-formatted-${{ github.sha }}
          path: studio-plugin-formatted.tgz
          retention-days: 2
