name: SECURITY-2G-E Remaining Inventory

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - name: Print unclassified operations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const matrix = JSON.parse(fs.readFileSync('config/security/authorization-matrix.json', 'utf8'));
          const remaining = matrix.operations.filter((item) => item.classification === 'unclassified');
          console.log(JSON.stringify({ count: remaining.length, remaining }, null, 2));
          NODE
