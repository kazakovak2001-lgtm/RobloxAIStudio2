name: DATA-206 Push Transform

on:
  push:
    branches:
      - agent/data-206-auth-compatibility-writes

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-206-auth-compatibility-writes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply bounded migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          auth = Path('server/src/platform/auth/AuthService.ts')
          text = auth.read_text()

          constructor = '''  ) {
            // In-memory and already-hydrated providers migrate immediately. PostgreSQL
            // is migrated a second time after its cache is hydrated during bootstrap.
            this.migrateLegacyRefreshCredentials();
          }
'''
          if constructor not in text:
            raise SystemExit('constructor migration hook not found')
          text = text.replace(constructor, '  ) {}\n')

          text, count = re.subn(
            r'\n  register\(.*?\n  \}\n\n  prepareRegistration',
            '''\n  async registerDurable(
            email: string,
            password: string,
            userId: string,
            role: UserRole = "creator",
          ): Promise<boolean> {
            const prepared = this.prepareRegistration(email, password, userId, role);
            try {
              await this.storage.applyDurableBatch(prepared.mutations);
              return true;
            } catch (error) {
              if (error instanceof DurableStorageConflictError) return false;
              throw error;
            }
          }

          prepareRegistration''',
            text,
            flags=re.S,
          )
          if count != 1: raise SystemExit(f'register replacement count={count}')

          for pattern, replacement, label in [
            (r'\n  logout\(token: string\): boolean \{.*?\n  \}\n\n  async logoutDurable', '\n  async logoutDurable', 'logout'),
            (r'\n  refreshSession\(refreshToken: string\): LoginResult \{.*?\n  \}\n\n  async refreshSessionDurable', '\n  async refreshSessionDurable', 'refreshSession'),
            (r'\n  private createSession\(userId: string, role: UserRole\): IssuedSession \{.*?\n  \}\n\n  private prepareSession', '\n  private prepareSession', 'createSession'),
            (r'\n  private deleteSession\(session: StoredAuthSession\): boolean \{.*?\n  \}\n', '\n', 'deleteSession'),
          ]:
            text, count = re.subn(pattern, replacement, text, flags=re.S)
            if count != 1: raise SystemExit(f'{label} replacement count={count}')

          text = text.replace(
            '      this.deleteSession(session);\n      return null;',
            '      await this.logoutDurable(session.token);\n      return null;',
          )
          text = text.replace(
            '  migrateLegacyRefreshCredentials(): number {',
            '  async migrateLegacyRefreshCredentialsDurable(): Promise<number> {',
          )

          old = '''      if (sessionChanged) {
                this.storage.set(
                  SESSIONS_COLLECTION,
                  migratedSession.token,
                  migratedSession,
                );
              }

              let indexChanged = false;
              if (digest && refreshExpiresAt) {
                if (
                  existingIndex?.sessionToken !== migratedSession.token ||
                  existingIndex.expiresAt !== refreshExpiresAt
                ) {
                  this.storage.set<RefreshCredentialRecord>(
                    REFRESH_CREDENTIALS_COLLECTION,
                    digest,
                    {
                      sessionToken: migratedSession.token,
                      expiresAt: refreshExpiresAt,
                    },
                  );
                  indexChanged = true;
                }
              }
              if (sessionChanged || indexChanged) migrated += 1;'''
          new = '''      const mutations: DurableMutation[] = [];
              if (sessionChanged) {
                mutations.push({
                  operation: "set",
                  collection: SESSIONS_COLLECTION,
                  id: migratedSession.token,
                  data: migratedSession,
                });
              }

              if (
                digest &&
                refreshExpiresAt &&
                (existingIndex?.sessionToken !== migratedSession.token ||
                  existingIndex.expiresAt !== refreshExpiresAt)
              ) {
                mutations.push({
                  operation: "set",
                  collection: REFRESH_CREDENTIALS_COLLECTION,
                  id: digest,
                  data: {
                    sessionToken: migratedSession.token,
                    expiresAt: refreshExpiresAt,
                  } satisfies RefreshCredentialRecord,
                });
              }
              if (mutations.length > 0) {
                await this.storage.applyDurableBatch(mutations);
                migrated += 1;
              }'''
          if old not in text: raise SystemExit('legacy migration write block not found')
          text = text.replace(old, new)
          auth.write_text(text)

          for path in Path('server/src').rglob('*.ts'):
            if path == auth or '/_quarantine/' in str(path):
              continue
            source = path.read_text()
            source = re.sub(r'(?<!await )([A-Za-z0-9_$.]+)\.register\(', r'await \1.registerDurable(', source)
            source = re.sub(r'(?<!await )([A-Za-z0-9_$.]+)\.refreshSession\(', r'await \1.refreshSessionDurable(', source)
            source = re.sub(r'(?<!await )([A-Za-z0-9_$.]+)\.logout\(', r'await \1.logoutDurable(', source)
            source = re.sub(r'(?<!await )([A-Za-z0-9_$.]+)\.migrateLegacyRefreshCredentials\(\)', r'await \1.migrateLegacyRefreshCredentialsDurable()', source)
            path.write_text(source)

          registry = Path('config/durability/compatibility-write-inventory.json')
          parsed = json.loads(registry.read_text())
          parsed['entries'] = [e for e in parsed['entries'] if e['path'] != 'server/src/platform/auth/AuthService.ts']
          registry.write_text(json.dumps(parsed, indent=2) + '\n')
          PY
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/data-206-transform.yml
          git rm .github/workflows/data-206-push-transform.yml
      - name: Format and validate
        run: |
          npx prettier --write server/src config/durability/compatibility-write-inventory.json
          npm run typecheck
          npm run lint
          npm run validate
          npm run test
      - name: Refresh inventories and commit
        run: |
          node scripts/cleanup/generate-tracked-inventories.mjs
          npm run repo:validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add server/src config/durability/compatibility-write-inventory.json _inventory_raw.txt ProjectStructure.txt project_structure.txt
          git commit -m "refactor(data-206): remove auth compatibility writes"
          git push origin HEAD:agent/data-206-auth-compatibility-writes
