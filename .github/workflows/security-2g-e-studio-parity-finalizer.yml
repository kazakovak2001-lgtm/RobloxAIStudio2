name: SECURITY-2G-E Studio Parity Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add Studio project authorization guards and matrix entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          studio = Path('server/src/routes/studio.ts')
          source = studio.read_text()
          import_anchor = 'import type { StudioArtifactReceipt } from "../studio/v2/StudioTypes";\n'
          access_import = 'import type { ProjectAccessControl } from "./projects";\n'
          if access_import not in source:
              source = source.replace(import_anchor, import_anchor + access_import, 1)

          old_signature = '''export function createStudioRouter(
            runtimeOrStore?: StudioRuntime | ArtifactStore,
          ): Router {'''
          new_signature = '''export function createStudioRouter(
            runtimeOrStore?: StudioRuntime | ArtifactStore,
            access?: ProjectAccessControl,
          ): Router {'''
          if 'access?: ProjectAccessControl' not in source:
              source = source.replace(old_signature, new_signature, 1)

          source = source.replace(
              'router.post("/connect", async (req, res) => {\n    const { studioVersion, projectId } = req.body;',
              'router.post("/connect", async (req, res) => {\n    const { studioVersion, projectId } = req.body;',
              1,
          )
          connect_anchor = '''    if (!studioVersion || typeof studioVersion !== "string") {
              res.status(400).json({
                success: false,
                error: "studioVersion is required",
              });
              return;
            }

            const client = bridge.connect(studioVersion, projectId);'''
          connect_guard = '''    if (!studioVersion || typeof studioVersion !== "string") {
              res.status(400).json({
                success: false,
                error: "studioVersion is required",
              });
              return;
            }
            if (!projectId || typeof projectId !== "string") {
              res.status(400).json({ success: false, error: "projectId is required" });
              return;
            }
            if (!access || !(await access.requireProjectAccess(req, res, projectId))) {
              return;
            }

            const client = bridge.connect(studioVersion, projectId);'''
          if 'access.requireProjectAccess(req, res, projectId)' not in source:
              if connect_anchor not in source:
                  raise SystemExit('studio connect anchor not found')
              source = source.replace(connect_anchor, connect_guard, 1)

          source = source.replace(
              'router.post("/sync/project", (req, res) => {',
              'router.post("/sync/project", async (req, res) => {',
              1,
          )
          sync_anchor = '''    const lookupId = executionId ?? projectId;
            if (!lookupId || typeof lookupId !== "string") {
              res.status(400).json({
                success: false,
                error: "projectId or executionId is required",
              });
              return;
            }
            const snapshot = runtime.getProjectSnapshot(lookupId);'''
          sync_guard = '''    const lookupId = executionId ?? projectId;
            if (!projectId || typeof projectId !== "string") {
              res.status(400).json({ success: false, error: "projectId is required" });
              return;
            }
            if (!access || !(await access.requireProjectAccess(req, res, projectId))) {
              return;
            }
            if (!lookupId || typeof lookupId !== "string") {
              res.status(400).json({
                success: false,
                error: "projectId or executionId is required",
              });
              return;
            }
            const snapshot = runtime.getProjectSnapshot(lookupId);'''
          if source.count('access.requireProjectAccess(req, res, projectId)') < 2:
              if sync_anchor not in source:
                  raise SystemExit('studio sync project anchor not found')
              source = source.replace(sync_anchor, sync_guard, 1)

          source = source.replace(
              'router.get("/sync/status", (req, res) => {',
              'router.get("/sync/status", async (req, res) => {',
              1,
          )
          status_anchor = '''    const projectId = req.query.projectId as string | undefined;
            const status = runtime.getSyncStatus(projectId);'''
          status_guard = '''    const projectId = req.query.projectId as string | undefined;
            if (!projectId) {
              res.status(400).json({ success: false, error: "projectId is required" });
              return;
            }
            if (!access || !(await access.requireProjectAccess(req, res, projectId))) {
              return;
            }
            const status = runtime.getSyncStatus(projectId);'''
          if source.count('access.requireProjectAccess(req, res, projectId)') < 3:
              if status_anchor not in source:
                  raise SystemExit('studio sync status anchor not found')
              source = source.replace(status_anchor, status_guard, 1)
          studio.write_text(source)

          index = Path('server/src/index.ts')
          index_source = index.read_text()
          index_source = index_source.replace(
              'app.use("/api/studio", createStudioRouter());',
              'app.use("/api/studio", createStudioRouter(undefined, access));',
              1,
          )
          index.write_text(index_source)

          generator = Path('scripts/generate-authorization-matrix.ts')
          text = generator.read_text()
          evidence_anchor = 'const projectRoutesEvidence =\n  "server/src/__tests__/security2gE.projects-routes.test.ts";\n'
          if 'const studioParityEvidence =' not in text:
              text = text.replace(
                  evidence_anchor,
                  evidence_anchor + 'const studioParityEvidence =\n  "server/src/__tests__/security2gE.studio-project-parity.test.ts";\n',
                  1,
              )
          block = '''  ...[
            ["POST /connect", "project.studio.connect", "body-project"],
            ["POST /sync/project", "project.studio.snapshot.read", "body-project"],
            ["GET /sync/status", "project.studio.sync.status.read", "query-project"],
          ].map(
            ([operation, capability, scope]) =>
              [
                `rest|server/src/routes/studio.ts|${operation}`,
                classified(
                  "project-owner",
                  "user-session",
                  capability,
                  scope,
                  studioParityEvidence,
                  studioParityEvidence,
                ),
              ] as const,
          ),
          '''
          if 'project.studio.connect' not in text:
              marker = ']);\n\nconst current = JSON.parse('
              text = text.replace(marker, block + marker, 1)
          generator.write_text(text)
          PY
      - run: node --import tsx scripts/generate-authorization-matrix.ts
      - run: node node_modules/prettier/bin/prettier.cjs --write server/src/routes/studio.ts server/src/index.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.studio-project-parity.test.ts
      - run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.studio-project-parity.test.ts server/src/__tests__/harden2a.auth-contract.test.ts
      - run: npm run typecheck
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/routes/studio.ts server/src/index.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.studio-project-parity.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): enforce Studio project authorization parity"
          git push origin HEAD:agent/security-2g-e-rbac-parity
