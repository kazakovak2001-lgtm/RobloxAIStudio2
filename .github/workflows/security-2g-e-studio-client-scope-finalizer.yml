name: SECURITY-2G-E Studio Client Scope Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce Studio client project scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/src/routes/studio.ts')
          text = path.read_text()

          helper_anchor = '  runtime.startTimeoutMonitor();\n'
          helpers = '''  runtime.startTimeoutMonitor();

            const hasStudioProjectAccess = async (
              req: Parameters<NonNullable<ProjectAccessControl["hasProjectAccess"]>>[0],
              projectId?: string,
            ): Promise<boolean> =>
              Boolean(
                projectId &&
                  access?.hasProjectAccess &&
                  (await access.hasProjectAccess(req, projectId)),
              );

            const requireStudioClientAccess = async (
              req: Parameters<ProjectAccessControl["requireProjectAccess"]>[0],
              res: Response,
              clientId: string,
            ) => {
              const client = bridge.getClient(clientId);
              if (!client?.projectId || !(await hasStudioProjectAccess(req, client.projectId))) {
                res.status(404).json({ success: false, error: "Client not found" });
                return null;
              }
              return client;
            };

            const filterAuthorizedClients = async (req: Parameters<ProjectAccessControl["requireProjectAccess"]>[0], clients: ReturnType<typeof bridge.getConnectedClients>) => {
              const checks = await Promise.all(
                clients.map(async (client) => ({
                  client,
                  allowed: await hasStudioProjectAccess(req, client.projectId),
                })),
              );
              return checks.filter(({ allowed }) => allowed).map(({ client }) => client);
            };

            const filterAuthorizedEvents = async (
              req: Parameters<ProjectAccessControl["requireProjectAccess"]>[0],
              events: ReturnType<typeof bridge.events.getHistory>,
            ) => {
              const checks = await Promise.all(
                events.map(async (event) => {
                  const record = event as typeof event & { projectId?: string; clientId?: string };
                  const projectId =
                    record.projectId ??
                    (record.clientId ? bridge.getClient(record.clientId)?.projectId : undefined);
                  return { event, allowed: await hasStudioProjectAccess(req, projectId) };
                }),
              );
              return checks.filter(({ allowed }) => allowed).map(({ event }) => event);
            };
'''
          if 'const requireStudioClientAccess =' not in text:
              text = text.replace(helper_anchor, helpers, 1)

          text = text.replace('router.get("/status", (_req, res) => {\n    const clients = bridge.getConnectedClients();', 'router.get("/status", async (req, res) => {\n    const clients = await filterAuthorizedClients(req, bridge.getConnectedClients());', 1)

          for route in ['disconnect', 'heartbeat']:
              registration = f'router.post("/{route}", (req, res) => {{'
              text = text.replace(registration, registration.replace('(req, res)', 'async (req, res)'), 1)
              marker = '    if (!clientId || typeof clientId !== "string") {\n      res.status(400).json({ success: false, error: "clientId is required" });\n      return;\n    }'
              scoped = marker + '\n    if (!(await requireStudioClientAccess(req, res, clientId))) return;'
              start = text.index(f'router.post("/{route}"')
              pos = text.index(marker, start)
              if 'requireStudioClientAccess(req, res, clientId)' not in text[pos:pos+500]:
                  text = text[:pos] + text[pos:].replace(marker, scoped, 1)

          text = text.replace('router.get("/session", (req, res) => {', 'router.get("/session", async (req, res) => {', 1)
          session_old = '''    if (clientId) {
              const session = sessionManager.getByClient(clientId);'''
          session_new = '''    if (clientId) {
              if (!(await requireStudioClientAccess(req, res, clientId))) return;
              const session = sessionManager.getByClient(clientId);'''
          text = text.replace(session_old, session_new, 1)
          text = text.replace(
              '    res.json({ success: true, data: sessionManager.getActiveSessions() });',
              '''    const authorizedClients = await filterAuthorizedClients(
                req,
                bridge.getConnectedClients(),
              );
              const authorizedClientIds = new Set(
                authorizedClients.map((client) => client.clientId),
              );
              res.json({
                success: true,
                data: sessionManager
                  .getActiveSessions()
                  .filter((session) => authorizedClientIds.has(session.clientId)),
              });''',
              1,
          )

          commands_marker = '''    const client = bridge.getClient(clientId);
            if (!client || client.status !== "connected") {'''
          commands_guard = '''    const client = await requireStudioClientAccess(req, res, clientId);
            if (!client || client.status !== "connected") {'''
          text = text.replace(commands_marker, commands_guard, 1)

          command_status_marker = '''    if (!clientId) {
              res.status(400).json({ success: false, error: "clientId is required" });
              return;
            }
            let command;'''
          command_status_guard = '''    if (!clientId) {
              res.status(400).json({ success: false, error: "clientId is required" });
              return;
            }
            if (!(await requireStudioClientAccess(req, res, clientId))) return;
            let command;'''
          text = text.replace(command_status_marker, command_status_guard, 1)

          ack_marker = '''    if (typeof clientId !== "string") {
              res.status(400).json({ success: false, error: "clientId is required" });
              return;
            }
            try {'''
          ack_guard = '''    if (typeof clientId !== "string") {
              res.status(400).json({ success: false, error: "clientId is required" });
              return;
            }
            if (!(await requireStudioClientAccess(req, res, clientId))) return;
            try {'''
          text = text.replace(ack_marker, ack_guard, 1)

          result_marker = '''    if (typeof body.clientId !== "string") {
              res.status(400).json({ success: false, error: "clientId is required" });
              return;
            }
            const parsed = parseImportReport(body);'''
          result_guard = '''    if (typeof body.clientId !== "string") {
              res.status(400).json({ success: false, error: "clientId is required" });
              return;
            }
            const clientId = body.clientId;
            if (!(await requireStudioClientAccess(req, res, clientId))) return;
            const parsed = parseImportReport(body);'''
          text = text.replace(result_marker, result_guard, 1)

          text = text.replace('router.get("/events", (_req, res) => {\n    const history = bridge.events.getHistory();', 'router.get("/events", async (req, res) => {\n    const history = await filterAuthorizedEvents(req, bridge.events.getHistory());', 1)
          path.write_text(text)

          generator = Path('scripts/generate-authorization-matrix.ts')
          matrix = generator.read_text()
          if 'const studioClientScopeEvidence =' not in matrix:
              marker = 'const studioParityEvidence =\n  "server/src/__tests__/security2gE.studio-project-parity.test.ts";\n'
              matrix = matrix.replace(marker, marker + 'const studioClientScopeEvidence =\n  "server/src/__tests__/security2gE.studio-client-scope.test.ts";\n', 1)
          if 'project.studio.clients.read' not in matrix:
              block = '''  ...[
                ["GET /status", "project.studio.clients.read", "authorized-project-set"],
                ["POST /disconnect", "project.studio.client.disconnect", "resolved-client-project"],
                ["POST /heartbeat", "project.studio.client.heartbeat", "resolved-client-project"],
                ["GET /session", "project.studio.sessions.read", "authorized-project-set-or-client"],
                ["GET /commands", "project.studio.commands.poll", "resolved-client-project"],
                ["GET /commands/:commandId", "project.studio.command.read", "resolved-client-project"],
                ["POST /commands/:commandId/acknowledge", "project.studio.command.acknowledge", "resolved-client-project"],
                ["POST /commands/:commandId/result", "project.studio.command.report", "resolved-client-project"],
                ["GET /events", "project.studio.events.read", "authorized-project-set"],
              ].map(
                ([operation, capability, scope]) =>
                  [
                    `rest|server/src/routes/studio.ts|${operation}`,
                    classified(
                      "project-owner",
                      "user-session",
                      capability,
                      scope,
                      studioClientScopeEvidence,
                      studioClientScopeEvidence,
                    ),
                  ] as const,
              ),
              '''
              matrix = matrix.replace(']);\n\nconst current = JSON.parse(', block + ']);\n\nconst current = JSON.parse(', 1)
          generator.write_text(matrix)
          PY
      - run: node --import tsx scripts/generate-authorization-matrix.ts
      - run: node node_modules/prettier/bin/prettier.cjs --write server/src/routes/studio.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.studio-client-scope.test.ts
      - run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.studio-client-scope.test.ts server/src/__tests__/security2gE.studio-project-parity.test.ts server/src/__tests__/harden2a.auth-contract.test.ts
      - run: npm run typecheck
      - name: Publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/routes/studio.ts scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.studio-client-scope.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): scope studio client resources"
          git push origin HEAD:agent/security-2g-e-rbac-parity
