name: SECURITY-2G-E Socket Inventory Audit

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Socket matrix inventory
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const matrix = JSON.parse(fs.readFileSync('config/security/authorization-matrix.json', 'utf8'));
          const candidates = matrix.operations.filter((op) =>
            String(op.source ?? '').includes('/socket/') ||
            String(op.operation ?? '').includes(':') ||
            String(op.transport ?? '').toLowerCase().includes('socket')
          );
          console.log(JSON.stringify({ count: candidates.length, candidates }, null, 2));
          NODE
      - name: Socket source registrations
        run: |
          grep -RIn --include='*.ts' 'socket.on(' server/src/socket server/src | head -200 || true
