name: Prepare CUTOVER-1C Runtime

on:
  pull_request:
    branches:
      - feature/plugin-merge

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Reuse HTTP origin policy in Socket.IO
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/src/index.ts")
          source = path.read_text()
          socket_start = source.index("const io = new SocketServer")
          origin_start = source.index("    origin:\n", socket_start)
          methods_start = source.index("    methods:", origin_start)
          replacement = (
              "    origin:\n"
              "      process.env.NODE_ENV === \"production\"\n"
              "        ? getAllowedFrontendOrigins()\n"
              "        : true,\n"
          )
          source = source[:origin_start] + replacement + source[methods_start:]

          old_import = "  configureApiKeyStore,\n  getApiKeyStore,"
          new_import = (
              "  configureApiKeyStore,\n"
              "  getAllowedFrontendOrigins,\n"
              "  getApiKeyStore,"
          )
          if old_import not in source:
              raise SystemExit("Security import anchor not found")
          source = source.replace(old_import, new_import, 1)
          path.write_text(source)
          PY
      - name: Format CUTOVER-1C files
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            server/src/index.ts \
            server/src/common/middleware/security.ts \
            server/src/__tests__/cutover1c.origin-policy.test.ts \
            scripts/cutover/verify-composed-release.mjs \
            deploy/docker-compose.backend.yml \
            deploy/docker-compose.release.yml
      - name: Validate focused contracts
        run: |
          node --check scripts/cutover/verify-composed-release.mjs
          npx vitest run server/src/__tests__/cutover1c.origin-policy.test.ts
          npx tsc --noEmit --project server/tsconfig.json
      - name: Publish prepared files
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c-prepared-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/ci.yml
            server/src/index.ts
            server/src/common/middleware/security.ts
            server/src/__tests__/cutover1c.origin-policy.test.ts
            scripts/cutover/verify-composed-release.mjs
            deploy/docker-compose.backend.yml
            deploy/docker-compose.release.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
