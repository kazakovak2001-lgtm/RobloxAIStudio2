name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "33 7 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 60
          days-before-pr-close: -1
          stale-issue-message: "This issue has had no activity for 60 days. Comment or update it to keep it open."
          stale-pr-message: "This pull request has had no activity for 60 days. Comment or update it to remove the stale label."
          close-issue-message: "Closing this issue after 14 additional days without activity. Reopen it if it is still relevant."
          close-pr-message: ""
          stale-issue-label: no-issue-activity
          stale-pr-label: no-pr-activity
          exempt-issue-labels: pinned,security,release-blocker,do-not-close
          exempt-pr-labels: pinned,security,release-blocker,do-not-close
          remove-stale-when-updated: true
          operations-per-run: 100
