name: Prepare CUTOVER-1D Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Insert release readiness job
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/ci.yml')
          source = path.read_text()
          if '  release-readiness:\n' in source:
              raise SystemExit('Release readiness job already exists')

          marker = '  validate:\n'
          if marker not in source:
              raise SystemExit('CI validate job anchor missing')

          job = textwrap.indent(textwrap.dedent(r'''\
          release-readiness:
            name: Release Baseline Readiness
            runs-on: ubuntu-latest
            needs: composed-release
            steps:
              - name: Checkout backend readiness source
                uses: actions/checkout@v4
                with:
                  fetch-depth: 0
              - name: Checkout exact Frontend release commit
                uses: actions/checkout@v4
                with:
                  repository: kazakovak2001-lgtm/Frontend
                  ref: 1036c3ef9705d145cb9700cd14268a33d2abdd58
                  path: standalone-frontend
              - uses: actions/setup-node@v4
                with:
                  node-version: "22"
                  cache: "npm"
              - run: npm ci
              - name: Fetch canonical branch tips
                run: git fetch origin standing-pentaceratops feature/plugin-merge
              - name: Verify branch and release dependency inventory
                env:
                  INTEGRATION_REF: origin/feature/plugin-merge
                  DEFAULT_REF: origin/standing-pentaceratops
                  RELEASE_BASELINE_OUTPUT: artifacts/cutover-1d
                run: node scripts/cutover/verify-release-baseline-readiness.mjs
              - name: Build independent rollback artifacts
                run: |
                  docker build \
                    --file Dockerfile.backend \
                    --tag roblox-ai-studio-backend:cutover-1d-rollback \
                    .
                  docker build \
                    --build-arg VITE_API_URL=http://127.0.0.1:5051/api \
                    --build-arg VITE_SOCKET_URL=http://127.0.0.1:5051 \
                    --tag roblox-ai-studio-frontend:cutover-1d-rollback \
                    standalone-frontend
              - name: Restore independent backend and Frontend artifacts
                run: |
                  mkdir -p artifacts/cutover-1d
                  printf '%s\n' \
                    'Composed HTTPS Release prerequisite: passed and stopped by its own cleanup step.' \
                    'Rollback rehearsal: starting independently deployable CUTOVER-1A and CUTOVER-1B artifacts.' \
                    > artifacts/cutover-1d/rollback-transcript.txt
                  docker run --detach \
                    --name roblox-ai-studio-backend-cutover-1d \
                    --publish 5051:5000 \
                    --env NODE_ENV=production \
                    --env PORT=5000 \
                    --env STORAGE_PROVIDER=inmemory \
                    --env FRONTEND_URL=http://127.0.0.1:8081 \
                    roblox-ai-studio-backend:cutover-1d-rollback
                  docker run --detach \
                    --name roblox-ai-studio-frontend-cutover-1d \
                    --publish 8081:3000 \
                    --env PUBLIC_ORIGIN=http://127.0.0.1:8081 \
                    roblox-ai-studio-frontend:cutover-1d-rollback
              - name: Verify independent rollback health and SSR
                run: |
                  for attempt in $(seq 1 45); do
                    backend_ok=false
                    frontend_ok=false
                    if curl --fail --silent http://127.0.0.1:5051/health > artifacts/cutover-1d/backend-health.json; then
                      backend_ok=true
                    fi
                    if curl --fail --silent http://127.0.0.1:8081/health > artifacts/cutover-1d/frontend-health.json; then
                      frontend_ok=true
                    fi
                    if [ "$backend_ok" = true ] && [ "$frontend_ok" = true ]; then
                      break
                    fi
                    sleep 1
                  done
                  grep --quiet '"status":"healthy"' artifacts/cutover-1d/backend-health.json
                  grep --quiet '"status":"healthy"' artifacts/cutover-1d/frontend-health.json
                  curl --fail --silent http://127.0.0.1:8081/ > artifacts/cutover-1d/frontend-root.html
                  grep --ignore-case --quiet '<!doctype html' artifacts/cutover-1d/frontend-root.html
                  {
                    echo 'Independent backend health: HTTP 200'
                    echo 'Independent Frontend health: HTTP 200'
                    echo 'Independent Frontend SSR document: HTTP 200 with HTML'
                    echo 'Rollback rehearsal result: passed'
                  } >> artifacts/cutover-1d/rollback-transcript.txt
              - name: Capture readiness and rollback diagnostics
                if: always()
                run: |
                  mkdir -p artifacts/cutover-1d
                  docker logs roblox-ai-studio-backend-cutover-1d > artifacts/cutover-1d/backend.log 2>&1 || true
                  docker logs roblox-ai-studio-frontend-cutover-1d > artifacts/cutover-1d/frontend.log 2>&1 || true
                  docker inspect roblox-ai-studio-backend-cutover-1d roblox-ai-studio-frontend-cutover-1d \
                    > artifacts/cutover-1d/container-inspect.json 2>/dev/null || true
              - name: Publish release readiness evidence
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: cutover-1d-readiness
                  path: artifacts/cutover-1d
                  if-no-files-found: error
                  retention-days: 3
              - name: Stop independent rollback artifacts
                if: always()
                run: |
                  docker rm --force roblox-ai-studio-backend-cutover-1d || true
                  docker rm --force roblox-ai-studio-frontend-cutover-1d || true

          '''), '  ')
          source = source.replace(marker, job + marker, 1)
          old_needs = '''        backend-image,
                  composed-release,
                  validate,'''
          new_needs = '''        backend-image,
                  composed-release,
                  release-readiness,
                  validate,'''
          if old_needs not in source:
              raise SystemExit('Merge Gate needs anchor missing')
          source = source.replace(old_needs, new_needs, 1)
          path.write_text(source)
          PY
      - name: Format and validate prepared files
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            config/cutover/release-baseline.inventory.json \
            scripts/cutover/verify-release-baseline-readiness.mjs
          npx prettier --check \
            .github/workflows/ci.yml \
            config/cutover/release-baseline.inventory.json \
            scripts/cutover/verify-release-baseline-readiness.mjs
          node --check scripts/cutover/verify-release-baseline-readiness.mjs
          ruby -e 'require "yaml"; workflow = YAML.load_file(".github/workflows/ci.yml"); abort "release-readiness missing" unless workflow.fetch("jobs").key?("release-readiness")'
      - name: Publish prepared gate
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1d-prepared-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/ci.yml
            config/cutover/release-baseline.inventory.json
            scripts/cutover/verify-release-baseline-readiness.mjs
          if-no-files-found: error
          retention-days: 1
