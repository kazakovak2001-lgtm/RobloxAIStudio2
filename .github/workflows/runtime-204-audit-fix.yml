name: Apply RUNTIME-204 Audit Semantics

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-audit-semantics:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Separate cleanup baseline from release candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/cleanup/audit-legacy-frontend-decommission.mjs")
          text = path.read_text()

          old = '''const releaseInventory = JSON.parse(
            readFileSync(path.join(root, inventory.sourceReleaseInventory), "utf8"),
          );
          assert.deepEqual(inventory.canonicalFrontend, releaseInventory.frontendRelease);
          '''
          new = '''const releaseInventory = JSON.parse(
            readFileSync(path.join(root, inventory.sourceReleaseInventory), "utf8"),
          );
          assert.equal(
            inventory.canonicalFrontend.repository,
            releaseInventory.frontendRelease.repository,
            "Cleanup and release inventories must reference the same Frontend repository",
          );
          for (const [label, commit] of [
            ["cleanup canonical Frontend", inventory.canonicalFrontend.commit],
            ["release Frontend", releaseInventory.frontendRelease.commit],
          ]) {
            assert.match(
              commit,
              /^[0-9a-f]{40}$/,
              `${label} must be an exact 40-character commit SHA`,
            );
          }
          '''
          if old not in text:
              raise SystemExit("Expected canonical Frontend equality block was not found")
          text = text.replace(old, new, 1)

          old_result = '''  canonicalFrontend: inventory.canonicalFrontend,
            historicalImplementationChangePolicy: {
          '''
          new_result = '''  canonicalFrontend: inventory.canonicalFrontend,
            releaseFrontend: releaseInventory.frontendRelease,
            historicalImplementationChangePolicy: {
          '''
          if old_result not in text:
              raise SystemExit("Expected audit evidence block was not found")
          path.write_text(text.replace(old_result, new_result, 1))
          PY
      - name: Format and validate audit
        run: |
          node node_modules/prettier/bin/prettier.cjs --write scripts/cleanup/audit-legacy-frontend-decommission.mjs
          node --check scripts/cleanup/audit-legacy-frontend-decommission.mjs
          git rm .github/workflows/runtime-204-audit-fix.yml
          LEGACY_FRONTEND_AUDIT_OUTPUT=artifacts/runtime-204-audit node scripts/cleanup/audit-legacy-frontend-decommission.mjs
          git restore --staged .github/workflows/runtime-204-audit-fix.yml
          git restore .github/workflows/runtime-204-audit-fix.yml
          npm run lint
      - name: Commit truthful audit semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cleanup/audit-legacy-frontend-decommission.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "fix(cleanup): distinguish release frontend candidate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
