name: SECURITY-2G-E Concept Matrix Finalizer V2

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply concept matrix and history policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          generator = Path('scripts/generate-authorization-matrix.ts')
          text = generator.read_text()
          evidence_anchor = 'const indirectSessionEvidence =\n  "server/src/__tests__/security2gE.indirect-session-routes.test.ts";\n'
          if 'const conceptResolverEvidence =' not in text:
              text = text.replace(
                  evidence_anchor,
                  evidence_anchor + 'const conceptResolverEvidence =\n  "server/src/__tests__/security2gE.concept-resource-resolvers.test.ts";\nconst conceptHistoryEvidence =\n  "server/src/__tests__/security2gE.concept-matrix-history.test.ts";\n',
                  1,
              )

          block = '''  ...[
            ["GET /experience/status/:pipelineId", "project.pipeline.read", "resolved-pipeline-project"],
            ["POST /experience/:pipelineId/pause", "project.pipeline.pause", "resolved-pipeline-project"],
            ["POST /experience/:pipelineId/resume", "project.pipeline.resume", "resolved-pipeline-project"],
            ["POST /experience/:pipelineId/cancel", "project.pipeline.cancel", "resolved-pipeline-project"],
            ["POST /experience/:pipelineId/retry", "project.pipeline.retry", "resolved-pipeline-project"],
            ["POST /experience/:pipelineId/stage/:stage/retry", "project.pipeline.stage.retry", "resolved-pipeline-project"],
            ["GET /experience/:pipelineId/artifacts", "project.artifact.list", "resolved-pipeline-project"],
            ["GET /experience/:pipelineId/review", "project.review.read", "resolved-pipeline-project"],
            ["GET /experience/:pipelineId/metrics", "project.metrics.read", "resolved-pipeline-project"],
            ["GET /experience/:pipelineId/audit", "project.audit.read", "resolved-pipeline-project"],
            ["GET /experience/artifact/:artifactId", "project.artifact.read", "resolved-artifact-project"],
            ["POST /experience/artifact/:artifactId/approve", "project.artifact.approve", "resolved-artifact-project"],
            ["POST /experience/artifact/:artifactId/reject", "project.artifact.reject", "resolved-artifact-project"],
            ["POST /experience/artifact/:artifactId/comment", "project.artifact.comment", "resolved-artifact-project"],
            ["POST /experience/artifact/:artifactId/edit", "project.artifact.edit", "resolved-artifact-project"],
          ].map(
            ([operation, capability, scope]) =>
              [
                `rest|server/src/routes/concept.ts|${operation}`,
                classified(
                  "project-owner",
                  "user-session",
                  capability,
                  scope,
                  conceptResolverEvidence,
                  conceptResolverEvidence,
                ),
              ] as const,
          ),
          [
            "rest|server/src/routes/concept.ts|GET /experience/history",
            classified(
              "project-owner-filtered",
              "user-session",
              "project.pipeline.history.read",
              "filtered-project-set",
              conceptHistoryEvidence,
              conceptHistoryEvidence,
            ),
          ],
          '''
          if 'resolved-pipeline-project' not in text:
              text = text.replace(']);\n\nconst current = JSON.parse(', block + ']);\n\nconst current = JSON.parse(', 1)
          generator.write_text(text)

          concept = Path('server/src/routes/concept.ts')
          source = concept.read_text()
          source = re.sub(
              r'router\.get\("/experience/history",\s*\(_req,\s*res\)\s*=>\s*\{',
              'router.get("/experience/history", async (req, res) => {',
              source,
              count=1,
          )
          replacement = '''history.sort((a, b) => b.startedAt - a.startedAt);
            const visibleHistory: typeof history = [];
            for (const state of history) {
              const allowed = access.hasProjectAccess
                ? await access.hasProjectAccess(req, state.projectId)
                : await access.requireProjectAccess(req, res, state.projectId);
              if (allowed) visibleHistory.push(state);
              if (res.headersSent) return;
            }
            res.json({ success: true, data: visibleHistory });'''
          source = re.sub(
              r'history\.sort\(\(a, b\) => b\.startedAt - a\.startedAt\);\s*res\.json\(\{ success: true, data: history \}\);',
              replacement,
              source,
              count=1,
          )
          concept.write_text(source)
          PY
      - run: node --import tsx scripts/generate-authorization-matrix.ts
      - run: node node_modules/prettier/bin/prettier.cjs --write scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/routes/concept.ts server/src/__tests__/security2gE.concept-matrix-history.test.ts
      - run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.concept-resource-resolvers.test.ts server/src/__tests__/security2gE.concept-matrix-history.test.ts
      - run: npm run typecheck
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/routes/concept.ts server/src/__tests__/security2gE.concept-matrix-history.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): classify concept resources and filter history"
          git push origin HEAD:agent/security-2g-e-rbac-parity
