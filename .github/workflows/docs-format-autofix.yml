name: Documentation Format Autofix

on:
  push:
    branches: [docs/studio-1c-backend-verification]

permissions:
  contents: write

concurrency:
  group: documentation-format-autofix
  cancel-in-progress: true

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/studio-1c-backend-verification
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply exact documentation formatting
        run: |
          npx prettier --write \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md
      - name: Restore canonical CI and remove this workflow
        run: |
          git fetch origin feature/plugin-merge
          git show origin/feature/plugin-merge:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/docs-format-autofix.yml
      - name: Commit formatted control documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/docs-format-autofix.yml \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(control): apply canonical formatting"
          git push origin HEAD:docs/studio-1c-backend-verification
