name: DATA-201B Prettier Fix

on:
  push:
    branches:
      - agent/data-201b-compatibility-write-gate
    paths:
      - .github/workflows/data-201b-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-compatibility-write-gate
          fetch-depth: 0

      - name: Apply canonical formatting
        run: |
          npm ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/data-201b-prettier-fix.yml
          node node_modules/prettier/bin/prettier.cjs --write scripts/validate-durable-writes.ts
          node scripts/cleanup/generate-tracked-inventories.mjs
          git add scripts/validate-durable-writes.ts _inventory_raw.txt ProjectStructure.txt project_structure.txt
          git commit -m "style(storage): format compatibility write gate"
          git push origin HEAD:agent/data-201b-compatibility-write-gate
