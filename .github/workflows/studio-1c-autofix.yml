name: Studio 1c Branch Autofix

on:
  push:
    branches: [studio-1c-import-acknowledgement]

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact branch fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-1c-import-acknowledgement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Correct undefined assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/src/__tests__/studio1.import-acknowledgement.test.ts")
          source = path.read_text()
          replacements = {
              '''    expect(runtime.getCommand(commandId)).toMatchObject({
                status: "sent",
                deliveredAt: undefined,
              });
          ''': '''    expect(runtime.getCommand(commandId)).toMatchObject({
                status: "sent",
              });
              expect(runtime.getCommand(commandId)?.deliveredAt).toBeUndefined();
          ''',
              '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "queued",
                lastSyncAt: undefined,
              });
          ''': '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "queued",
              });
              expect(
                runtime.sessions.getByClient(clientId)?.lastSyncAt,
              ).toBeUndefined();
          ''',
              '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "delivered",
                lastSyncAt: undefined,
              });
          ''': '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "delivered",
              });
              expect(
                runtime.sessions.getByClient(clientId)?.lastSyncAt,
              ).toBeUndefined();
          ''',
              '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "acknowledged",
                lastSyncAt: undefined,
              });
          ''': '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "acknowledged",
              });
              expect(
                runtime.sessions.getByClient(clientId)?.lastSyncAt,
              ).toBeUndefined();
          ''',
              '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "failed",
                verificationError: expect.stringContaining("hash mismatch"),
                lastSyncAt: undefined,
              });
          ''': '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "failed",
                verificationError: expect.stringContaining("hash mismatch"),
              });
              expect(
                runtime.sessions.getByClient(clientId)?.lastSyncAt,
              ).toBeUndefined();
          ''',
              '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "failed",
                verificationError: "Roblox instance creation failed",
                lastSyncAt: undefined,
              });
          ''': '''    expect(runtime.sessions.getByClient(clientId)).toMatchObject({
                verificationStatus: "failed",
                verificationError: "Roblox instance creation failed",
              });
              expect(
                runtime.sessions.getByClient(clientId)?.lastSyncAt,
              ).toBeUndefined();
          ''',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit("Expected assertion block was not found")
              source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Apply repository formatting
        run: npm run format
      - name: Restore canonical CI and remove autofix
        shell: bash
        run: |
          git fetch origin feature/plugin-merge --depth=1
          git checkout origin/feature/plugin-merge -- .github/workflows/ci.yml
          rm .github/workflows/studio-1c-autofix.yml
      - name: Commit exact fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/studio-1c-autofix.yml \
            server/src/__tests__/studio1.import-acknowledgement.test.ts \
            server/src/studio/integration/types.ts \
            server/src/studio/v2/StudioTypes.ts \
            server/src/studio/v2/StudioSession.ts \
            server/src/studio/v2/StudioRuntime.ts
          git commit -m "style(studio): apply acknowledgement formatting"
          git push origin HEAD:studio-1c-import-acknowledgement
