name: Finalize CUTOVER-1D Documentation Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/release-baseline-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Format readiness documentation
        run: |
          npx prettier --write \
            docs/00-project-control/CUTOVER-1D_RELEASE_BASELINE_READINESS.md \
            docs/00-project-control/ROADMAP_STATUS.md
          npx prettier --check \
            docs/00-project-control/CUTOVER-1D_RELEASE_BASELINE_READINESS.md \
            docs/00-project-control/ROADMAP_STATUS.md
      - name: Commit formatted documents and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-cutover-1d-doc-format.yml
          git add \
            docs/00-project-control/CUTOVER-1D_RELEASE_BASELINE_READINESS.md \
            docs/00-project-control/ROADMAP_STATUS.md
          git diff --cached --check
          git commit -m "style(cutover): format readiness documentation"
          git push origin HEAD:cutover/release-baseline-readiness
