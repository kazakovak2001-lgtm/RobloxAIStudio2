name: Prepare CUTOVER-1D Documentation Format

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Format readiness documentation
        run: |
          npx prettier --write \
            docs/00-project-control/CUTOVER-1D_RELEASE_BASELINE_READINESS.md \
            docs/00-project-control/ROADMAP_STATUS.md
          npx prettier --check \
            docs/00-project-control/CUTOVER-1D_RELEASE_BASELINE_READINESS.md \
            docs/00-project-control/ROADMAP_STATUS.md
      - name: Publish formatted documentation
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1d-doc-format-${{ github.event.pull_request.head.sha }}
          path: |
            docs/00-project-control/CUTOVER-1D_RELEASE_BASELINE_READINESS.md
            docs/00-project-control/ROADMAP_STATUS.md
          if-no-files-found: error
          retention-days: 1
