name: STUDIO-1 Format Snapshot

on:
  pull_request:
    branches: [feature/plugin-merge]

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format STUDIO-1 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/__tests__/core1b.postgres.integration.test.ts \
            server/src/__tests__/studio1.artifact-lineage.test.ts \
            server/src/pipeline/v2/ArtifactStore.ts \
            server/src/platform/storage/StorageFactory.ts \
            server/src/projects/services/game-generation.service.ts \
            server/src/studio/artifacts/GenerationArtifactRecorder.ts \
            docs/00-project-control/STUDIO-1A_ARTIFACT_LINEAGE.md
      - name: Package formatted files
        run: |
          tar -czf /tmp/studio1-formatted.tgz \
            server/src/__tests__/core1b.postgres.integration.test.ts \
            server/src/__tests__/studio1.artifact-lineage.test.ts \
            server/src/pipeline/v2/ArtifactStore.ts \
            server/src/platform/storage/StorageFactory.ts \
            server/src/projects/services/game-generation.service.ts \
            server/src/studio/artifacts/GenerationArtifactRecorder.ts \
            docs/00-project-control/STUDIO-1A_ARTIFACT_LINEAGE.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio1-formatted-${{ github.sha }}
          path: /tmp/studio1-formatted.tgz
          retention-days: 1
