name: SECURITY-2G-E Merge Inventory Refresh

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate
    paths:
      - .github/workflows/security-2g-e-merge-inventory-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 157 && github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/157/merge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate merge-tree inventories
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cleanup/generate-tracked-inventories.mjs
          grep -v 'security-2g-e-merge-inventory-refresh.yml' _inventory_raw.txt > /tmp/_inventory_raw.txt
          grep -v 'security-2g-e-merge-inventory-refresh.yml' ProjectStructure.txt > /tmp/ProjectStructure.txt
      - name: Checkout exact PR branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/security-2g-e-rbac-parity origin/agent/security-2g-e-rbac-parity
          cp /tmp/_inventory_raw.txt _inventory_raw.txt
          cp /tmp/ProjectStructure.txt ProjectStructure.txt
      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -v -E '^(_inventory_raw\.txt|ProjectStructure\.txt)$' || true)"
          test -z "$unexpected"
          git diff --check
      - name: Commit merge-tree inventories
        shell: bash
        run: |
          set -euo pipefail
          git add -- _inventory_raw.txt ProjectStructure.txt
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): align inventories with merge tree'
          git push origin HEAD:agent/security-2g-e-rbac-parity
