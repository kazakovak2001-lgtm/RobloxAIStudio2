name: PR83 Publisher Kick

on:
  push:
    branches: [agent/data-201b-api-key-issuance-ack]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PR83 integration publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches \
            -f ref=agent/data-201b-api-key-issuance-ack
