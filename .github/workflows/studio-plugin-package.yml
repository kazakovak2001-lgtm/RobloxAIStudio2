name: PR83 Publisher Runner

on:
  push:
    branches: [agent/data-201b-api-key-issuance-ack]

concurrency:
  group: pr83-integration-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-201b-api-key-issuance-ack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Execute asserted PR83 publisher
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          set -euo pipefail$/ { capture = 1 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/ci.yml > /tmp/pr83-publish.sh
          test -s /tmp/pr83-publish.sh
          grep -q "release_sha='4a0ae15e5959e31470fc1d22c8ae3671bca8829a'" /tmp/pr83-publish.sh
          grep -q "git push origin" /tmp/pr83-publish.sh
          python3 <<'PY'
          from pathlib import Path

          path = Path("/tmp/pr83-publish.sh")
          text = path.read_text()
          old = 'text = text.replace("store.issue(", "await store.issueDurable(")'
          new = '''issue_call_count = text.count("store.issue(")
          if issue_call_count != 8:
              raise SystemExit(
                  f"ApiKeyStore test issue call count mismatch: {issue_call_count}"
              )
          text = text.replace("store.issue(", "await store.issueDurable(")'''
          if text.count(old) != 1:
              raise SystemExit("publisher issue transformation anchor mismatch")
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n /tmp/pr83-publish.sh
          bash /tmp/pr83-publish.sh
