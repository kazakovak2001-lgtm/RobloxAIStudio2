name: INTEGRATION-1A Security and Inventory Fix

on:
  pull_request:
    branches: [release/cutover-1e-candidate]
    paths:
      - .github/workflows/integration-1a-security-inventory-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 166 && github.event.pull_request.head.ref == 'agent/integration-1a-contract-baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integration-1a-contract-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Repair production dependency lockfile
        run: |
          npm audit fix --package-lock-only --omit=dev
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Generate final-tree inventories with canonical generator
        run: |
          helper='.github/workflows/integration-1a-security-inventory-fix.yml'
          git update-index --force-remove "$helper"
          node scripts/cleanup/generate-tracked-inventories.mjs
          git reset HEAD -- "$helper"
      - name: Verify bounded repair
        run: |
          npm run typecheck
          npm run test
          helper='.github/workflows/integration-1a-security-inventory-fix.yml'
          git update-index --force-remove "$helper"
          node scripts/cleanup/audit-legacy-frontend-decommission.mjs
          git reset HEAD -- "$helper"
          allowed='^(package-lock\.json|ProjectStructure\.txt|_inventory_raw\.txt)$'
          unexpected="$(git diff --name-only | grep -v -E "$allowed" || true)"
          test -z "$unexpected"
          git diff --check
      - name: Commit repair
        run: |
          git add -- package-lock.json ProjectStructure.txt _inventory_raw.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): refresh vulnerable production transitive dependencies'
          git push origin HEAD:agent/integration-1a-contract-baseline
