name: SECURITY-2G-E Studio Parity Commitlint Fix

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - name: Lowercase finalizer commit subject
        run: |
          sed -i 's/enforce Studio project authorization parity/enforce studio project authorization parity/' .github/workflows/security-2g-e-studio-parity-finalizer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/security-2g-e-studio-parity-finalizer.yml
          git diff --cached --quiet && exit 0
          HUSKY=0 git commit -m "ci(security): fix studio parity commit subject"
          git push origin HEAD:agent/security-2g-e-rbac-parity
