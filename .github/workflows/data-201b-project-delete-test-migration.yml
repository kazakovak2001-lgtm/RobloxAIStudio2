name: DATA-201B Project Delete Test Migration

on:
  push:
    branches:
      - agent/data-201b-remove-project-delete-compat

permissions:
  contents: write

jobs:
  migrate-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-remove-project-delete-compat
          fetch-depth: 0

      - name: Apply exact preservation test migration
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'server/src/__tests__/preservationProperty.test.ts';
          let source = fs.readFileSync(path, 'utf8');

          const oldCallback = 'it("unit: project repository works with in-memory storage", () => {';
          const newCallback = 'it("unit: project repository works with in-memory storage", async () => {';
          const oldDelete = 'const deleted = projects.delete(p.id);';
          const newDelete = 'const deleted = await projects.deleteDurable(p.id);';

          if (!source.includes(oldCallback)) {
            throw new Error(`Missing expected callback in ${path}`);
          }
          if (!source.includes(oldDelete)) {
            throw new Error(`Missing expected delete call in ${path}`);
          }

          source = source.replace(oldCallback, newCallback).replace(oldDelete, newDelete);
          fs.writeFileSync(path, source);
          NODE

      - name: Remove temporary workflow
        run: rm .github/workflows/data-201b-project-delete-test-migration.yml

      - name: Commit exact migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(storage): await project deletion preservation"
          git push origin HEAD:agent/data-201b-remove-project-delete-compat
