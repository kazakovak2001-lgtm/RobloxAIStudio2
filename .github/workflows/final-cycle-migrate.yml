name: Final Runtime Cycle Migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate-final-cycles:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move pipeline event contracts to shared types
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          types_dir = root / "server/src/types"

          (types_dir / "pipeline-events.ts").write_text('''export type PipelineEventType =
            | "step.started"
            | "step.completed"
            | "step.failed"
            | "pipeline.started"
            | "pipeline.completed"
            | "pipeline.failed"
            | "evaluation.started"
            | "evaluation.completed"
            | "evaluation.failed"
            | "memory.created"
            | "memory.updated"
            | "memory.snapshot"
            | "memory.decision"
            | "planning.created"
            | "planning.updated"
            | "planning.step.selected"
            | "planning.replanned"
            | "planning.completed"
            | "planning.failed"
            | "generation.started"
            | "generation.blueprint.updated"
            | "generation.validation.completed"
            | "generation.report.created"
            | "generation.completed"
            | "generation.failed"
            | "assembly.started"
            | "assembly.workspace.created"
            | "assembly.mapping.completed"
            | "assembly.validation.completed"
            | "assembly.completed"
            | "assembly.failed"
            | "assembly.replay.completed"
            | "assembly.diff.completed"
            | "assembly.impact.analyzed"
            | "assembly.governance.decision"
            | "assembly.ci.blocked"
            | "assembly.ci.passed"
            | "compiler.build.started"
            | "compiler.build.completed"
            | "compiler.build.failed"
            | "compiler.stage.error"
            | "compiler.governance.decision"
            | "project.created"
            | "project.deleted"
            | "project.context.initialized"
            | "distributed.job.queued"
            | "distributed.job.started"
            | "distributed.job.completed"
            | "distributed.job.failed"
            | "distributed.worker.registered"
            | "distributed.worker.stopped"
            | "cloud.node.registered"
            | "cloud.node.unregistered"
            | "cloud.node.heartbeat"
            | "cloud.job.routed"
            | "cloud.node.failed"
            | "cluster.topology.updated"
            | "studio.connected"
            | "studio.disconnected"
            | "studio.sync.update"
            | "studio.asset.changed"
            | "studio.scene.updated"
            | "studio.import.completed"
            | "agent.task.created"
            | "agent.task.completed"
            | "agent.decision.made"
            | "agent.conflict.detected"
            | "agent.conflict.resolved";

          export interface PipelineEvent {
            type: PipelineEventType;
            pipelineId: string;
            projectId?: string;
            stepId?: string;
            data?: Record<string, unknown>;
            timestamp: Date;
          }

          export type PipelineEventHandler = (
            event: PipelineEvent,
          ) => void | Promise<void>;

          export interface PipelineEventPublisher {
            emit(event: PipelineEvent): Promise<void>;
            emitStepStarted(
              pipelineId: string,
              stepId: string,
              stepName: string,
              projectId?: string,
            ): Promise<void>;
            emitStepCompleted(
              pipelineId: string,
              stepId: string,
              stepName: string,
              output?: unknown,
              projectId?: string,
            ): Promise<void>;
            emitStepFailed(
              pipelineId: string,
              stepId: string,
              stepName: string,
              error: string,
              projectId?: string,
            ): Promise<void>;
            emitPipelineStarted(
              pipelineId: string,
              projectId?: string,
            ): Promise<void>;
            emitPipelineCompleted(
              pipelineId: string,
              outputs?: Record<string, unknown>,
              projectId?: string,
              metadata?: Record<string, unknown>,
            ): Promise<void>;
            emitPipelineFailed(
              pipelineId: string,
              error: string,
              projectId?: string,
              metadata?: Record<string, unknown>,
            ): Promise<void>;
          }
          ''', encoding="utf-8")

          pipeline_types = root / "server/src/execution/pipelineTypes.ts"
          text = pipeline_types.read_text(encoding="utf-8")
          start = text.index("export type PipelineEventType")
          workflow_marker = text.index("export interface WorkflowState")
          compatibility = '''export type {
            PipelineEvent,
            PipelineEventHandler,
            PipelineEventPublisher,
            PipelineEventType,
          } from "../types/pipeline-events";

          '''
          text = text[:start] + compatibility + text[workflow_marker:]
          handler_start = text.find("export type PipelineEventHandler")
          if handler_start != -1:
              text = text[:handler_start].rstrip() + "\n"
          pipeline_types.write_text(text, encoding="utf-8")

          streaming = root / "server/src/socket/streaming.ts"
          text = streaming.read_text(encoding="utf-8")
          text = text.replace(
              'import type { PipelineEvent } from "../execution/pipelineTypes";',
              'import type { PipelineEvent, PipelineEventPublisher } from "../types/pipeline-events";',
          )
          text = text.replace(
              "export class PipelineEventEmitter {",
              "export class PipelineEventEmitter implements PipelineEventPublisher {",
          )
          streaming.write_text(text, encoding="utf-8")

          plan_executor = root / "server/src/planning/execution/PlanExecutor.ts"
          text = plan_executor.read_text(encoding="utf-8")
          text = text.replace(
              'import type { PipelineEventEmitter } from "../../socket/streaming";',
              'import type { PipelineEventPublisher } from "../../types/pipeline-events";',
          )
          text = text.replace("PipelineEventEmitter", "PipelineEventPublisher")
          plan_executor.write_text(text, encoding="utf-8")

          integrator = root / "server/src/execution/aiPipelineIntegrator.ts"
          text = integrator.read_text(encoding="utf-8")
          text = text.replace(
              'import type { PipelineEvent } from "./pipelineTypes";',
              'import type { PipelineEvent, PipelineEventPublisher } from "../types/pipeline-events";',
          )
          text = text.replace(
              'import { PipelineEventEmitter } from "../socket/streaming";\n',
              "",
          )
          text = text.replace("PipelineEventEmitter", "PipelineEventPublisher")
          integrator.write_text(text, encoding="utf-8")

          types_index = types_dir / "index.ts"
          text = types_index.read_text(encoding="utf-8")
          export_block = '''export type {
            PipelineEvent,
            PipelineEventHandler,
            PipelineEventPublisher,
            PipelineEventType,
          } from "./pipeline-events";
          '''
          if 'from "./pipeline-events"' not in text:
              text = text.rstrip() + "\n\n" + export_block
          types_index.write_text(text, encoding="utf-8")

          manifest_path = root / "architecture.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["allowedCycles"] = []
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Format and validate final cycle migration
        run: |
          npm run format
          npm run typecheck
          npm run validate:boundaries
          npm run format:check

      - name: Regenerate canonical tracked snapshots
        run: |
          git rm .github/workflows/final-cycle-migrate.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
          git restore --staged --worktree .github/workflows/final-cycle-migrate.yml

      - name: Commit final cycle migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server/src architecture.manifest.json \
            _inventory_raw.txt ProjectStructure.txt project_structure.txt
          if git diff --cached --quiet; then
            echo "Final cycle migration already applied."
            exit 0
          fi
          git commit --no-verify -m "refactor(arch): remove runtime transport cycles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
