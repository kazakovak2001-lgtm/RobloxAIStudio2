name: Audit CUTOVER-1C Contracts

on:
  pull_request:
    branches:
      - feature/plugin-merge

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture existing security and release contracts
        run: |
          mkdir -p artifacts/cutover-1c-audit
          {
            echo '# Existing test files'
            find server -type f \( -name '*test.ts' -o -name '*spec.ts' \) | sort
            echo
            echo '# CORS, cookie, Socket.IO and auth references in tests'
            grep -RInE 'corsMiddleware|Access-Control-Allow|setAuthCookies|roblox_ai_token|sameSite|Socket.IO|socket\.io|Authentication required|FRONTEND_URL' \
              server/src --include='*test.ts' --include='*spec.ts' || true
            echo
            echo '# Runtime environment references'
            grep -RInE 'FRONTEND_URL|COOKIE_DOMAIN|VITE_API_URL|VITE_SOCKET_URL|roblox_ai_token' \
              server deploy .github package.json --exclude-dir=node_modules || true
            echo
            echo '# Socket.IO client package availability'
            node -e 'const p=require("./package.json"); console.log({dependencies:p.dependencies?.["socket.io-client"],devDependencies:p.devDependencies?.["socket.io-client"]})'
          } > artifacts/cutover-1c-audit/inventory.txt
      - name: Publish audit inventory
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c-audit-${{ github.event.pull_request.head.sha }}
          path: artifacts/cutover-1c-audit/inventory.txt
          if-no-files-found: error
          retention-days: 1
