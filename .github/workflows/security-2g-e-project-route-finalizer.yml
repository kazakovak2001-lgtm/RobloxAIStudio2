name: SECURITY-2G-E Project Route Finalizer

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate

permissions:
  contents: write

jobs:
  finalize-project-routes:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate classified matrix
        run: node --import tsx scripts/generate-authorization-matrix.ts
      - name: Format changed files
        run: node node_modules/prettier/bin/prettier.cjs --write scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.project-routes.test.ts
      - name: Run focused project authorization tests
        run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.project-routes.test.ts server/src/routes/__tests__/projects.runtime.test.ts
      - name: Commit generated authority
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.project-routes.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): classify direct project routes"
          git push origin HEAD:agent/security-2g-e-rbac-parity
