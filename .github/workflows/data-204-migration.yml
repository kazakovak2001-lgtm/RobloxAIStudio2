name: DATA-204 migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - release/cutover-1e-candidate

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded DATA-204 changes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          auth_path = Path("server/src/platform/auth/AuthService.ts")
          auth = auth_path.read_text()
          pattern = re.compile(
              r"\n  login\(email: string, password: string, userId: string\): LoginResult \{.*?\n  \}\n\n  async loginDurable\(",
              re.DOTALL,
          )
          auth, count = pattern.subn("\n  async loginDurable(", auth, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one synchronous AuthService.login block, found {count}")
          auth_path.write_text(auth)

          target_tests = [
              Path("server/src/__tests__/securityHardening.test.ts"),
              Path("server/src/__tests__/preservationProperty.test.ts"),
              Path("server/src/__tests__/harden2a.auth-contract.test.ts"),
              Path("server/src/__tests__/persistence.test.ts"),
              Path("server/src/__tests__/bugConditionExploration.test.ts"),
              Path("server/src/routes/__tests__/projects.runtime.test.ts"),
              Path("server/src/__tests__/productLayer.test.ts"),
          ]
          total_callers = 0
          for test_path in target_tests:
              test = test_path.read_text()
              test, auth_count = re.subn(r"\bauth\.login\(", "await auth.loginDurable(", test)
              test, service_count = re.subn(r"\bauthService\.login\(", "await authService.loginDurable(", test)
              test, numbered_service_count = re.subn(
                  r"\b(authService\d+)\.login\(",
                  r"await \1.loginDurable(",
                  test,
              )
              test, shared_count = re.subn(r"\bsharedAuthService\.login\(", "await sharedAuthService.loginDurable(", test)
              total_callers += auth_count + service_count + numbered_service_count + shared_count
              test_path.write_text(test)

          if total_callers < 18:
              raise SystemExit(f"Unexpectedly small synchronous caller inventory: {total_callers}")

          preservation_path = Path("server/src/__tests__/preservationProperty.test.ts")
          preservation = preservation_path.read_text()
          property_header = 'it("property: login result tokens follow consistent format", async () => {'
          property_start = preservation.find(property_header)
          property_end = preservation.find("    }, 60000);", property_start)
          if property_start < 0 or property_end < 0:
              raise SystemExit("Login token format property test was not found")
          property_block = preservation[property_start:property_end]
          property_count = property_block.count("fc.property(")
          property_block = property_block.replace("fc.property(", "fc.asyncProperty(", 1)
          property_block, callback_count = re.subn(
              r"\(email, password\) => \{",
              "async (email, password) => {",
              property_block,
              count=1,
          )
          if property_count != 1 or callback_count != 1:
              raise SystemExit(
                  f"Unexpected login token property shape: property={property_count}, callback={callback_count}"
              )
          preservation = preservation[:property_start] + property_block + preservation[property_end:]
          preservation_path.write_text(preservation)

          bug_path = Path("server/src/__tests__/bugConditionExploration.test.ts")
          bug = bug_path.read_text()

          salting_header = 'it("property: same password hashed twice SHALL produce different hashes (bcrypt salting)", () => {'
          salting_start = bug.find(salting_header)
          salting_end = bug.find("    }, 60000);", salting_start)
          if salting_start < 0 or salting_end < 0:
              raise SystemExit("Password salting property test was not found")
          salting_block = bug[salting_start:salting_end]
          salting_block = salting_block.replace(
              salting_header,
              'it("property: same password hashed twice SHALL produce different hashes (bcrypt salting)", async () => {',
              1,
          )
          salting_property_count = salting_block.count("fc.property(")
          salting_block = salting_block.replace("fc.property(", "fc.asyncProperty(", 1)
          salting_block, salting_callback_count = re.subn(
              r"\(password\) => \{",
              "async (password) => {",
              salting_block,
              count=1,
          )
          if salting_property_count != 1 or salting_callback_count != 1:
              raise SystemExit(
                  f"Unexpected password salting property shape: property={salting_property_count}, callback={salting_callback_count}"
              )
          bug = bug[:salting_start] + salting_block + bug[salting_end:]

          bug_header = 'it("property: password hashes SHALL use bcrypt format ($2a$12$ or $2b$12$)", () => {'
          bug_start = bug.find(bug_header)
          bug_end = bug.find("    }, 60000);", bug_start)
          if bug_start < 0 or bug_end < 0:
              raise SystemExit("Password hash property test was not found")
          bug_block = bug[bug_start:bug_end]
          bug_block = bug_block.replace(
              bug_header,
              'it("property: password hashes SHALL use bcrypt format ($2a$12$ or $2b$12$)", async () => {',
              1,
          )
          bug_property_count = bug_block.count("fc.property(")
          bug_block = bug_block.replace("fc.property(", "fc.asyncProperty(", 1)
          bug_block, bug_callback_count = re.subn(
              r"\(password\) => \{",
              "async (password) => {",
              bug_block,
              count=1,
          )
          if bug_property_count != 1 or bug_callback_count != 1:
              raise SystemExit(
                  f"Unexpected password hash property shape: property={bug_property_count}, callback={bug_callback_count}"
              )
          bug = bug[:bug_start] + bug_block + bug[bug_end:]
          bug_path.write_text(bug)

          projects_path = Path("server/src/routes/__tests__/projects.runtime.test.ts")
          projects = projects_path.read_text()
          projects, owner_count = re.subn(
              r"const ownerToken = await auth\.loginDurable\((.*?)\n    \)\.token!;",
              r"const ownerToken = (await auth.loginDurable(\1\n    )).token!;",
              projects,
              count=1,
              flags=re.DOTALL,
          )
          projects, other_count = re.subn(
              r"const otherToken = await auth\.loginDurable\((.*?)\n    \)\.token!;",
              r"const otherToken = (await auth.loginDurable(\1\n    )).token!;",
              projects,
              count=1,
              flags=re.DOTALL,
          )
          if owner_count != 1 or other_count != 1:
              raise SystemExit(
                  f"Unexpected project token extraction shape: owner={owner_count}, other={other_count}"
              )
          projects_path.write_text(projects)

          inventory_path = Path("config/durability/compatibility-write-inventory.json")
          inventory = json.loads(inventory_path.read_text())
          entries = inventory.get("entries")
          if not isinstance(entries, list):
              raise SystemExit("Compatibility inventory entries must be a JSON array")
          key = "server/src/platform/auth/AuthService.ts#AuthService.login#set"
          matches = [entry for entry in entries if entry.get("key") == key]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one DATA-204 inventory entry, found {len(matches)}")
          inventory["entries"] = [entry for entry in entries if entry.get("key") != key]
          inventory_path.write_text(json.dumps(inventory, indent=2) + "\n")

      - name: Verify removal guards
        run: |
          if grep -R -F 'AuthService.ts#AuthService.login#set' config; then
            echo "Legacy AuthService.login inventory entry remains"
            exit 1
          fi
          if grep -R -F 'login(email: string, password: string, userId: string): LoginResult' server/src; then
            echo "Synchronous AuthService.login method remains"
            exit 1
          fi
          if grep -R -E '(auth|authService[[:alnum:]_]*|sharedAuthService)\.login\(' server/src; then
            echo "Synchronous AuthService login caller remains"
            exit 1
          fi

      - name: Format and validate focused change
        run: |
          npx prettier --write \
            server/src/platform/auth/AuthService.ts \
            server/src/__tests__/securityHardening.test.ts \
            server/src/__tests__/preservationProperty.test.ts \
            server/src/__tests__/harden2a.auth-contract.test.ts \
            server/src/__tests__/persistence.test.ts \
            server/src/__tests__/bugConditionExploration.test.ts \
            server/src/routes/__tests__/projects.runtime.test.ts \
            server/src/__tests__/productLayer.test.ts \
            config/durability/compatibility-write-inventory.json
          npm run typecheck
          npm run lint
          npm test -- --run \
            server/src/__tests__/securityHardening.test.ts \
            server/src/__tests__/preservationProperty.test.ts \
            server/src/__tests__/harden2a.auth-contract.test.ts \
            server/src/__tests__/persistence.test.ts \
            server/src/__tests__/bugConditionExploration.test.ts \
            server/src/routes/__tests__/projects.runtime.test.ts \
            server/src/__tests__/productLayer.test.ts
          npm run validate

      - name: Commit migration and remove workflow
        run: |
          git rm .github/workflows/data-204-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/platform/auth/AuthService.ts \
            server/src/__tests__/securityHardening.test.ts \
            server/src/__tests__/preservationProperty.test.ts \
            server/src/__tests__/harden2a.auth-contract.test.ts \
            server/src/__tests__/persistence.test.ts \
            server/src/__tests__/bugConditionExploration.test.ts \
            server/src/routes/__tests__/projects.runtime.test.ts \
            server/src/__tests__/productLayer.test.ts \
            config/durability/compatibility-write-inventory.json
          git commit -m "refactor(auth): remove synchronous legacy login compatibility"
          git push origin HEAD:${{ github.head_ref }}