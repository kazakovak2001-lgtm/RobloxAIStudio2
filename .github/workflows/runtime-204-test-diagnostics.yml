name: Diagnose RUNTIME-204 Preservation Contracts

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-preservation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply preview preservation contracts
        run: python scripts/runtime-204-compatibility-patch.py
      - name: Format permanent changes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            .github/workflows/runtime-204-test-diagnostics.yml \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
      - name: Capture validation logs
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          echo "$?" > typecheck.status
          npm run validate:runtime > runtime.log 2>&1
          echo "$?" > runtime.status
          npm run validate:memory > memory.log 2>&1
          echo "$?" > memory.status
          npm run test > test.log 2>&1
          echo "$?" > test.status
          npm run lint > lint.log 2>&1
          echo "$?" > lint.status
          npm run format:check > format.log 2>&1
          echo "$?" > format.status
          tail -n 120 typecheck.log
          tail -n 120 test.log
          exit 0
      - name: Publish validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: runtime-204-preservation-diagnostics-${{ github.sha }}
          path: |
            typecheck.log
            typecheck.status
            runtime.log
            runtime.status
            memory.log
            memory.status
            test.log
            test.status
            lint.log
            lint.status
            format.log
            format.status
          retention-days: 1
      - name: Enforce validation results
        run: |
          test "$(cat typecheck.status)" = "0"
          test "$(cat runtime.status)" = "0"
          test "$(cat memory.status)" = "0"
          test "$(cat test.status)" = "0"
          test "$(cat lint.status)" = "0"
          test "$(cat format.status)" = "0"
