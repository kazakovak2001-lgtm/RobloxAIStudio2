name: Apply RUNTIME-204 Preview Compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-preview-compatibility:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply preview compatibility patch
        run: python scripts/runtime-204-compatibility-patch.py
      - name: Format permanent changes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
      - name: Validate preview compatibility
        run: |
          npm run typecheck
          npm run validate:runtime
          npm run validate:memory
          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
          npm run lint
      - name: Commit compatibility updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "fix(orchestrator): terminate preview sessions truthfully"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
