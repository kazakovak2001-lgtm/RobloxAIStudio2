name: Diagnose RUNTIME-204 Affected Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-affected-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply preview preservation contracts
        run: python scripts/runtime-204-compatibility-patch.py
      - name: Format permanent changes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            .github/workflows/runtime-204-test-diagnostics.yml \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
      - name: Capture affected validation results
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          echo "$?" > typecheck.status

          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/orchestrator/AutonomousOrchestrator.test.ts > orchestrator.log 2>&1
          echo "$?" > orchestrator.status

          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/autonomousPipelineIntegration.test.ts > autonomous-integration.log 2>&1
          echo "$?" > autonomous-integration.status

          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/autonomousPipelinePreservation.test.ts > autonomous-preservation.log 2>&1
          echo "$?" > autonomous-preservation.status

          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/integration.test.ts > integration.log 2>&1
          echo "$?" > integration.status

          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/performance.test.ts > performance.log 2>&1
          echo "$?" > performance.status

          for status_file in *.status; do
            printf '%s=%s\n' "$status_file" "$(cat "$status_file")"
          done
          exit 0
      - name: Publish affected-test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: runtime-204-affected-tests-${{ github.sha }}
          path: |
            *.log
            *.status
          retention-days: 1
      - name: Enforce affected validation results
        run: |
          test "$(cat typecheck.status)" = "0"
          test "$(cat orchestrator.status)" = "0"
          test "$(cat autonomous-integration.status)" = "0"
          test "$(cat autonomous-preservation.status)" = "0"
          test "$(cat integration.status)" = "0"
          test "$(cat performance.status)" = "0"
