name: SECURITY-2G-E Projects Finalizer

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add project route classifications
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-authorization-matrix.ts')
          text = path.read_text()
          evidence_anchor = 'const projectEvidence = "server/src/routes/__tests__/projects.runtime.test.ts";\n'
          if 'const projectRoutesEvidence =' not in text:
              text = text.replace(
                  evidence_anchor,
                  evidence_anchor + 'const projectRoutesEvidence =\n  "server/src/__tests__/security2gE.projects-routes.test.ts";\n',
                  1,
              )

          block = '''  ...[
            ["GET /", "user.projects.list", "owner-project-set", "authenticated"],
            ["POST /", "user.projects.create", "current-user", "authenticated"],
            ["GET /:id", "project.read", "path-project", "project-owner"],
            ["GET /:id/history", "project.history.read", "path-project", "project-owner"],
            ["PUT /:id", "project.update", "path-project", "project-owner"],
            ["DELETE /:id", "project.delete", "path-project", "project-owner"],
          ].map(
            ([operation, capability, scope, classification]) =>
              [
                `rest|server/src/routes/projects.ts|${operation}`,
                classified(
                  classification,
                  "user-session",
                  capability,
                  scope,
                  projectRoutesEvidence,
                  projectRoutesEvidence,
                ),
              ] as const,
          ),
          '''
          if 'user.projects.list' not in text:
              marker = ']);\n\nconst current = JSON.parse('
              if marker not in text:
                  raise SystemExit('generator terminator not found')
              text = text.replace(marker, block + marker, 1)
          path.write_text(text)
          PY
      - run: node --import tsx scripts/generate-authorization-matrix.ts
      - run: node node_modules/prettier/bin/prettier.cjs --write scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.projects-routes.test.ts
      - run: node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/security2gE.projects-routes.test.ts server/src/routes/__tests__/projects.runtime.test.ts
      - run: npm run typecheck
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/generate-authorization-matrix.ts config/security/authorization-matrix.json server/src/__tests__/security2gE.projects-routes.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): classify project ownership routes"
          git push origin HEAD:agent/security-2g-e-rbac-parity
