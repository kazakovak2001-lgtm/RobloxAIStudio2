name: SECURITY-2G-E Resolver Audit

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate

permissions:
  contents: read

jobs:
  audit-resolvers:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - name: Print indirect identifier route contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          terms = ('sessionId', 'pipelineId', 'artifactId', 'executionId')
          route = re.compile(r'router\.(get|post|put|patch|delete)\(')
          for path in sorted(Path('server/src').rglob('*.ts')):
              if '__tests__' in path.parts:
                  continue
              lines = path.read_text(errors='ignore').splitlines()
              for index, line in enumerate(lines):
                  if route.search(line) and any(term in line for term in terms):
                      start = max(0, index - 2)
                      end = min(len(lines), index + 45)
                      print(f'===== {path}:{index + 1} =====')
                      print('\n'.join(f'{i + 1}: {lines[i]}' for i in range(start, end)))
          PY
