name: Temporary Inventory Generation

on:
  push:
    branches:
      - agent/arch-205-boundary-fixtures

permissions:
  contents: write

jobs:
  generate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-205-boundary-fixtures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove temporary workflow and regenerate inventories
        run: |
          git rm .github/workflows/temp-inventory-generation.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
      - name: Commit canonical inventories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inventory_raw.txt ProjectStructure.txt .github/workflows/temp-inventory-generation.yml
          git commit -m "chore(architecture): regenerate tracked inventories"
          git push origin HEAD:agent/arch-205-boundary-fixtures
