name: Temporary Inventory Generation

on:
  push:
    branches:
      - agent/arch-205-boundary-fixtures

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/cleanup/generate-tracked-inventories.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arch-205-generated-inventories
          path: |
            _inventory_raw.txt
            ProjectStructure.txt
          if-no-files-found: error
          retention-days: 1
