name: Apply Agent Routing Fix

on:
  pull_request:
    branches: [feature/plugin-merge]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/canonical-agent-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply focused routing guard and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path("server/src/core/agents/AgentDecisionEngine.ts")
          source = engine_path.read_text(encoding="utf-8")
          old = '''    // Score all available agents
              const scoredAgents: Array<{ agent: string; score: AgentScore }> = [];

              for (const agent of availableAgents) {
          '''.replace("              ", "    ")
          new = '''    const taskHistory = this.memory.getTaskTypeHistory(taskType);
              const assignedHasTaskEvidence = taskHistory.some(
                (record) => record.agent === assignedAgent,
              );

              if (!assignedHasTaskEvidence) {
                const score = this.memory.computeScore(assignedAgent, contextKeys);
                score.compositeScore = this.policy.computeComposite(score);
                return {
                  selectedAgent: assignedAgent,
                  score,
                  alternates: [],
                  selectionReason:
                    "No task-specific evidence for assigned agent — preserving plan assignment",
                  policyMode: this.policy.mode,
                };
              }

              const evidenceBackedAgents = availableAgents.filter(
                (agent) =>
                  agent === assignedAgent ||
                  taskHistory.some((record) => record.agent === agent),
              );

              // Score only agents with exact task-type evidence. An unevaluated
              // agent must not replace the planner's explicit assignment.
              const scoredAgents: Array<{ agent: string; score: AgentScore }> = [];

              for (const agent of evidenceBackedAgents) {
          '''.replace("              ", "    ")
          if old not in source:
              raise SystemExit("AgentDecisionEngine insertion anchor not found")
          source = source.replace(old, new, 1)

          old_assigned = "    if (!availableAgents.includes(assignedAgent)) {"
          new_assigned = "    if (!evidenceBackedAgents.includes(assignedAgent)) {"
          if old_assigned not in source:
              raise SystemExit("AgentDecisionEngine assigned-agent anchor not found")
          source = source.replace(old_assigned, new_assigned, 1)
          engine_path.write_text(source, encoding="utf-8")

          test_path = Path("server/src/__tests__/agentDecisionEngine.routing.test.ts")
          test_path.write_text('''import { describe, expect, it } from "vitest";
          import { AgentDecisionEngine } from "../core/agents/AgentDecisionEngine";

          function record(
            engine: AgentDecisionEngine,
            agent: string,
            taskType: string,
            success: boolean,
            quality: number,
            durationMs: number,
          ): void {
            engine.recordExecution({
              agent,
              taskType,
              executionId: `exec-${agent}-${taskType}`,
              nodeId: `node-${agent}-${taskType}`,
              success,
              quality,
              durationMs,
              contextKeys: ["blueprint"],
              timestamp: Date.now(),
            });
          }

          describe("AgentDecisionEngine canonical routing safety", () => {
            it("preserves the planner assignment when no exact task-type evidence exists", () => {
              const engine = new AgentDecisionEngine();
              record(engine, "requirements", "analysis", true, 95, 10);

              const selection = engine.selectAgent({
                taskType: "generation",
                assignedAgent: "lua_generator",
                availableAgents: [
                  "requirements",
                  "planner",
                  "lua_generator",
                  "ui_generator",
                ],
                contextKeys: ["blueprint"],
              });

              expect(selection.selectedAgent).toBe("lua_generator");
              expect(selection.selectionReason).toContain(
                "preserving plan assignment",
              );
            });

            it("allows adaptive selection only after both agents have exact task evidence", () => {
              const engine = new AgentDecisionEngine();
              record(engine, "lua_generator", "generation", false, 10, 30_000);
              record(engine, "requirements", "generation", true, 100, 10);

              const selection = engine.selectAgent({
                taskType: "generation",
                assignedAgent: "lua_generator",
                availableAgents: ["requirements", "lua_generator"],
                contextKeys: ["blueprint"],
              });

              expect(selection.selectedAgent).toBe("requirements");
            });
          });
          '''.replace("          ", ""), encoding="utf-8")
          PY
          npx prettier --write \
            server/src/core/agents/AgentDecisionEngine.ts \
            server/src/__tests__/agentDecisionEngine.routing.test.ts
          npx vitest run server/src/__tests__/agentDecisionEngine.routing.test.ts
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/core/agents/AgentDecisionEngine.ts server/src/__tests__/agentDecisionEngine.routing.test.ts
          if git diff --cached --quiet; then
            echo "No patch changes required"
          else
            git commit -m "fix(planning): preserve canonical agent assignments"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
