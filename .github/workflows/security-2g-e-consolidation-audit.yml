name: SECURITY-2G-E Consolidation Audit

on:
  pull_request:
    branches: [release/cutover-1e-candidate]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/security-2g-e-rbac-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-e-rbac-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Matrix and evidence inventory
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const matrix = JSON.parse(fs.readFileSync('config/security/authorization-matrix.json', 'utf8'));
          const missing = [];
          const socket = [];
          for (const op of matrix.operations) {
            for (const field of ['classification','principal','capability','resourceScope','positiveEvidence','negativeEvidence']) {
              if (!op[field] || op[field] === 'missing' || op[field] === 'unclassified') missing.push(`${op.transport} ${op.source} ${op.operation}: ${field}=${op[field]}`);
            }
            for (const field of ['positiveEvidence','negativeEvidence']) {
              const value = op[field];
              if (typeof value === 'string' && value.endsWith('.ts') && !fs.existsSync(value)) missing.push(`${op.transport} ${op.operation}: absent ${field} file ${value}`);
            }
            if (op.transport === 'socket.io') socket.push(op);
          }
          console.log(JSON.stringify({total: matrix.operations.length, missingCount: missing.length, socketCount: socket.length, socket}, null, 2));
          if (missing.length) {
            console.error(missing.join('\n'));
            process.exitCode = 1;
          }
          NODE
      - name: Run SECURITY-2G-E tests
        run: |
          FILES=$(find server/src/__tests__ -maxdepth 1 -type f -name 'security2gE*.test.ts' -print | sort | tr '\n' ' ')
          echo "SECURITY_2G_E_TEST_FILES=$(echo "$FILES" | wc -w)"
          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run $FILES
      - run: npm run typecheck
