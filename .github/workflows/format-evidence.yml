name: Format Evidence

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate

permissions:
  contents: read

jobs:
  format-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Capture formatter patch
        run: |
          git diff -- \
            architecture.manifest.json \
            scripts/validate-boundaries.ts \
            scripts/architecture/ast-import-inventory.ts \
            > prettier.patch

      - name: Upload formatted evidence
        uses: actions/upload-artifact@v4
        with:
          name: prettier-evidence
          path: |
            architecture.manifest.json
            scripts/validate-boundaries.ts
            scripts/architecture/ast-import-inventory.ts
            prettier.patch
          if-no-files-found: error
