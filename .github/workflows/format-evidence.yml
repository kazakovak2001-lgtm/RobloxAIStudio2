name: Format Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact repository formatter
        run: |
          git rm .github/workflows/format-evidence.yml
          npm run format

      - name: Capture formatter patch
        run: |
          git diff -- \
            server/src/assembly/AssemblyRegistry.ts \
            server/src/governance/AssemblyGovernanceService.ts \
            architecture.manifest.json \
            > prettier.patch

      - name: Upload formatter evidence
        uses: actions/upload-artifact@v4
        with:
          name: arch-204-prettier-evidence
          path: |
            server/src/assembly/AssemblyRegistry.ts
            server/src/governance/AssemblyGovernanceService.ts
            architecture.manifest.json
            prettier.patch
          if-no-files-found: error
