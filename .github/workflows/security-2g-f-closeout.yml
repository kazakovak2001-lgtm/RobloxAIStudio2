name: SECURITY-2G-F Closeout

on:
  pull_request:
    branches:
      - release/cutover-1e-candidate
    paths:
      - .github/workflows/security-2g-f-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.number == 162 && github.event.pull_request.head.ref == 'agent/security-2g-f-consolidated-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-2g-f-consolidated-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile current project-control documents
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/00-project-control/ROADMAP_STATUS.md')
          text = roadmap.read_text()
          replacements = {
            '**Last Updated:** August 1, 2026': '**Last Updated:** August 2, 2026',
            '**Current backend release:** `release/cutover-1e-candidate@d55fdb4d7eb920d0271d1ee7affe08666cdb270a`': '**Current backend release:** `release/cutover-1e-candidate@29bcd8ed53f9e86f41e753f305ad952c0dbc1de5`',
            '**Current Frontend contents:** `kazakovak2001-lgtm/Frontend@022788ace31982e2b08ea099800de784b4dbe482`': '**Current Frontend contents:** `kazakovak2001-lgtm/Frontend@03aa0615ea13e06b08cdce36b993fa94fb07966a`',
            '| `SECURITY-2G` | Dependency, SAST, credential, image, SBOM, and RBAC control gate | High | In progress — `SECURITY-2G-E` | `DURABILITY-2E` |': '| `SECURITY-2G` | Dependency, SAST, credential, image, SBOM, and RBAC control gate | High | ✅ Complete — `SECURITY-2G-F` | `DURABILITY-2E` |',
            '| `DOC-202` | Documentation-authority inventory and deterministic guards | Medium | In progress | `SECURITY-2G` decisions |': '| `DOC-202` | Documentation-authority inventory and deterministic guards | Medium | Next — separate delivery | `SECURITY-2G` |',
            '**Status:** In progress — RBAC and authorization parity slice  \n**Tracker:** issue #156  \n**Backend baseline:** `release/cutover-1e-candidate@d55fdb4d7eb920d0271d1ee7affe08666cdb270a`  \n**Frontend release contents:** `kazakovak2001-lgtm/Frontend@022788ace31982e2b08ea099800de784b4dbe482`': '**Status:** Complete implementation — consolidated gate validated; PR #162 pending reviewed merge  \n**Tracker:** issue #161 and PR #162  \n**Backend baseline:** `release/cutover-1e-candidate@29bcd8ed53f9e86f41e753f305ad952c0dbc1de5`  \n**Frontend release contents:** `kazakovak2001-lgtm/Frontend@03aa0615ea13e06b08cdce36b993fa94fb07966a`',
            '`SECURITY-2G-A` established the truthful policy contract. `SECURITY-2G-B` completed production dependency controls. `SECURITY-2G-C` completed backend CodeQL and Gitleaks evidence. `SECURITY-2G-D` completed exact backend and paired Frontend runtime-image scanning, digest-bound SPDX SBOM evidence, deterministic policy validation and hardened runtime images with npm removed from final stages. `SECURITY-2G-E` is the active draft slice: its generated matrix covers 204 REST and Socket operations with complete classification and evidence references, API-key eligible routes enforce explicit capabilities and resource scopes, and the two client Socket.IO authority events have positive and negative parity evidence. The consolidated gate remains separate `SECURITY-2G-F` work.': '`SECURITY-2G-A` established the truthful policy contract. `SECURITY-2G-B` completed production dependency controls. `SECURITY-2G-C` completed backend CodeQL and Gitleaks evidence. `SECURITY-2G-D` completed exact backend and paired Frontend runtime-image scanning, digest-bound SPDX SBOM evidence, deterministic policy validation and hardened runtime images with npm removed from final stages. `SECURITY-2G-E` completed the generated 204-operation REST and Socket authorization matrix, API-key capability/resource-scope enforcement and positive/negative parity evidence. `SECURITY-2G-F` now consolidates dependency, SAST, credential, image, SBOM, RBAC, 40-check production-contract and composed HTTPS release evidence into one deterministic fail-closed gate with positive and negative fixtures.',
            '| Frontend SAST and credential detection | Not yet implemented | Frontend repository | Frontend pull request and protected push CI | Same policy thresholds as backend | Frontend-owned scanner evidence bound to Frontend commit |': '| Frontend SAST and credential detection | Tracked as separate Frontend-owned follow-up; paired release credential/image evidence remains exact-commit bound | Frontend repository | Frontend pull request and protected push CI | Same policy thresholds as backend | Frontend-owned scanner evidence bound to Frontend commit |',
            '| Application RBAC | Implemented on draft PR #157; pending reviewed merge | Backend application | Generated authorization matrix plus unit, integration and contract tests | Every protected REST and Socket.IO operation has classification, capability, resource scope and positive/negative evidence | 204-operation route/event matrix, 50 SECURITY-2G-E test files, 137 passing tests |': '| Application RBAC | Implemented and merged through PR #157 | Backend application | Generated authorization matrix plus unit, integration and contract tests | Every protected REST and Socket.IO operation has classification, capability, resource scope and positive/negative evidence | 204-operation route/event matrix, 50 SECURITY-2G-E test files, 137 passing tests |',
            'Completion of `SECURITY-2G-D` does not complete `SECURITY-2G`. `SECURITY-2G-E` remains a draft until reviewed and merged; `SECURITY-2G-F` remains the separate consolidated blocking gate and final documentation reconciliation.': '`SECURITY-2G` implementation is complete through `SECURITY-2G-F`. PR #162 remains subject to reviewed exact-head merge approval; `DOC-202`, `STUDIO-2F`, `AUTONOMY-3A` and `COLLAB-3B` remain separate subsequent deliveries.',
            '- `SECURITY-2G-E`: issue #156 and draft PR #157; generated authorization matrix contains 204 classified operations with no missing evidence references; all 26 API-key eligible operations enforce explicit capabilities and resource scopes; Socket.IO `project:join` and `project:leave` have positive and negative parity evidence; consolidated validation passes 50 test files and 137 tests plus TypeScript.': '- `SECURITY-2G-E`: issue #156 and PR #157; merged commit `29bcd8ed53f9e86f41e753f305ad952c0dbc1de5`; generated authorization matrix contains 204 classified operations, all 26 API-key eligible operations enforce explicit capabilities and resource scopes, and Socket.IO `project:join` and `project:leave` have positive and negative parity evidence.\n- `SECURITY-2G-F`: issue #161 and PR #162; deterministic consolidated manifest and validator bind dependency, CodeQL, credential, image, SBOM, RBAC, production-contract and composed-release evidence; negative fixtures reject missing, stale, wildcard, unowned and unbound evidence; exact-head CI, SAST, image/SBOM and consolidated workflows pass before reviewed merge.',
            '- Active paired release: backend merge `d55fdb4d7eb920d0271d1ee7affe08666cdb270a` plus Frontend contents `022788ace31982e2b08ea099800de784b4dbe482`.': '- Active paired release baseline: backend merge `29bcd8ed53f9e86f41e753f305ad952c0dbc1de5` plus Frontend contents `03aa0615ea13e06b08cdce36b993fa94fb07966a`.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing ROADMAP_STATUS replacement anchor: {old[:100]}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          current = Path('docs/00-project-control/CURRENT_STATE.md')
          text = current.read_text()
          old = "**Last Updated**: July 31, 2026\n**Phase**: FRONTEND-2C complete — REL-203 release-pair promotion\n**Build Status**: REL-203 starts from protected backend base `release/cutover-1e-candidate@f5206a1bed8bce643dfdb169ded951395055c5e5`; the protected REL-203 PR source head containing the promoted inventory is the authority for the candidate backend side of the pair. FRONTEND-2C completed through Frontend PRs #18–#21, and canonical `Frontend/main` is `022788ace31982e2b08ea099800de784b4dbe482`. Frontend CI #140 passed TypeScript, ESLint, Prettier, 22 workspace tests, production build, protected bundle budgets, responsive QA, release image, the 40-check backend contract and Merge Gate. REL-203 issue #144 promotes this exact Frontend commit into the backend release pair; the backend protected PR chain remains the authority for paired release composition. No external production deployment is claimed."
          new = "**Last Updated**: August 2, 2026\n**Phase**: SECURITY-2G implementation complete — consolidated gate pending reviewed merge\n**Build Status**: SECURITY-2G-A through SECURITY-2G-F are implemented. The current backend release baseline is `release/cutover-1e-candidate@29bcd8ed53f9e86f41e753f305ad952c0dbc1de5`, paired with `kazakovak2001-lgtm/Frontend@03aa0615ea13e06b08cdce36b993fa94fb07966a`. PR #162 adds the deterministic consolidated evidence manifest, fail-closed validator, negative fixtures and blocking workflow. Exact-head CI, SAST, credential, image/SBOM, RBAC, protected 40-check production contract, composed HTTPS release, rollback and post-removal invariant gates pass. PR #162 still requires reviewed exact-head merge approval. No external production deployment is claimed."
          if old not in text:
              raise SystemExit('missing CURRENT_STATE header anchor')
          current.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate deterministic inventories
        run: |
          node scripts/cleanup/generate-tracked-inventories.mjs
          grep -vF '.github/workflows/security-2g-f-closeout.yml' _inventory_raw.txt > _inventory_raw.txt.tmp
          mv _inventory_raw.txt.tmp _inventory_raw.txt
          grep -vF 'security-2g-f-closeout.yml' ProjectStructure.txt > ProjectStructure.txt.tmp
          mv ProjectStructure.txt.tmp ProjectStructure.txt
      - name: Verify bounded diff
        run: |
          allowed='^(docs/00-project-control/ROADMAP_STATUS\.md|docs/00-project-control/CURRENT_STATE\.md|_inventory_raw\.txt|ProjectStructure\.txt)$'
          unexpected="$(git diff --name-only | grep -v -E "$allowed" || true)"
          test -z "$unexpected"
          git diff --check -- ':!docs/00-project-control/ROADMAP_STATUS.md'
      - name: Commit closeout
        run: |
          git add -- docs/00-project-control/ROADMAP_STATUS.md docs/00-project-control/CURRENT_STATE.md _inventory_raw.txt ProjectStructure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(security): close SECURITY-2G consolidated gate'
          git fetch origin agent/security-2g-f-consolidated-gate
          git rebase origin/agent/security-2g-f-consolidated-gate
          git push origin HEAD:agent/security-2g-f-consolidated-gate
