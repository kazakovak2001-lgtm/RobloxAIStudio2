name: Temporary Studio Lua Format Artifact

on:
  pull_request:
    branches:
      - feature/plugin-merge

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture repository format check
        run: npm run format:check > prettier-check.log 2>&1 || true

      - name: Format affected Studio files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/studio/artifacts/GenerationArtifactRecorder.ts \
            server/src/__tests__/studio1.artifact-lineage.test.ts \
            server/src/__tests__/studio1.plugin-package.test.ts

      - name: Stage diagnostic output
        run: |
          mkdir -p diagnostic/formatted/server/src/studio/artifacts
          mkdir -p diagnostic/formatted/server/src/__tests__
          cp prettier-check.log diagnostic/prettier-check.log
          cp server/src/studio/artifacts/GenerationArtifactRecorder.ts \
            diagnostic/formatted/server/src/studio/artifacts/GenerationArtifactRecorder.ts
          cp server/src/__tests__/studio1.artifact-lineage.test.ts \
            diagnostic/formatted/server/src/__tests__/studio1.artifact-lineage.test.ts
          cp server/src/__tests__/studio1.plugin-package.test.ts \
            diagnostic/formatted/server/src/__tests__/studio1.plugin-package.test.ts

      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        with:
          name: studio-lua-prettier-diagnostic
          path: diagnostic
          if-no-files-found: error
