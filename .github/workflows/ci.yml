name: Temporary PR82 Preservation Formatting

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  format-preservation-test:
    if: github.head_ref == 'agent/data-201b-project-lifecycle-update-ack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-project-lifecycle-update-ack
          fetch-depth: 0

      - name: Apply exact preservation formatting
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/src/__tests__/preservationProperty.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const oldLine = 'const updated = await projects.updateDurable(p.id, { name: "Updated Game" });';
          const newBlock = `const updated = await projects.updateDurable(p.id, {
            name: "Updated Game",
          });`;
          const matches = source.split(oldLine).length - 1;
          if (matches !== 1) {
            throw new Error(`Expected exactly one unformatted durable update call, found ${matches}`);
          }
          source = source.replace(oldLine, newBlock);
          fs.writeFileSync(path, source);
          NODE
          rm -f .tmp/pr82-prettier-trigger

      - name: Commit exact formatting to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(storage): format preservation update"
          git push origin HEAD:agent/data-201b-project-lifecycle-update-ack
