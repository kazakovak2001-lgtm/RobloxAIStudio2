name: RUNTIME-205 Fixer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-205-fixer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-2d-bounded-phases
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply deterministic contract patch
        run: python scripts/runtime205-fixer.py
      - name: Install dependencies
        run: npm ci
      - name: Format permanent changes
        run: |
          npx prettier --write \
            config/runtime/runtime-ownership.json \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousPhaseRegistry.ts \
            server/src/orchestrator/OrchestratorTypes.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/AutonomousBoundedPhases.test.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
      - name: Remove fixer and restore canonical CI
        run: |
          git fetch origin agent/runtime-2d-autonomous-truthfulness
          git checkout origin/agent/runtime-2d-autonomous-truthfulness -- .github/workflows/ci.yml
          git rm scripts/runtime205-fixer.py
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Runtime ownership
        run: npm run validate:runtime
      - name: Formatting
        run: npm run format:check
      - name: Targeted bounded phase tests
        run: |
          node node_modules/vitest/vitest.mjs \
            --config config/testing/vitest.backend.config.ts run \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/AutonomousBoundedPhases.test.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts \
            server/src/__tests__/autonomousPipelinePreservation.test.ts \
            server/src/__tests__/integration.test.ts \
            server/src/__tests__/performance.test.ts
      - name: Commit validated permanent changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
            exit 0
          fi
          git commit -m "feat(runtime): validate bounded autonomous phases"
          git push origin HEAD:agent/runtime-2d-bounded-phases
