name: CI Pipeline

on:
  push:
    branches: [standing-pentaceratops, feature/plugin-merge]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit --project server/tsconfig.json

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Generate canonical formatter output
        run: npm run format
      - name: Pack formatted CORE-1b files
        run: |
          tar -czf prettier-output.tgz \
            .github/workflows/ci.yml \
            docs/00-project-control/CORE-1B_DURABLE_RUNTIME.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            server/src/__tests__/core1b.persistence.test.ts \
            server/src/__tests__/core1b.postgres.integration.test.ts \
            server/src/platform/storage/StorageFactory.ts \
            server/src/projects/repository/blueprint.repository.ts \
            server/src/projects/repository/storageBlueprint.repository.ts \
            server/src/routes/chatPersistence.ts \
            server/src/services/ChatPersistenceService.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1b-prettier-output
          path: prettier-output.tgz
          retention-days: 1
      - name: Verify formatter produced no diff
        run: git diff --exit-code

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test

  postgres-e2e:
    name: PostgreSQL Restart E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roblox_ai_studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d roblox_ai_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Verify restart durability and ownership isolation
        env:
          STORAGE_PROVIDER: postgres
          DATABASE_URL: postgresql://studio:studio_test_password@localhost:5432/roblox_ai_studio_test
          RUN_POSTGRES_E2E: "true"
        run: npx vitest run server/src/__tests__/core1b.postgres.integration.test.ts

  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run validate

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, test, postgres-e2e, validate]
    steps:
      - run: echo "All checks passed"
