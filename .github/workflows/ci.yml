name: Temporary PR89 Transaction Health Migration

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  migrate-storage-health:
    if: github.head_ref == 'agent/data-201c-transaction-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201c-transaction-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply normalized storage health response
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/src/index.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `app.get("/health/storage", (_req, res) => {
  res.json({
    success: true,
    data: { provider: getStorageType(), status: "available" },
  });
});`;
          const after = `app.get("/health/storage", (_req, res) => {
  const operational = storageProvider.getOperationalStatus();
  res.json({
    success: true,
    data: {
      provider: getStorageType(),
      status: operational.availability,
      durability: operational.durability,
      pendingMutations: operational.pendingMutations,
      ...(operational.lastFailureAt
        ? { lastFailureAt: operational.lastFailureAt }
        : {}),
    },
  });
});`;
          const matches = source.split(before).length - 1;
          if (matches !== 1) {
            throw new Error(`Expected one storage health block, found ${matches}`);
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/index.ts \
            server/src/platform/storage/StorageProvider.ts \
            server/src/platform/storage/postgres/PostgresStorageProvider.ts \
            server/src/platform/storage/postgres/PostgresStorageProvider.test.ts \
            docs/00-project-control/DATA-201C_TRANSACTION_DEGRADATION_POLICY.md
          rm -f .tmp/pr89-health-trigger

      - name: Commit migration to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(storage): expose normalized degradation status"
          git push origin HEAD:agent/data-201c-transaction-foundation
