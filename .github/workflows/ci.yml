name: Temporary PR84 Artifact Test Migration

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  migrate-artifact-tests:
    if: github.head_ref == 'agent/data-201b-artifact-store-ack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-artifact-store-ack
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply AST-based async migration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');

          const paths = [
            'server/src/routes/studio.ts',
            'server/src/__tests__/pluginProtocol.test.ts',
            'server/src/__tests__/studio1.artifact-lineage.test.ts',
            'server/src/__tests__/studioIntegration.test.ts',
            'server/src/studio/v2/sync/__tests__/ArtifactTransferManager.unit.test.ts',
            'server/src/studio/v2/sync/__tests__/ProjectSyncManager.unit.test.ts',
          ];
          const propertyMethods = new Set([
            'store',
            'record',
            'approve',
            'edit',
            'processSyncRequest',
          ]);
          const identifierMethods = new Set(['seedArtifact']);

          const isFunctionLike = (node) =>
            ts.isArrowFunction(node) ||
            ts.isFunctionExpression(node) ||
            ts.isFunctionDeclaration(node) ||
            ts.isMethodDeclaration(node);

          const isAsync = (node) =>
            node.modifiers?.some(
              (modifier) => modifier.kind === ts.SyntaxKind.AsyncKeyword,
            ) ?? false;

          const nearestFunction = (node) => {
            let current = node.parent;
            while (current) {
              if (isFunctionLike(current)) return current;
              current = current.parent;
            }
            return undefined;
          };

          const isInsideRejects = (node) => {
            let current = node.parent;
            while (current && !isFunctionLike(current)) {
              if (
                ts.isPropertyAccessExpression(current) &&
                current.name.text === 'rejects'
              ) {
                return true;
              }
              current = current.parent;
            }
            return false;
          };

          for (const path of paths) {
            let source = fs.readFileSync(path, 'utf8');

            if (path.endsWith('studio1.artifact-lineage.test.ts')) {
              const pattern = /expect\(\(\) =>\s*recorder\.record\("exec-empty-lua-output",\s*\[([\s\S]*?)\]\),\s*\)\.toThrow\("non-empty Studio scripts array"\);/;
              const match = source.match(pattern);
              if (!match) {
                throw new Error(`${path}: rejection assertion was not found`);
              }
              source = source.replace(
                pattern,
                'await expect(\n      recorder.record("exec-empty-lua-output", [$1]),\n    ).rejects.toThrow("non-empty Studio scripts array");',
              );
            }

            const sourceFile = ts.createSourceFile(
              path,
              source,
              ts.ScriptTarget.Latest,
              true,
              ts.ScriptKind.TS,
            );
            const insertions = new Map();

            const markAsync = (node) => {
              const fn = nearestFunction(node);
              if (fn && !isAsync(fn)) {
                insertions.set(fn.getStart(sourceFile), 'async ');
              }
            };

            const visit = (node) => {
              if (ts.isAwaitExpression(node)) {
                markAsync(node);
              }

              if (ts.isCallExpression(node)) {
                let target = false;
                if (
                  ts.isPropertyAccessExpression(node.expression) &&
                  propertyMethods.has(node.expression.name.text)
                ) {
                  target = true;
                } else if (
                  ts.isIdentifier(node.expression) &&
                  identifierMethods.has(node.expression.text)
                ) {
                  target = true;
                }

                if (
                  target &&
                  !ts.isAwaitExpression(node.parent) &&
                  !isInsideRejects(node)
                ) {
                  insertions.set(node.getStart(sourceFile), 'await ');
                  markAsync(node);
                }
              }

              ts.forEachChild(node, visit);
            };
            visit(sourceFile);

            const edits = [...insertions.entries()]
              .map(([position, text]) => ({ position, text }))
              .sort((left, right) => right.position - left.position);
            for (const edit of edits) {
              source =
                source.slice(0, edit.position) +
                edit.text +
                source.slice(edit.position);
            }
            fs.writeFileSync(path, source);
          }
          NODE

          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/routes/studio.ts \
            server/src/__tests__/pluginProtocol.test.ts \
            server/src/__tests__/studio1.artifact-lineage.test.ts \
            server/src/__tests__/studioIntegration.test.ts \
            server/src/studio/v2/sync/__tests__/ArtifactTransferManager.unit.test.ts \
            server/src/studio/v2/sync/__tests__/ProjectSyncManager.unit.test.ts \
            server/src/studio/v2/sync/ProjectSyncManager.ts
          rm -f .tmp/pr84-artifact-test-trigger

      - name: Commit exact migration to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(storage): await artifact persistence in tests"
          git push origin HEAD:agent/data-201b-artifact-store-ack
