name: PR89 Integration Publisher

on:
  push:
    branches:
      - agent/data-201c-transaction-foundation

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply health contract and regenerate inventories
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/cutover-1e-candidate
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server/src/index.ts")
          text = path.read_text()
          old = '''app.get("/health/storage", (_req, res) => {
            res.json({
              success: true,
              data: { provider: getStorageType(), status: "available" },
            });
          });'''
          new = '''app.get("/health/storage", (_req, res) => {
            const operational = storageProvider.getOperationalStatus();
            res.json({
              success: true,
              data: {
                provider: getStorageType(),
                status: operational.availability,
                durability: operational.durability,
                pendingMutations: operational.pendingMutations,
                ...(operational.lastFailureAt
                  ? { lastFailureAt: operational.lastFailureAt }
                  : {}),
              },
            });
          });'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one health/storage block")
          path.write_text(text.replace(old, new))
          PY

          npm ci
          npx prettier --write server/src/index.ts
          node scripts/cleanup/generate-tracked-inventories.mjs
          git show origin/release/cutover-1e-candidate:.github/workflows/ci.yml > .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts ProjectStructure.txt _inventory_raw.txt .github/workflows/ci.yml
          git commit -m "chore(data-201c): finalize transaction foundation integration"

          expected=$(cat <<'EOF'
          ProjectStructure.txt
          _inventory_raw.txt
          docs/00-project-control/DATA-201C_TRANSACTION_DEGRADATION_POLICY.md
          server/src/__tests__/persistence.test.ts
          server/src/index.ts
          server/src/platform/storage/StorageProvider.ts
          server/src/platform/storage/postgres/PostgresStorageProvider.test.ts
          server/src/platform/storage/postgres/PostgresStorageProvider.ts
          EOF
          )
          actual=$(git diff --name-only origin/release/cutover-1e-candidate...HEAD | sort)
          if [ "$actual" != "$expected" ]; then
            echo "unexpected changed file set"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          git push origin HEAD:agent/data-201c-transaction-foundation
