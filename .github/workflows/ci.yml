name: DATA-201B2 Formatter

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-201b2-formatter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: agent/durability-2e-blueprint-ack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format blueprint repository
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          server/src/projects/repository/blueprint.repository.ts
      - name: Restore canonical CI
        run: |
          git fetch origin agent/durability-2e-user-ack
          git show origin/agent/durability-2e-user-ack:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Validate formatted permanent tree
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          node node_modules/vitest/vitest.mjs --config config/testing/vitest.backend.config.ts run server/src/__tests__/platform.test.ts
      - name: Commit validated format
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/ci\.yml|server/src/projects/repository/blueprint\.repository\.ts)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style(data): format blueprint durability repository'
          git push origin HEAD:agent/durability-2e-blueprint-ack
