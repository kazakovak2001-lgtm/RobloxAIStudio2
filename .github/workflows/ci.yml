name: CI Pipeline

on:
  push:
    branches: [standing-pentaceratops, feature/plugin-merge]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit --project server/tsconfig.json

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test

  postgres-e2e:
    name: PostgreSQL Restart E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roblox_ai_studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d roblox_ai_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Verify restart durability and ownership isolation
        env:
          STORAGE_PROVIDER: postgres
          DATABASE_URL: postgresql://studio:studio_test_password@localhost:5432/roblox_ai_studio_test
          RUN_POSTGRES_E2E: "true"
        run: npx vitest run server/src/__tests__/core1b.postgres.integration.test.ts

  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run validate

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Capture commitlint diagnostics
        run: |
          set +e
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} > commitlint-output.txt 2>&1
          echo "$?" > commitlint-exit-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1b-commitlint-final-diagnostics
          path: |
            commitlint-output.txt
            commitlint-exit-code.txt
          retention-days: 1
      - name: Enforce commitlint result
        run: |
          cat commitlint-output.txt
          test "$(cat commitlint-exit-code.txt)" -eq 0

  gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, test, postgres-e2e, validate]
    steps:
      - run: echo "All checks passed"
