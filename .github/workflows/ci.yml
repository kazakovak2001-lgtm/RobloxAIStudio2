name: PR83 Durable Issuance Publisher

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr83-durable-issuance-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 83 && github.head_ref == 'agent/data-201b-api-key-issuance-ack')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-201b-api-key-issuance-ack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply asserted durable issuance patch
        shell: bash
        run: |
          set -euo pipefail
          git show e977eeb101c90c15c294f05a528e63ee0e4dfaae:.github/workflows/ci.yml > /tmp/pr83-publisher.yml
          awk '
            /^          set -euo pipefail$/ { capture = 1 }
            capture { sub(/^          /, ""); print }
          ' /tmp/pr83-publisher.yml > /tmp/pr83-publish.sh
          test -s /tmp/pr83-publish.sh
          python3 <<'PY'
          from pathlib import Path

          path = Path("/tmp/pr83-publish.sh")
          text = path.read_text()

          old = 'text = text.replace("store.issue(", "await store.issueDurable(")'
          new = '''issue_call_count = text.count("store.issue(")
          if issue_call_count != 8:
              raise SystemExit(
                  f"ApiKeyStore test issue call count mismatch: {issue_call_count}"
              )
          text = text.replace("store.issue(", "await store.issueDurable(")'''
          if text.count(old) != 1:
              raise SystemExit("publisher issue transformation anchor mismatch")
          text = text.replace(old, new, 1)

          merge_line = 'git merge -s ours --no-commit "origin/$release_branch"\n'
          if text.count(merge_line) != 1:
              raise SystemExit("publisher merge anchor mismatch")
          text = text.replace(merge_line, "", 1)

          parent_guard = 'test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3\n'
          if text.count(parent_guard) != 1:
              raise SystemExit("publisher parent guard mismatch")
          text = text.replace(parent_guard, "", 1)

          stage_anchor = "git add -A\n"
          if text.count(stage_anchor) != 1:
              raise SystemExit("publisher staging anchor mismatch")
          text = text.replace(
              stage_anchor,
              'git checkout "origin/$release_branch" -- artifacts 2>/dev/null || true\n'
              'git clean -fd artifacts\n'
              'git add -A\n',
              1,
          )

          expected_anchor = "expected=$(printf '%s\\n' \\\n"
          if text.count(expected_anchor) != 1:
              raise SystemExit("publisher expected-set anchor mismatch")
          text = text.replace(
              expected_anchor,
              expected_anchor + "  .github/workflows/ci.yml \\\n",
              1,
          )

          commit_old = "git commit -m 'chore(release): integrate durable API key issuance'\n"
          commit_new = "git commit -m 'chore(release): integrate api key issuance'\n"
          if text.count(commit_old) != 1:
              raise SystemExit("publisher commit-message anchor mismatch")
          text = text.replace(commit_old, commit_new, 1)

          path.write_text(text)
          PY
          bash -n /tmp/pr83-publish.sh
          bash /tmp/pr83-publish.sh
