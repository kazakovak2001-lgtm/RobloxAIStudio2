name: Temporary Project Create Compatibility Removal

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  finalize-project-create-removal:
    if: github.head_ref == 'agent/data-201b-remove-project-create-compat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-remove-project-create-compat
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format project repository and refresh inventories
        run: |
          git rm .tmp/project-create-removal-trigger
          git add server/src/platform/projects/SaaSProjectRepository.durability.test.ts
          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/platform/projects/SaaSProjectRepository.ts \
            server/src/platform/projects/SaaSProjectRepository.durability.test.ts \
            config/durability/compatibility-write-inventory.json
          node scripts/cleanup/generate-tracked-inventories.mjs

      - name: Commit formatted removal to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(projects): finalize create compatibility removal"
          git push origin HEAD:agent/data-201b-remove-project-create-compat
