name: DATA-201C2 Closeout

on:
  push:
    branches:
      - agent/durability-2e-auth-session-transaction
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/durability-2e-auth-session-transaction
          fetch-depth: 0
      - name: Run actions/setup-node@v4
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format DATA-201C2 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/platform/storage/StorageProvider.ts \
            server/src/platform/storage/postgres/PostgresStorageProvider.ts \
            server/src/platform/storage/postgres/PostgresStorageProvider.preconditions.test.ts \
            server/src/platform/auth/AuthService.ts \
            server/src/platform/auth/AuthService.durability.test.ts \
            server/src/routes/platform.ts \
            server/src/routes/__tests__/platform.auth.durability.test.ts
      - name: Restore canonical CI
        run: |
          git fetch origin agent/durability-2e-chat-transaction
          git checkout origin/agent/durability-2e-chat-transaction -- .github/workflows/ci.yml
      - name: Refresh canonical tracked inventories
        run: node scripts/cleanup/generate-tracked-inventories.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Targeted auth durability tests
        run: >-
          node node_modules/vitest/vitest.mjs
          --config config/testing/vitest.backend.config.ts run
          server/src/platform/storage/postgres/PostgresStorageProvider.preconditions.test.ts
          server/src/platform/storage/postgres/PostgresStorageProvider.test.ts
          server/src/platform/auth/AuthService.durability.test.ts
          server/src/routes/__tests__/platform.auth.durability.test.ts
          server/src/__tests__/harden2a.auth-contract.test.ts
          server/src/__tests__/identityAccess.test.ts
          server/src/__tests__/persistence.test.ts
          server/src/__tests__/core1b.persistence.test.ts
      - name: Verify final post-removal invariants
        run: |
          node scripts/cleanup/audit-legacy-frontend-decommission.mjs
          rm -rf artifacts/post-removal-invariants
          rm -f artifacts/post-removal-invariant-audit-result.json
      - name: Commit validated permanent changes
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/ci\.yml|ProjectStructure\.txt|_inventory_raw\.txt|server/src/platform/storage/StorageProvider\.ts|server/src/platform/storage/postgres/PostgresStorageProvider\.ts|server/src/platform/storage/postgres/PostgresStorageProvider\.preconditions\.test\.ts|server/src/platform/auth/AuthService\.ts|server/src/platform/auth/AuthService\.durability\.test\.ts|server/src/routes/platform\.ts|server/src/routes/__tests__/platform\.auth\.durability\.test\.ts)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          HUSKY=0 git commit -m 'test(data): validate auth session transactions'
          git push origin HEAD:agent/durability-2e-auth-session-transaction
