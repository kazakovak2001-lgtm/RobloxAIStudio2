name: RUNTIME-205 Inventory Refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-205-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-2d-bounded-phases
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate exact tracked-file inventory
        run: LC_ALL=C git ls-files | LC_ALL=C sort > _inventory_raw.txt
      - name: Verify post-removal invariants
        run: node scripts/cleanup/audit-legacy-frontend-decommission.mjs
      - name: Restore canonical CI
        run: |
          git fetch origin agent/runtime-2d-autonomous-truthfulness
          git checkout origin/agent/runtime-2d-autonomous-truthfulness -- .github/workflows/ci.yml
      - name: Commit validated inventory only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _inventory_raw.txt .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No inventory change to commit"
            exit 0
          fi
          git diff --cached --name-only
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "_inventory_raw.txt "
          git commit -m "chore(runtime): refresh tracked file inventory"
          git push origin HEAD:agent/runtime-2d-bounded-phases
