name: Temporary PR84 Artifact Async Propagation

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  propagate-artifact-async-contract:
    if: github.head_ref == 'agent/data-201b-artifact-store-ack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-artifact-store-ack
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact PipelineEngine propagation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/src/pipeline/v2/PipelineEngine.ts';
          let source = fs.readFileSync(path, 'utf8');

          const replaceExactly = (before, after, expected = 1) => {
            const matches = source.split(before).length - 1;
            if (matches !== expected) {
              throw new Error(`${path}: expected ${expected} matches, found ${matches}`);
            }
            source = source.split(before).join(after);
          };

          replaceExactly('.then((result) => {', '.then(async (result) => {');
          replaceExactly(
            'this.storeArtifactsFromState(result.state);',
            'await this.storeArtifactsFromState(result.state);',
            6,
          );
          replaceExactly(
            'private storeArtifactsFromState(state: PipelineState): void {',
            'private async storeArtifactsFromState(state: PipelineState): Promise<void> {',
          );
          replaceExactly(
            '          this.artifactStore.store(',
            '          await this.artifactStore.store(',
          );
          replaceExactly(
            '  ): PipelineArtifact | null {\n    return this.artifactStore.approve(artifactId, reviewedBy);\n  }',
            '  ): Promise<PipelineArtifact | null> {\n    return this.artifactStore.approve(artifactId, reviewedBy);\n  }',
          );
          replaceExactly(
            '  ): PipelineArtifact | null {\n    return this.artifactStore.reject(artifactId, reviewedBy, comment);\n  }',
            '  ): Promise<PipelineArtifact | null> {\n    return this.artifactStore.reject(artifactId, reviewedBy, comment);\n  }',
          );
          replaceExactly(
            '  ): PipelineArtifact | null {\n    return this.artifactStore.comment(artifactId, reviewedBy, comment);\n  }',
            '  ): Promise<PipelineArtifact | null> {\n    return this.artifactStore.comment(artifactId, reviewedBy, comment);\n  }',
          );
          replaceExactly(
            '  ): PipelineArtifact | null {\n    return this.artifactStore.edit(artifactId, newContent, editedBy);\n  }',
            '  ): Promise<PipelineArtifact | null> {\n    return this.artifactStore.edit(artifactId, newContent, editedBy);\n  }',
          );

          fs.writeFileSync(path, source);
          NODE

          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/pipeline/v2/ArtifactStore.ts \
            server/src/pipeline/v2/PipelineEngine.ts
          rm -f .tmp/pr84-artifact-propagation-trigger

      - name: Commit exact propagation to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(storage): propagate artifact acknowledgement"
          git push origin HEAD:agent/data-201b-artifact-store-ack
