name: Temporary Chat Message Transaction Formatting

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  format-chat-transaction:
    if: github.head_ref == 'agent/data-201c-chat-message-transaction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201c-chat-message-transaction
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format chat transaction and refresh inventories
        run: |
          git rm .tmp/chat-message-transaction-trigger
          git add server/src/services/ChatPersistenceService.durability.test.ts
          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/services/ChatPersistenceService.ts \
            server/src/services/ChatPersistenceService.durability.test.ts \
            server/src/routes/chatPersistence.ts \
            config/durability/compatibility-write-inventory.json
          node scripts/cleanup/generate-tracked-inventories.mjs

      - name: Commit formatted transaction to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(chat): finalize message transaction"
          git push origin HEAD:agent/data-201c-chat-message-transaction
