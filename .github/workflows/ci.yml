name: DATA-201A Fixer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-201a-fixer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/durability-2e-project-ack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format DATA-201A files
        run: |
          npx prettier --write \
            server/src/platform/projects/SaaSProjectRepository.ts \
            server/src/platform/storage/StorageProvider.ts \
            server/src/platform/storage/postgres/PostgresStorageProvider.ts \
            server/src/platform/storage/postgres/PostgresStorageProvider.test.ts \
            server/src/routes/projects.ts \
            server/src/routes/__tests__/projects.durability.test.ts
      - name: Restore canonical CI
        run: |
          git fetch origin agent/runtime-2d-bounded-phases
          git checkout origin/agent/runtime-2d-bounded-phases -- .github/workflows/ci.yml
      - name: Refresh canonical tracked inventories
        run: node scripts/cleanup/generate-tracked-inventories.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Targeted durability tests
        run: |
          node node_modules/vitest/vitest.mjs \
            --config config/testing/vitest.backend.config.ts run \
            server/src/platform/storage/postgres/PostgresStorageProvider.test.ts \
            server/src/routes/__tests__/projects.durability.test.ts \
            server/src/routes/__tests__/projects.runtime.test.ts \
            server/src/__tests__/core1b.persistence.test.ts \
            server/src/__tests__/core1b.postgres.integration.test.ts
      - name: Verify final post-removal invariants
        run: |
          node scripts/cleanup/audit-legacy-frontend-decommission.mjs
          rm -rf artifacts/post-removal-invariants
      - name: Commit validated permanent changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
            exit 0
          fi
          git status --short
          test ! -e scripts/data201a-fixer.py
          git commit -m "fix(storage): validate project durability acknowledgement"
          git push origin HEAD:agent/durability-2e-project-ack
