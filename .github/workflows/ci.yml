name: PR83 Integration Publisher

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-201b-api-key-issuance-ack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Integrate release and durable API-key issuance
        shell: bash
        run: |
          set -euo pipefail
          release_branch='release/cutover-1e-candidate'
          release_sha='4a0ae15e5959e31470fc1d22c8ae3671bca8829a'
          feature_branch='agent/data-201b-api-key-issuance-ack'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$release_branch"
          test "$(git rev-parse "origin/$release_branch")" = "$release_sha"

          git merge -s ours --no-commit "origin/$release_branch"
          git checkout "origin/$release_branch" -- .

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          api_path = "server/src/platform/security/ApiKeyStore.ts"
          api = Path(api_path)
          text = api.read_text()
          old = '''/**
           * Storage-backed API key registry.
           *
           * Issuance and bootstrap seeding retain their compatibility path until their
           * lifecycle is separated. Revocation and administrative cleanup are
           * acknowledged before their mutations become observable. Because issuance is
           * synchronous, it fails explicitly while cleanup is queued or running rather
           * than racing an acknowledged deletion.
           */'''
          new = '''/**
           * Storage-backed API key registry with acknowledged mutation boundaries.
           *
           * Issuance, revocation, and cleanup are coordinated so mutations for the same
           * key are serialized and cleanup cannot race a newly issued credential.
           */'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore comment anchor mismatch")
          text = text.replace(old, new, 1).replace("revocationQueues", "mutationQueues")

          old = '''  constructor(private readonly storage: StorageProvider) {}

            issue(rawKey: string, metadata: ApiKeyMetadata = {}): IssuedApiKey {
              const key = rawKey.trim();
              if (key.length < MIN_KEY_LENGTH) {
                throw new Error(
                  `API key must contain at least ${MIN_KEY_LENGTH} characters`,
                );
              }
              if (this.cleanupRequests > 0) {
                throw new Error("API key cleanup is in progress");
              }

              const id = metadata.id ?? randomUUID();
              const record: StoredApiKey = {
                id,
                digest: digestKey(key),
                createdAt: new Date().toISOString(),
                ...(metadata.label ? { label: metadata.label } : {}),
                ...(metadata.ownerId ? { ownerId: metadata.ownerId } : {}),
              };
              this.storage.set(COLLECTION, id, record);
              return { id, key };
            }

            generate(metadata: ApiKeyMetadata = {}): IssuedApiKey {
              return this.issue(`rai_${randomBytes(32).toString("hex")}`, metadata);
            }'''
          new = '''  constructor(private readonly storage: StorageProvider) {}

            private async enqueueKeyMutation<T>(
              id: string,
              operation: () => Promise<T>,
            ): Promise<T> {
              const predecessor = this.mutationQueues.get(id) ?? Promise.resolve();
              let release!: () => void;
              const current = new Promise<void>((resolve) => {
                release = resolve;
              });
              const queued = predecessor.then(() => current);
              this.mutationQueues.set(id, queued);

              await predecessor;
              try {
                return await operation();
              } finally {
                release();
                if (this.mutationQueues.get(id) === queued) {
                  this.mutationQueues.delete(id);
                }
              }
            }

            async issueDurable(
              rawKey: string,
              metadata: ApiKeyMetadata = {},
            ): Promise<IssuedApiKey> {
              const key = rawKey.trim();
              if (key.length < MIN_KEY_LENGTH) {
                throw new Error(
                  `API key must contain at least ${MIN_KEY_LENGTH} characters`,
                );
              }
              if (this.cleanupRequests > 0) {
                await this.cleanupTail;
              }

              const id = metadata.id ?? randomUUID();
              return this.enqueueKeyMutation(id, async () => {
                const record: StoredApiKey = {
                  id,
                  digest: digestKey(key),
                  createdAt: new Date().toISOString(),
                  ...(metadata.label ? { label: metadata.label } : {}),
                  ...(metadata.ownerId ? { ownerId: metadata.ownerId } : {}),
                };
                await this.storage.setDurable(COLLECTION, id, record);
                return { id, key };
              });
            }

            async generateDurable(
              metadata: ApiKeyMetadata = {},
            ): Promise<IssuedApiKey> {
              return this.issueDurable(
                `rai_${randomBytes(32).toString("hex")}`,
                metadata,
              );
            }'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore issuance block mismatch")
          text = text.replace(old, new, 1)

          old = '''  async revokeDurable(id: string): Promise<boolean> {
              if (this.cleanupRequests > 0) {
                await this.cleanupTail;
              }

              const predecessor = this.mutationQueues.get(id) ?? Promise.resolve();
              let release!: () => void;
              const current = new Promise<void>((resolve) => {
                release = resolve;
              });
              const queued = predecessor.then(() => current);
              this.mutationQueues.set(id, queued);

              await predecessor;
              try {
                const record = this.storage.get<StoredApiKey>(COLLECTION, id);
                if (!record || record.revokedAt) return false;

                await this.storage.setDurable(COLLECTION, id, {
                  ...record,
                  revokedAt: new Date().toISOString(),
                });
                return true;
              } finally {
                release();
                if (this.mutationQueues.get(id) === queued) {
                  this.mutationQueues.delete(id);
                }
              }
            }'''
          new = '''  async revokeDurable(id: string): Promise<boolean> {
              if (this.cleanupRequests > 0) {
                await this.cleanupTail;
              }

              return this.enqueueKeyMutation(id, async () => {
                const record = this.storage.get<StoredApiKey>(COLLECTION, id);
                if (!record || record.revokedAt) return false;

                await this.storage.setDurable(COLLECTION, id, {
                  ...record,
                  revokedAt: new Date().toISOString(),
                });
                return true;
              });
            }'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore revocation block mismatch")
          text = text.replace(old, new, 1)

          old = '''  /** Seed comma-separated bootstrap keys from API_KEYS. */
            seedFromEnvironment(value = process.env.API_KEYS): number {
              if (!value) return 0;

              let added = 0;
              for (const candidate of value.split(",")) {
                const key = candidate.trim();
                if (key.length < MIN_KEY_LENGTH) continue;

                const digest = digestKey(key);
                const exists = this.storage
                  .list<StoredApiKey>(COLLECTION)
                  .some((record) => record.digest === digest);
                if (exists) continue;

                this.issue(key, {
                  id: `env-${digest.slice(0, 24)}`,
                  label: "environment",
                });
                added += 1;
              }
              return added;
            }'''
          new = '''  /** Seed comma-separated bootstrap keys from API_KEYS after acknowledgement. */
            async seedFromEnvironmentDurable(
              value = process.env.API_KEYS,
            ): Promise<number> {
              if (!value) return 0;

              let added = 0;
              for (const candidate of value.split(",")) {
                const key = candidate.trim();
                if (key.length < MIN_KEY_LENGTH) continue;

                const digest = digestKey(key);
                const exists = this.storage
                  .list<StoredApiKey>(COLLECTION)
                  .some((record) => record.digest === digest);
                if (exists) continue;

                await this.issueDurable(key, {
                  id: `env-${digest.slice(0, 24)}`,
                  label: "environment",
                });
                added += 1;
              }
              return added;
            }'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore seed block mismatch")
          text = text.replace(old, new, 1)
          text = text.replace(
              "Cleanup calls are serialized. Each cleanup waits for revocations that were\n   * already in flight, and new revocations wait for all queued cleanups.",
              "Cleanup calls are serialized. Each cleanup waits for key mutations that were\n   * already in flight, and new mutations wait for all queued cleanups.",
          )
          api.write_text(text)

          test_path = "server/src/platform/security/__tests__/ApiKeyStore.test.ts"
          test = Path(test_path)
          text = test.read_text()

          old = '''  it("rejects issuance while cleanup is in progress", async () => {
              const id = "cleanup-issuance-race";
              store.issue("original-cleanup-key-123456789", { id });
              let markStarted!: () => void;
              let releaseDelete!: () => void;
              const deleteStarted = new Promise<void>((resolve) => {
                markStarted = resolve;
              });
              storage.onDeleteStart = markStarted;
              storage.deleteBarrier = new Promise<void>((resolve) => {
                releaseDelete = resolve;
              });

              const cleanup = store.clearDurable();
              await deleteStarted;

              expect(() =>
                store.issue("replacement-cleanup-key-123456789", { id }),
              ).toThrow("API key cleanup is in progress");

              releaseDelete();
              await expect(cleanup).resolves.toBe(1);

              const replacement = store.issue("replacement-cleanup-key-123456789", {
                id,
              });
              expect(store.validate(replacement.key)).toBe(true);
            });'''
          new = '''  it("waits for cleanup before issuing a replacement key", async () => {
              const id = "cleanup-issuance-race";
              await store.issueDurable("original-cleanup-key-123456789", { id });
              let markStarted!: () => void;
              let releaseDelete!: () => void;
              const deleteStarted = new Promise<void>((resolve) => {
                markStarted = resolve;
              });
              storage.onDeleteStart = markStarted;
              storage.deleteBarrier = new Promise<void>((resolve) => {
                releaseDelete = resolve;
              });

              const cleanup = store.clearDurable();
              await deleteStarted;
              let issuanceStarted = false;
              storage.onSetStart = () => {
                issuanceStarted = true;
              };
              const replacementPromise = store.issueDurable(
                "replacement-cleanup-key-123456789",
                { id },
              );
              await Promise.resolve();
              expect(issuanceStarted).toBe(false);

              releaseDelete();
              await expect(cleanup).resolves.toBe(1);
              const replacement = await replacementPromise;
              expect(issuanceStarted).toBe(true);
              expect(store.validate(replacement.key)).toBe(true);
            });'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore cleanup/issuance test mismatch")
          text = text.replace(old, new, 1)

          old = '''  it("rejects malformed or short credentials", () => {
              expect(store.validate(undefined)).toBe(false);
              expect(store.validate(["test-api-key-123456789"])).toBe(false);
              expect(() => store.issue("too-short")).toThrow(/at least 16/);
            });'''
          new = '''  it("rejects malformed or short credentials", async () => {
              expect(store.validate(undefined)).toBe(false);
              expect(store.validate(["test-api-key-123456789"])).toBe(false);
              await expect(store.issueDurable("too-short")).rejects.toThrow(
                /at least 16/,
              );
            });'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore malformed test mismatch")
          text = text.replace(old, new, 1)

          old = '''  it("seeds unique keys from API_KEYS without duplicating records", () => {
              const value =
                "seed-api-key-123456789, seed-api-key-123456789, another-seed-api-key-123456";

              expect(store.seedFromEnvironment(value)).toBe(2);
              expect(store.seedFromEnvironment(value)).toBe(0);
              expect(store.validate("seed-api-key-123456789")).toBe(true);
              expect(store.validate("another-seed-api-key-123456")).toBe(true);
              expect(store.list()).toHaveLength(2);
            });'''
          new = '''  it("seeds unique keys from API_KEYS without duplicating records", async () => {
              const value =
                "seed-api-key-123456789, seed-api-key-123456789, another-seed-api-key-123456";

              await expect(store.seedFromEnvironmentDurable(value)).resolves.toBe(2);
              await expect(store.seedFromEnvironmentDurable(value)).resolves.toBe(0);
              expect(store.validate("seed-api-key-123456789")).toBe(true);
              expect(store.validate("another-seed-api-key-123456")).toBe(true);
              expect(store.list()).toHaveLength(2);
            });'''
          if text.count(old) != 1:
              raise SystemExit("ApiKeyStore seed test mismatch")
          text = text.replace(old, new, 1)

          text = text.replace(
              'it("validates an issued key without storing the plain-text credential", () => {',
              'it("validates an issued key without storing the plain-text credential", async () => {',
              1,
          )
          text = text.replace("store.issue(", "await store.issueDurable(")

          marker = '''  it("revokes a key after acknowledgement and is idempotent", async () => {'''
          insertion = '''  it("does not publish an issued key when persistence is rejected", async () => {
              storage.rejectSet = true;

              await expect(
                store.issueDurable("rejected-issue-key-123456789", {
                  id: "rejected-issue",
                  label: "rejected",
                }),
              ).rejects.toMatchObject({
                code: "DURABLE_STORAGE_MUTATION_FAILED",
                operation: "set",
              });
              expect(store.validate("rejected-issue-key-123456789")).toBe(false);
              expect(storage.get("platform_api_keys", "rejected-issue")).toBeNull();
              expect(store.list()).toEqual([]);
            });

            it("generates a key only after persistence acknowledgement", async () => {
              const issued = await store.generateDurable({ label: "generated" });

              expect(issued.key).toMatch(/^rai_[0-9a-f]{64}$/);
              expect(store.validate(issued.key)).toBe(true);
              expect(store.list()).toEqual([
                {
                  id: issued.id,
                  createdAt: expect.any(String),
                  label: "generated",
                },
              ]);
            });

          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit("ApiKeyStore insertion marker mismatch")
          text = text.replace(marker, insertion, 1)

          anchor = '''    const issued = await store.issueDurable("concurrent-revoke-key-123456789");
              let markStarted!: () => void;'''
          replacement = '''    const issued = await store.issueDurable("concurrent-revoke-key-123456789");
              storage.setDurableCalls = 0;
              let markStarted!: () => void;'''
          if text.count(anchor) != 1:
              raise SystemExit("ApiKeyStore concurrent revocation anchor mismatch")
          text = text.replace(anchor, replacement, 1)

          marker = '''  it("waits for an in-flight revocation before cleanup", async () => {'''
          insertion = '''  it("waits for an in-flight issuance before cleanup", async () => {
              let markStarted!: () => void;
              let releaseWrite!: () => void;
              const writeStarted = new Promise<void>((resolve) => {
                markStarted = resolve;
              });
              storage.onSetStart = markStarted;
              storage.setBarrier = new Promise<void>((resolve) => {
                releaseWrite = resolve;
              });

              const issuance = store.issueDurable("cleanup-issuance-key-123456789");
              await writeStarted;
              const cleanup = store.clearDurable();
              releaseWrite();

              await expect(issuance).resolves.toEqual({
                id: expect.any(String),
                key: "cleanup-issuance-key-123456789",
              });
              await expect(cleanup).resolves.toBe(1);
              expect(store.list()).toEqual([]);
            });

          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit("ApiKeyStore cleanup insertion marker mismatch")
          text = text.replace(marker, insertion, 1)
          test.write_text(text)

          replace_once(
              "server/src/index.ts",
              "  getApiKeyStore().seedFromEnvironment();",
              "  await getApiKeyStore().seedFromEnvironmentDurable();",
          )
          replace_once(
              "server/src/__tests__/securityHardening.test.ts",
              '      const issued = store.issue("my-api-key-1234567", {',
              '      const issued = await store.issueDurable("my-api-key-1234567", {',
          )
          replace_once(
              "server/src/__tests__/securityHardening.test.ts",
              '      store.issue("array-header-api-key-123456", { label: "array-test" });',
              '      await store.issueDurable("array-header-api-key-123456", {\n        label: "array-test",\n      });',
          )

          inventory_path = "config/durability/compatibility-write-inventory.json"
          inventory = Path(inventory_path)
          text = inventory.read_text()
          obsolete = '''    {
                "key": "server/src/platform/security/ApiKeyStore.ts#ApiKeyStore.issue#set",
                "path": "server/src/platform/security/ApiKeyStore.ts",
                "owner": "ApiKeyStore.issue",
                "operation": "set",
                "expectedCalls": 1,
                "classification": "bootstrap-compatibility",
                "reason": "Environment API-key seeding and programmatic issuance still share a synchronous write path.",
                "migrationTarget": "DATA-201B"
              },
          '''
          if text.count(obsolete) != 1:
              raise SystemExit("compatibility inventory issuance entry mismatch")
          inventory.write_text(text.replace(obsolete, "", 1))
          PY

          npm ci
          npx prettier --write \
            config/durability/compatibility-write-inventory.json \
            server/src/index.ts \
            server/src/platform/security/ApiKeyStore.ts \
            server/src/platform/security/__tests__/ApiKeyStore.test.ts \
            server/src/__tests__/securityHardening.test.ts
          npm run typecheck
          npm run lint
          npx vitest run \
            server/src/platform/security/__tests__/ApiKeyStore.test.ts \
            server/src/__tests__/securityHardening.test.ts
          npm run validate

          git add -A
          expected=$(printf '%s\n' \
            config/durability/compatibility-write-inventory.json \
            server/src/__tests__/securityHardening.test.ts \
            server/src/index.ts \
            server/src/platform/security/ApiKeyStore.ts \
            server/src/platform/security/__tests__/ApiKeyStore.test.ts | sort)
          actual=$(git diff --cached --name-only | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected staged file set:'
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          git commit -m 'chore(release): integrate durable API key issuance'
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin "HEAD:$feature_branch"
