name: CI Pipeline

on:
  push:
    branches: [release/cutover-1e-candidate, feature/plugin-merge]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test

  postgres-e2e:
    name: PostgreSQL Restart E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roblox_ai_studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d roblox_ai_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Verify restart durability and ownership isolation
        env:
          STORAGE_PROVIDER: postgres
          DATABASE_URL: postgresql://studio:studio_test_password@localhost:5432/roblox_ai_studio_test
          RUN_POSTGRES_E2E: "true"
        run: npm run test:postgres

  backend-image:
    name: Backend Release Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend-only image
        run: docker build --file Dockerfile.backend --tag roblox-ai-studio-backend:cutover .
      - name: Start backend-only container
        run: |
          docker run --detach \
            --name roblox-ai-studio-backend-cutover \
            --publish 5050:5000 \
            --env NODE_ENV=production \
            --env PORT=5000 \
            --env STORAGE_PROVIDER=inmemory \
            --env FRONTEND_URL=http://127.0.0.1:8080 \
            roblox-ai-studio-backend:cutover
      - name: Verify backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5050/health > /tmp/backend-health.json; then
              cat /tmp/backend-health.json
              grep --quiet '"status":"healthy"' /tmp/backend-health.json
              exit 0
            fi
            sleep 1
          done
          docker inspect roblox-ai-studio-backend-cutover || true
          exit 1
      - name: Capture backend container logs
        if: always()
        run: docker logs roblox-ai-studio-backend-cutover > backend-container.log 2>&1 || true
      - name: Publish backend container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-container-diagnostics-${{ github.event.pull_request.head.sha }}
          path: backend-container.log
          if-no-files-found: error
          retention-days: 1
      - name: Print backend logs on failure
        if: failure()
        run: cat backend-container.log || true
      - name: Stop backend container
        if: always()
        run: docker rm --force roblox-ai-studio-backend-cutover || true

  production-contract:
    name: Frontend Production Contract
    runs-on: ubuntu-latest
    # CI-FRONTEND-CONTRACT-1. The E2E contract script (Frontend
    # scripts/e2e-backend.mjs) can throw on a genuine failure — e.g. the
    # current Idempotency-Key contract drift — after opening a Socket.IO
    # client it never reaches the code path that disconnects. `run().catch()`
    # sets `process.exitCode` without forcing exit, so the open socket keeps
    # Node's event loop alive and the step never returns, leaving this job
    # "in_progress" until GitHub's platform default (6h) kills it — which
    # reads as permanently pending to any human or branch-protection check.
    # This bound turns that into a real, fast failure instead. Fixing the
    # underlying hang lives in the Frontend repo's E2E script, out of scope
    # here.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      INT201_BACKEND_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      INT201_FRONTEND_ORIGIN: http://127.0.0.1:4173
      INT201_API_URL: http://127.0.0.1:5051/api
      INT201_SOCKET_URL: http://127.0.0.1:5051
    steps:
      - name: Checkout exact backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INT201_BACKEND_SHA }}
          fetch-depth: 0
          persist-credentials: false
      # CI-PRODUCTION-CONTRACT-CONTROL-HEAD-2. This job used to pin Frontend to
      # the static `frontendRelease.commit` field, which #247 (Release Pair
      # Freshness) never updates — it can go stale relative to the Frontend
      # control branch while nothing here notices. Resolve the same
      # `runtimePair` authority #247 established instead of a second one,
      # through the shared scripts that authority now runs from
      # (scripts/ci/*.sh — covered by scripts/ci/__tests__).
      - name: Resolve canonical Frontend control head
        id: pair
        run: scripts/ci/resolve-frontend-control-head.sh config/cutover/release-baseline.inventory.json >> "$GITHUB_OUTPUT"
      - name: Checkout exact Frontend contract
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pair.outputs.frontend_repo }}
          ref: ${{ steps.pair.outputs.resolved_control }}
          path: standalone-frontend
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and record exact contract sources
        env:
          INT201_FRONTEND_SHA: ${{ steps.pair.outputs.resolved_control }}
          EXPECTED_BACKEND_RUNTIME: ${{ steps.pair.outputs.backend_runtime }}
          EXPECTED_FRONTEND_RUNTIME: ${{ steps.pair.outputs.frontend_runtime }}
          PAIR_ID: ${{ steps.pair.outputs.pair_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INT201_BACKEND_SHA"
          test "$(git -C standalone-frontend rev-parse HEAD)" = "$INT201_FRONTEND_SHA"

          scripts/ci/verify-frontend-control-pair.sh \
            standalone-frontend "$EXPECTED_FRONTEND_RUNTIME" "$EXPECTED_BACKEND_RUNTIME"

          mkdir -p artifacts/int-201
          printf '%s\n' \
            "contract=INT-201" \
            "pairId=$PAIR_ID" \
            "backendSha=$INT201_BACKEND_SHA" \
            "backendRuntimeSha=$EXPECTED_BACKEND_RUNTIME" \
            "frontendSha=$INT201_FRONTEND_SHA" \
            "frontendRuntimeSha=$EXPECTED_FRONTEND_RUNTIME" \
            "frontendControlBranch=${{ steps.pair.outputs.frontend_control_branch }}" \
            "nodeEnv=production" \
            "storageProvider=inmemory" \
            "frontendOrigin=$INT201_FRONTEND_ORIGIN" \
            "apiUrl=$INT201_API_URL" \
            "socketUrl=$INT201_SOCKET_URL" \
            > artifacts/int-201/runtime.env
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: standalone-frontend/package-lock.json
      - name: Install exact Frontend contract dependencies
        run: npm ci --prefix standalone-frontend
      - name: Build exact production backend image
        run: |
          docker build \
            --file Dockerfile.backend \
            --label "org.opencontainers.image.revision=$INT201_BACKEND_SHA" \
            --tag roblox-ai-studio-backend:int-201 \
            .
      - name: Start production backend
        run: |
          docker run --detach \
            --name roblox-ai-studio-backend-int-201 \
            --publish 5051:5000 \
            --env NODE_ENV=production \
            --env PORT=5000 \
            --env STORAGE_PROVIDER=inmemory \
            --env FRONTEND_URL="$INT201_FRONTEND_ORIGIN" \
            roblox-ai-studio-backend:int-201
      - name: Wait for production backend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$INT201_SOCKET_URL/health" > /tmp/int-201-health.json; then
              grep --quiet '"status":"healthy"' /tmp/int-201-health.json
              exit 0
            fi
            sleep 1
          done
          docker inspect roblox-ai-studio-backend-int-201 || true
          exit 1
      - name: Run protected 40-check contract
        env:
          E2E_API_URL: ${{ env.INT201_API_URL }}
          E2E_SOCKET_URL: ${{ env.INT201_SOCKET_URL }}
          E2E_EVIDENCE_PATH: ${{ github.workspace }}/artifacts/int-201/contract.json
          E2E_CONTRACT_MODE: production
          E2E_BACKEND_SHA: ${{ env.INT201_BACKEND_SHA }}
          E2E_FRONTEND_SHA: ${{ steps.pair.outputs.resolved_control }}
          E2E_BACKEND_NODE_ENV: production
          E2E_STORAGE_PROVIDER: inmemory
          E2E_FRONTEND_ORIGIN: ${{ env.INT201_FRONTEND_ORIGIN }}
        run: |
          set -o pipefail
          npm --prefix standalone-frontend run test:e2e:integration 2>&1 | tee artifacts/int-201/e2e.log
      - name: Capture production contract diagnostics
        if: always()
        run: |
          mkdir -p artifacts/int-201
          cp /tmp/int-201-health.json artifacts/int-201/backend-health.json 2>/dev/null || true
          docker logs roblox-ai-studio-backend-int-201 > artifacts/int-201/backend.log 2>&1 || true
          docker image inspect roblox-ai-studio-backend:int-201 > artifacts/int-201/backend-image.json 2>&1 || true
      - name: Publish production contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-201-production-contract-${{ env.INT201_BACKEND_SHA }}
          path: artifacts/int-201
          if-no-files-found: error
          retention-days: 14
      - name: Print backend logs on failure
        if: failure()
        run: cat artifacts/int-201/backend.log || true
      - name: Stop production backend
        if: always()
        run: docker rm --force roblox-ai-studio-backend-int-201 || true

  composed-release:
    name: Composed HTTPS Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend release source
        uses: actions/checkout@v4
      - name: Resolve exact Frontend release commit
        id: frontend-release
        run: |
          frontend_sha="$(jq --raw-output '.frontendRelease.commit' config/cutover/release-baseline.inventory.json)"
          [[ "$frontend_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$frontend_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact Frontend release commit
        uses: actions/checkout@v4
        with:
          repository: kazakovak2001-lgtm/Frontend
          ref: ${{ steps.frontend-release.outputs.sha }}
          path: standalone-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Configure release identity
        run: |
          echo "BACKEND_IMAGE=roblox-ai-studio-backend:cutover-1c" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=roblox-ai-studio-frontend:cutover-1c" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=cutover_1c_ci_password" >> "$GITHUB_ENV"
          echo "RELEASE_ORIGIN=https://localhost:8443" >> "$GITHUB_ENV"
          echo "RELEASE_PORT=8443" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_DIR=${GITHUB_WORKSPACE}/.cutover-certs" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=${GITHUB_WORKSPACE}/.cutover-certs/release.crt" >> "$GITHUB_ENV"
      - name: Generate CI-only TLS certificate
        run: |
          mkdir -p .cutover-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .cutover-certs/release.key \
            -out .cutover-certs/release.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Build exact backend and Frontend images
        run: |
          docker build \
            --file Dockerfile.backend \
            --tag "$BACKEND_IMAGE" \
            .
          docker build \
            --build-arg VITE_API_URL="$RELEASE_ORIGIN/api" \
            --build-arg VITE_SOCKET_URL="$RELEASE_ORIGIN" \
            --tag "$FRONTEND_IMAGE" \
            standalone-frontend
      - name: Start composed HTTPS release
        run: docker compose --project-name cutover1c --file deploy/docker-compose.release.yml up --detach
      - name: Verify secure REST and Socket.IO composition
        run: node scripts/cutover/verify-composed-release.mjs
      - name: Capture composition diagnostics
        if: always()
        run: |
          mkdir -p artifacts/cutover-1c
          docker compose --project-name cutover1c --file deploy/docker-compose.release.yml ps --all > artifacts/cutover-1c/compose-ps.txt || true
          docker compose --project-name cutover1c --file deploy/docker-compose.release.yml logs --no-color > artifacts/cutover-1c/compose.log 2>&1 || true
      - name: Publish composition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c-composition-${{ github.event.pull_request.head.sha }}
          path: artifacts/cutover-1c
          if-no-files-found: error
          retention-days: 3
      - name: Stop composed release
        if: always()
        run: docker compose --project-name cutover1c --file deploy/docker-compose.release.yml down --volumes --remove-orphans || true

  release-readiness:
    name: Promoted Baseline Integrity
    runs-on: ubuntu-latest
    needs: composed-release
    steps:
      - name: Checkout promoted baseline source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact Frontend release commit
        id: frontend-release
        run: |
          frontend_sha="$(jq --raw-output '.frontendRelease.commit' config/cutover/release-baseline.inventory.json)"
          [[ "$frontend_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$frontend_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact Frontend release commit
        uses: actions/checkout@v4
        with:
          repository: kazakovak2001-lgtm/Frontend
          ref: ${{ steps.frontend-release.outputs.sha }}
          path: standalone-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Fetch promoted and rollback references
        run: git fetch origin release/cutover-1e-candidate backup/default-before-cutover-1e feature/plugin-merge
      - name: Verify promoted default and release integrity
        env:
          PROMOTED_DEFAULT_REF: origin/release/cutover-1e-candidate
          ROLLBACK_REF: origin/backup/default-before-cutover-1e
          PROMOTED_BASELINE_OUTPUT: artifacts/cutover-1f
        run: node scripts/cutover/verify-promoted-baseline-integrity.mjs
      - name: Rehearse independent artifact rollback
        env:
          FRONTEND_SOURCE: standalone-frontend
          RELEASE_BASELINE_OUTPUT: artifacts/cutover-1f
        run: bash scripts/cutover/rehearse-independent-rollback.sh
      - name: Publish promoted baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1f-promotion-integrity
          path: artifacts/cutover-1f
          if-no-files-found: error
          retention-days: 3

  legacy-frontend-audit:
    name: Post-Removal Invariant Guard
    runs-on: ubuntu-latest
    needs: release-readiness
    steps:
      - name: Checkout cleanup audit source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Verify post-removal invariants
        env:
          LEGACY_FRONTEND_AUDIT_OUTPUT: artifacts/post-removal-invariants
        run: node scripts/cleanup/audit-legacy-frontend-decommission.mjs
      - name: Publish post-removal invariant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-removal-invariant-audit
          path: artifacts/post-removal-invariants
          if-no-files-found: error
          retention-days: 3

  dependency-security:
    name: Dependency Security Evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECURITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact dependency source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Validate dependency policy and exception registry
        run: npm run validate:security-policy
      - name: Capture dependency change evidence
        run: |
          mkdir -p artifacts/security-dependencies
          if [[ -n "$SECURITY_BASE_SHA" ]]; then
            git diff --name-status "$SECURITY_BASE_SHA" "$SECURITY_SOURCE_SHA" -- package.json package-lock.json \
              > artifacts/security-dependencies/dependency-changes.txt
          else
            printf '%s\n' "No pull-request base SHA supplied for event ${GITHUB_EVENT_NAME}." \
              > artifacts/security-dependencies/dependency-changes.txt
          fi
      - name: Run production dependency audit
        id: production-audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json \
            > artifacts/security-dependencies/npm-audit.json
          audit_status=$?
          set -e
          echo "status=$audit_status" >> "$GITHUB_OUTPUT"
      - name: Bind audit evidence to source and lockfile
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.production-audit.outputs.status || '1' }}
        run: |
          lockfile_sha256="$(sha256sum package-lock.json | awk '{print $1}')"
          changed_files="$(jq --raw-input --slurp 'split("\n") | map(select(length > 0))' artifacts/security-dependencies/dependency-changes.txt)"
          jq --null-input \
            --arg controlId "SECURITY-2G-B" \
            --arg repository "kazakovak2001-lgtm/RobloxAIStudio2" \
            --arg sourceSha "$SECURITY_SOURCE_SHA" \
            --arg lockfileSha256 "$lockfile_sha256" \
            --argjson auditExitCode "$AUDIT_STATUS" \
            --argjson dependencyChanges "$changed_files" \
            --slurpfile audit artifacts/security-dependencies/npm-audit.json \
            '{controlId: $controlId, repository: $repository, sourceSha: $sourceSha, lockfileSha256: $lockfileSha256, productionOnly: true, auditLevel: "high", auditExitCode: $auditExitCode, dependencyChanges: $dependencyChanges, audit: $audit[0]}' \
            > artifacts/security-dependencies/evidence.json
      - name: Publish dependency security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-2g-b-dependencies-${{ env.SECURITY_SOURCE_SHA }}
          path: artifacts/security-dependencies
          if-no-files-found: error
          retention-days: 14
      - name: Enforce production dependency threshold
        env:
          AUDIT_STATUS: ${{ steps.production-audit.outputs.status || '1' }}
        run: test "$AUDIT_STATUS" -eq 0

  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run validate

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx commitlint --config commitlint.config.js --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs:
      [
        typecheck,
        lint,
        format,
        test,
        postgres-e2e,
        backend-image,
        production-contract,
        composed-release,
        release-readiness,
        legacy-frontend-audit,
        dependency-security,
        validate,
      ]
    steps:
      - run: echo "All checks passed"
