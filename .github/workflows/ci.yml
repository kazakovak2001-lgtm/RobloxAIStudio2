name: Temporary PR82 Exact Prettier

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  prettier-preservation-test:
    if: github.head_ref == 'agent/data-201b-project-lifecycle-update-ack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-project-lifecycle-update-ack
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run exact repository Prettier
        run: |
          node node_modules/prettier/bin/prettier.cjs --write server/src/__tests__/preservationProperty.test.ts
          rm -f .tmp/pr82-prettier-exact-trigger

      - name: Commit exact Prettier output to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(storage): apply exact preservation formatting"
          git push origin HEAD:agent/data-201b-project-lifecycle-update-ack
