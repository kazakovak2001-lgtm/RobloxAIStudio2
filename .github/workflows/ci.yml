name: Temporary PR89 Tracked Inventory Refresh

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  refresh-tracked-inventories:
    if: github.head_ref == 'agent/data-201c-transaction-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201c-transaction-foundation
          fetch-depth: 0

      - name: Remove temporary trigger and refresh inventories
        run: |
          git rm .tmp/pr89-inventory-refresh-trigger
          node scripts/cleanup/generate-tracked-inventories.mjs

      - name: Commit refreshed inventories to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(repo): refresh tracked inventories"
          git push origin HEAD:agent/data-201c-transaction-foundation
