name: CI Pipeline

on:
  push:
    branches: [standing-pentaceratops, feature/plugin-merge]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit --project server/tsconfig.json

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test

  postgres-e2e:
    name: PostgreSQL Restart E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roblox_ai_studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d roblox_ai_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Verify restart durability and ownership isolation
        env:
          STORAGE_PROVIDER: postgres
          DATABASE_URL: postgresql://studio:studio_test_password@localhost:5432/roblox_ai_studio_test
          RUN_POSTGRES_E2E: "true"
        run: npx vitest run server/src/__tests__/core1b.postgres.integration.test.ts

  backend-image:
    name: Backend Release Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend-only image
        run: docker build --file Dockerfile.backend --tag roblox-ai-studio-backend:cutover .
      - name: Start backend-only container
        run: |
          docker run --detach \
            --name roblox-ai-studio-backend-cutover \
            --publish 5050:5000 \
            --env NODE_ENV=production \
            --env PORT=5000 \
            --env STORAGE_PROVIDER=inmemory \
            --env FRONTEND_URL=http://127.0.0.1:8080 \
            roblox-ai-studio-backend:cutover
      - name: Verify backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5050/health > /tmp/backend-health.json; then
              cat /tmp/backend-health.json
              grep --quiet '"status":"healthy"' /tmp/backend-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs roblox-ai-studio-backend-cutover
          exit 1
      - name: Print backend logs on failure
        if: failure()
        run: docker logs roblox-ai-studio-backend-cutover || true
      - name: Stop backend container
        if: always()
        run: docker rm --force roblox-ai-studio-backend-cutover || true

  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run validate

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx commitlint --config commitlint.config.cjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, test, postgres-e2e, backend-image, validate]
    steps:
      - run: echo "All checks passed"
