name: Temporary PR84 Tracked Inventory Refresh

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  refresh-tracked-inventories:
    if: github.head_ref == 'agent/data-201b-artifact-store-ack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-artifact-store-ack
          fetch-depth: 0

      - name: Remove temporary trigger from tracked set
        run: git rm .tmp/pr84-inventory-refresh-trigger

      - name: Refresh deterministic tracked inventories
        run: node scripts/cleanup/generate-tracked-inventories.mjs

      - name: Commit refreshed inventories to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inventory_raw.txt ProjectStructure.txt project_structure.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(repo): refresh tracked inventories"
          git push origin HEAD:agent/data-201b-artifact-store-ack
