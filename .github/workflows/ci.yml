name: PR89 Review Fix Publisher

on:
  push:
    branches: [agent/data-201c-transaction-foundation]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/cutover-1e-candidate
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match")
              return text.replace(old, new)

          path = Path("server/src/platform/storage/postgres/PostgresStorageProvider.ts")
          text = path.read_text()
          changes = [
              (
                  "fields",
                  "  private pendingWrites = new Set<Promise<void>>();\n  private writeTail: Promise<void> = Promise.resolve();\n  private lastFailureAt?: string;",
                  "  private pendingWrites = new Set<Promise<void>>();\n  private writeTail: Promise<void> = Promise.resolve();\n  private compatibilityMutationVersions = new Map<string, number>();\n  private lastFailureAt?: string;\n  private closed = false;",
              ),
              (
                  "compatibility set",
                  "  set<T>(collection: string, id: string, data: T): void {\n    this.getCollection(collection).set(id, data);\n    this.scheduleWrite(() => this.persistSet(collection, id, data));\n  }",
                  "  set<T>(collection: string, id: string, data: T): void {\n    this.recordCompatibilityMutation(collection, id);\n    this.getCollection(collection).set(id, data);\n    this.scheduleWrite(() => this.persistSet(collection, id, data));\n  }",
              ),
              (
                  "compatibility delete",
                  "  delete(collection: string, id: string): boolean {\n    const deleted = this.getCollection(collection).delete(id);\n    if (deleted) this.scheduleWrite(() => this.persistDelete(collection, id));\n    return deleted;\n  }",
                  "  delete(collection: string, id: string): boolean {\n    const deleted = this.getCollection(collection).delete(id);\n    if (deleted) {\n      this.recordCompatibilityMutation(collection, id);\n      this.scheduleWrite(() => this.persistDelete(collection, id));\n    }\n    return deleted;\n  }",
              ),
              (
                  "batch capture",
                  "      await this.enqueueWrite(async () => {\n        const pool = this.pool;",
                  "      await this.enqueueWrite(async () => {\n        const compatibilityVersions = new Map<string, number>();\n        for (const mutation of mutations) {\n          const key = this.mutationKey(mutation.collection, mutation.id);\n          compatibilityVersions.set(\n            key,\n            this.compatibilityMutationVersions.get(key) ?? 0,\n          );\n        }\n\n        const pool = this.pool;",
              ),
              (
                  "batch publication",
                  "        for (const mutation of mutations) {\n          const collection = this.getCollection(mutation.collection);\n          if (mutation.operation === \"set\") {\n            collection.set(mutation.id, mutation.data);\n          } else {\n            collection.delete(mutation.id);\n          }\n        }",
                  "        for (const mutation of mutations) {\n          const key = this.mutationKey(mutation.collection, mutation.id);\n          const capturedVersion = compatibilityVersions.get(key) ?? 0;\n          const currentVersion =\n            this.compatibilityMutationVersions.get(key) ?? 0;\n          if (currentVersion !== capturedVersion) continue;\n\n          const collection = this.getCollection(mutation.collection);\n          if (mutation.operation === \"set\") {\n            collection.set(mutation.id, mutation.data);\n          } else {\n            collection.delete(mutation.id);\n          }\n        }",
              ),
              (
                  "availability",
                  "    const availability = this.connected\n      ? \"available\"\n      : this.lastFailureAt\n        ? \"degraded\"\n        : \"unavailable\";",
                  "    const availability = this.closed\n      ? \"unavailable\"\n      : this.connected\n        ? \"available\"\n        : this.lastFailureAt\n          ? \"degraded\"\n          : \"unavailable\";",
              ),
              (
                  "close",
                  "  async close(): Promise<void> {\n    await this.flush();\n    if (this.pool) await this.pool.end();\n    this.pool = null;\n    this.connected = false;\n  }",
                  "  async close(): Promise<void> {\n    await this.flush();\n    if (this.pool) await this.pool.end();\n    this.pool = null;\n    this.connected = false;\n    this.closed = true;\n  }",
              ),
              (
                  "helpers",
                  "  private validateMutations(mutations: readonly DurableMutation[]): void {",
                  "  private mutationKey(collection: string, id: string): string {\n    return `${collection}\\u0000${id}`;\n  }\n\n  private recordCompatibilityMutation(collection: string, id: string): void {\n    const key = this.mutationKey(collection, id);\n    this.compatibilityMutationVersions.set(\n      key,\n      (this.compatibilityMutationVersions.get(key) ?? 0) + 1,\n    );\n  }\n\n  private validateMutations(mutations: readonly DurableMutation[]): void {",
              ),
          ]
          for label, old, new in changes:
              text = replace_once(text, old, new, label)
          path.write_text(text)

          tests = Path("server/src/platform/storage/postgres/PostgresStorageProvider.test.ts")
          text = tests.read_text()
          anchor = '''  it("reports an available durable provider after initialization", async () => {
            const { storage } = provider();
            await storage.ready();

            expect(storage.getOperationalStatus()).toEqual({
              availability: "available",
              durability: "durable",
              pendingMutations: 0,
            });
          });
          });'''
          inserted = '''  it("reports an available durable provider after initialization", async () => {
            const { storage } = provider();
            await storage.ready();

            expect(storage.getOperationalStatus()).toEqual({
              availability: "available",
              durability: "durable",
              pendingMutations: 0,
            });
          });

          it("preserves a newer compatibility write while a batch commit is pending", async () => {
            let releaseCommit!: () => void;
            let commitStarted!: () => void;
            const commitGate = new Promise<void>((resolve) => {
              releaseCommit = resolve;
            });
            const commitReached = new Promise<void>((resolve) => {
              commitStarted = resolve;
            });
            const { storage } = provider({
              rows: [{ collection: "projects", id: "project-1", data: { name: "Before" } }],
              commitGate,
              onCommitStarted: commitStarted,
            });
            await storage.ready();

            const batch = storage.applyDurableBatch([
              { operation: "set", collection: "projects", id: "project-1", data: { name: "Batch" } },
            ]);
            await commitReached;
            storage.set("projects", "project-1", { name: "Compatibility" });
            releaseCommit();
            await batch;
            await storage.flush();

            expect(storage.get("projects", "project-1")).toEqual({ name: "Compatibility" });
          });

          it("reports unavailable after a degraded provider is closed", async () => {
            const { storage } = provider({ rejectBatchAt: 1 });
            await storage.ready();
            await expect(
              storage.applyDurableBatch([
                { operation: "set", collection: "projects", id: "project-1", data: { name: "Rejected" } },
              ]),
            ).rejects.toBeInstanceOf(DurableStorageError);
            expect(storage.getOperationalStatus().availability).toBe("degraded");
            await storage.close();
            expect(storage.getOperationalStatus()).toMatchObject({
              availability: "unavailable",
              durability: "durable",
            });
          });
          });'''
          tests.write_text(replace_once(text, anchor, inserted, "tests"))
          PY

          npm ci
          npx prettier --write server/src/platform/storage/postgres/PostgresStorageProvider.ts server/src/platform/storage/postgres/PostgresStorageProvider.test.ts
          npx vitest run server/src/platform/storage/postgres/PostgresStorageProvider.test.ts
          npm run typecheck
          git show origin/release/cutover-1e-candidate:.github/workflows/ci.yml > .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/platform/storage/postgres/PostgresStorageProvider.ts server/src/platform/storage/postgres/PostgresStorageProvider.test.ts .github/workflows/ci.yml
          git commit -m "fix(storage): guard batch publication and closed status"

          test "$(git diff --name-only origin/release/cutover-1e-candidate...HEAD | wc -l)" -eq 8
          git push origin HEAD:agent/data-201c-transaction-foundation
