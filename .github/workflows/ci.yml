name: Temporary Blueprint Inventory Refresh

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  refresh-blueprint-inventories:
    if: github.head_ref == 'agent/data-201c-blueprint-delete-transaction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201c-blueprint-delete-transaction
          fetch-depth: 0

      - name: Stage new test and refresh tracked inventories
        run: |
          git rm .tmp/blueprint-inventory-refresh-trigger
          git add server/src/projects/repository/storageBlueprint.repository.durability.test.ts
          node scripts/cleanup/generate-tracked-inventories.mjs

      - name: Commit refreshed inventories to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(repo): refresh blueprint test inventories"
          git push origin HEAD:agent/data-201c-blueprint-delete-transaction
