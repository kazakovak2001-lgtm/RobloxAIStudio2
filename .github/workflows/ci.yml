name: Temporary DATA-201 Lineage Conflict Probe

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: read

jobs:
  probe-lineage-conflicts:
    if: github.head_ref == 'agent/data-201-lineage-convergence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201-lineage-convergence
          fetch-depth: 0

      - name: Probe merge against atomic registration head
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin e2446096235524d214b679fc89c3df2109a1ca2e

          set +e
          git merge --no-commit --no-ff e2446096235524d214b679fc89c3df2109a1ca2e
          merge_status=$?
          set -e

          echo "MERGE_STATUS=${merge_status}"
          echo "MERGE_BASE=$(git merge-base HEAD e2446096235524d214b679fc89c3df2109a1ca2e)"
          echo "CONFLICT_FILES_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICT_FILES_END"
          echo "UNMERGED_INDEX_BEGIN"
          git ls-files -u || true
          echo "UNMERGED_INDEX_END"
          echo "WORKTREE_STATUS_BEGIN"
          git status --short
          echo "WORKTREE_STATUS_END"

          git merge --abort || true
