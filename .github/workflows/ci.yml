name: PR89 Failure Classification Publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-201c-transaction-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified failure-classification fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/cutover-1e-candidate
          python3 - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")
              return text.replace(old, new)

          path = Path("server/src/platform/storage/postgres/PostgresStorageProvider.ts")
          text = path.read_text()
          text = once(text, "    } catch (error) {\n      this.markFailure();\n      throw new DurableStorageError(\n        `Durable set failed", "    } catch (error) {\n      await this.refreshOperationalStateAfterMutationFailure();\n      throw new DurableStorageError(\n        `Durable set failed", "durable set catch")
          text = once(text, "    } catch (error) {\n      this.markFailure();\n      throw new DurableStorageError(\n        `Durable delete failed", "    } catch (error) {\n      await this.refreshOperationalStateAfterMutationFailure();\n      throw new DurableStorageError(\n        `Durable delete failed", "durable delete catch")
          text = once(text, "    } catch (error) {\n      this.markFailure();\n      throw new DurableStorageError(\n        \"Durable transaction failed\"", "    } catch (error) {\n      await this.refreshOperationalStateAfterMutationFailure();\n      throw new DurableStorageError(\n        \"Durable transaction failed\"", "batch catch")
          text = once(text, "    if (!this.pool || !this.connected) {\n      return {", "    if (!this.pool || this.closed) {\n      return {", "health early return")
          text = once(text, "      await this.pool.query(\"SELECT 1\");\n      return {", "      await this.pool.query(\"SELECT 1\");\n      this.connected = true;\n      return {", "health recovery")
          text = once(text, "    } catch {\n      this.markFailure();\n      return {", "    } catch {\n      this.markConnectionFailure();\n      return {", "health failure")
          text = once(text, "      this.pool = candidatePool;\n      this.connected = true;", "      this.pool = candidatePool;\n      this.connected = true;\n      this.closed = false;", "initialization success")
          text = once(text, "      this.markFailure();\n      this.pool = null;", "      this.markConnectionFailure();\n      this.pool = null;", "initialization failure")
          text = once(text, "    void this.enqueueWrite(write).catch((error: unknown) => {\n      this.markFailure();", "    void this.enqueueWrite(write).catch(async (error: unknown) => {\n      await this.refreshOperationalStateAfterMutationFailure();", "compatibility catch")
          text = once(text, "  private markFailure(): void {\n    this.connected = false;\n    this.lastFailureAt = new Date().toISOString();\n  }", "  private markConnectionFailure(): void {\n    this.connected = false;\n    this.lastFailureAt = new Date().toISOString();\n  }\n\n  private async refreshOperationalStateAfterMutationFailure(): Promise<void> {\n    this.lastFailureAt = new Date().toISOString();\n    if (!this.pool || this.closed) {\n      this.connected = false;\n      return;\n    }\n\n    try {\n      await this.pool.query(\"SELECT 1\");\n      this.connected = true;\n    } catch {\n      this.connected = false;\n    }\n  }", "failure helpers")
          path.write_text(text)

          tests = Path("server/src/platform/storage/postgres/PostgresStorageProvider.test.ts")
          text = tests.read_text()
          text = once(text, "  onCommitStarted?: () => void;\n}", "  onCommitStarted?: () => void;\n  rejectHealthCheckAt?: number;\n}", "fake options")
          text = once(text, "  const statements: string[] = [];\n  let database = new Map<string, unknown>();", "  const statements: string[] = [];\n  let database = new Map<string, unknown>();\n  let healthCheckIndex = 0;", "health counter")
          text = once(text, "    if (text === \"SELECT 1\") return { rows: [] };", "    if (text === \"SELECT 1\") {\n      healthCheckIndex += 1;\n      if (healthCheckIndex === options.rejectHealthCheckAt) {\n        throw new Error(\"injected health-check rejection\");\n      }\n      return { rows: [] };\n    }", "health rejection")
          text = once(text, "      availability: \"degraded\",\n      durability: \"durable\",\n      lastFailureAt: expect.any(String),", "      availability: \"available\",\n      durability: \"durable\",\n      lastFailureAt: expect.any(String),", "rollback status")

          start_marker = '  it("reports unavailable after a degraded provider is closed", async () => {'
          end_marker = '\n});\n\ndescribe("InMemoryStorageProvider durable batches", () => {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("closed and recovery tests: boundary not found")
          replacement = '''  it("recovers availability after a successful health probe", async () => {
            const { storage } = provider({ rejectHealthCheckAt: 2 });
            await storage.ready();

            await expect(storage.healthCheck()).resolves.toMatchObject({
              connected: false,
            });
            expect(storage.getOperationalStatus().availability).toBe("degraded");

            await expect(storage.healthCheck()).resolves.toMatchObject({
              connected: true,
            });
            expect(storage.getOperationalStatus().availability).toBe("available");
          });

          it("reports unavailable after a degraded provider is closed", async () => {
            const { storage } = provider({ rejectHealthCheckAt: 2 });
            await storage.ready();
            await storage.healthCheck();
            expect(storage.getOperationalStatus().availability).toBe("degraded");

            await storage.close();
            expect(storage.getOperationalStatus()).toMatchObject({
              availability: "unavailable",
              durability: "durable",
            });
          });'''
          text = text[:start] + replacement + text[end:]
          tests.write_text(text)
          PY

          npm ci
          npx prettier --write server/src/platform/storage/postgres/PostgresStorageProvider.ts server/src/platform/storage/postgres/PostgresStorageProvider.test.ts
          npx vitest run server/src/platform/storage/postgres/PostgresStorageProvider.test.ts
          npm run typecheck
          git show origin/release/cutover-1e-candidate:.github/workflows/ci.yml > .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/platform/storage/postgres/PostgresStorageProvider.ts server/src/platform/storage/postgres/PostgresStorageProvider.test.ts .github/workflows/ci.yml
          git commit -m "fix(storage): classify mutation and connection failures"
          test "$(git diff --name-only origin/release/cutover-1e-candidate...HEAD | wc -l)" -eq 8
          git push origin HEAD:agent/data-201c-transaction-foundation
