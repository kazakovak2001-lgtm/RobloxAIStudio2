name: Temporary PR84 Artifact Caller Migration

on:
  pull_request:
    branches:
      - agent/tmp-pr81-lifecycle-migration-base

permissions:
  contents: write

jobs:
  migrate-artifact-callers:
    if: github.head_ref == 'agent/data-201b-artifact-store-ack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-artifact-store-ack
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact route and recorder migration
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceExactly = (path, before, after, expected = 1) => {
            let source = fs.readFileSync(path, 'utf8');
            const matches = source.split(before).length - 1;
            if (matches !== expected) {
              throw new Error(`${path}: expected ${expected} matches, found ${matches}`);
            }
            source = source.split(before).join(after);
            fs.writeFileSync(path, source);
          };

          const concept = 'server/src/routes/concept.ts';
          replaceExactly(concept, 'import { Router } from "express";', 'import { Router, type Request, type RequestHandler, type Response } from "express";');
          replaceExactly(concept, 'import type { GenerationHistoryRepository } from "../projects/repository/generationHistory.repository";', 'import type { GenerationHistoryRepository } from "../projects/repository/generationHistory.repository";\nimport { DurableStorageError } from "../platform/storage/StorageProvider";');
          replaceExactly(concept, 'router.post("/experience/artifact/:artifactId/approve", (req, res) => {', 'router.post(\n    "/experience/artifact/:artifactId/approve",\n    asyncArtifactMutation(async (req, res) => {');
          replaceExactly(concept, 'router.post("/experience/artifact/:artifactId/reject", (req, res) => {', 'router.post(\n    "/experience/artifact/:artifactId/reject",\n    asyncArtifactMutation(async (req, res) => {');
          replaceExactly(concept, 'router.post("/experience/artifact/:artifactId/comment", (req, res) => {', 'router.post(\n    "/experience/artifact/:artifactId/comment",\n    asyncArtifactMutation(async (req, res) => {');
          replaceExactly(concept, 'router.post("/experience/artifact/:artifactId/edit", (req, res) => {', 'router.post(\n    "/experience/artifact/:artifactId/edit",\n    asyncArtifactMutation(async (req, res) => {');
          replaceExactly(concept, 'const result = pipelineEngine.approveArtifact(', 'const result = await pipelineEngine.approveArtifact(');
          replaceExactly(concept, 'const result = pipelineEngine.rejectArtifact(', 'const result = await pipelineEngine.rejectArtifact(');
          replaceExactly(concept, 'const result = pipelineEngine.commentArtifact(', 'const result = await pipelineEngine.commentArtifact(');
          replaceExactly(concept, 'const result = pipelineEngine.editArtifact(', 'const result = await pipelineEngine.editArtifact(');
          replaceExactly(concept, '    res.json({\n      success: true,\n      data: { id: result.id, reviewStatus: result.reviewStatus },\n    });\n  });', '    res.json({\n      success: true,\n      data: { id: result.id, reviewStatus: result.reviewStatus },\n    });\n    }),\n  );', 2);
          replaceExactly(concept, '    res.json({\n      success: true,\n      data: { id: result.id, reviewComment: result.reviewComment },\n    });\n  });', '    res.json({\n      success: true,\n      data: { id: result.id, reviewComment: result.reviewComment },\n    });\n    }),\n  );');
          replaceExactly(concept, '    res.json({\n      success: true,\n      data: {\n        id: result.id,\n        reviewStatus: result.reviewStatus,\n        sizeBytes: result.sizeBytes,\n      },\n    });\n  });', '    res.json({\n      success: true,\n      data: {\n        id: result.id,\n        reviewStatus: result.reviewStatus,\n        sizeBytes: result.sizeBytes,\n      },\n    });\n    }),\n  );');

          const helperBefore = '  return router;\n}\n\nfunction extractTitle(description: string): string {';
          const helperAfter = '  return router;\n}\n\nfunction asyncArtifactMutation(\n  handler: (req: Request, res: Response) => Promise<void>,\n): RequestHandler {\n  return (req, res) => {\n    void handler(req, res).catch((error: unknown) => {\n      handleArtifactMutationError(error, res);\n    });\n  };\n}\n\nfunction handleArtifactMutationError(error: unknown, res: Response): void {\n  if (error instanceof DurableStorageError) {\n    console.error("[concept] artifact mutation rejected", error);\n    res.status(503).json({\n      success: false,\n      error: "Durable storage is temporarily unavailable",\n    });\n    return;\n  }\n\n  console.error("[concept] artifact mutation failed", error);\n  res.status(500).json({ success: false, error: "Artifact mutation failed" });\n}\n\nfunction extractTitle(description: string): string {';
          replaceExactly(concept, helperBefore, helperAfter);

          const recorder = 'server/src/studio/artifacts/GenerationArtifactRecorder.ts';
          replaceExactly(recorder, '  record(executionId: string, nodes: readonly TaskNode[]): PipelineArtifact[] {', '  async record(\n    executionId: string,\n    nodes: readonly TaskNode[],\n  ): Promise<PipelineArtifact[]> {');
          replaceExactly(recorder, '        this.artifactStore.store(executionId, stage, node.agent, content),', '        await this.artifactStore.store(\n          executionId,\n          stage,\n          node.agent,\n          content,\n        ),');
          NODE

          node node_modules/prettier/bin/prettier.cjs --write \
            server/src/routes/concept.ts \
            server/src/studio/artifacts/GenerationArtifactRecorder.ts
          rm -f .tmp/pr84-artifact-callers-trigger

      - name: Commit exact migration to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(storage): await artifact mutation callers"
          git push origin HEAD:agent/data-201b-artifact-store-ack
