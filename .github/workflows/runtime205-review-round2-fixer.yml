name: RUNTIME-205 Review Round 2 Fixer

on:
  push:
    branches:
      - agent/runtime-2d-bounded-phases

permissions:
  contents: write

concurrency:
  group: runtime-205-review-round2-fixer
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-2d-bounded-phases
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply review fixes
        run: python scripts/fix-runtime205-review-round2.py

      - name: Normalize adapter assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server/src/orchestrator/AutonomousBoundedPhases.test.ts")
          text = path.read_text()
          old = '''    expect(adapter).toBeDefined();
              await expect(
                adapter?.execute(
                  createAutonomousPhaseContext("abort-project", "Build an RPG"),
                  controller.signal,
                ),
              ).rejects.toMatchObject({'''
          if old not in text:
              old = '''    expect(adapter).toBeDefined();
              await expect(
                adapter?.execute(
                  createAutonomousPhaseContext("abort-project", "Build an RPG"),
                  controller.signal,
                ),
              ).rejects.toMatchObject({'''
          normalized = '''    if (!adapter) throw new Error("Lua adapter is missing");
              await expect(
                adapter.execute(
                  createAutonomousPhaseContext("abort-project", "Build an RPG"),
                  controller.signal,
                ),
              ).rejects.toMatchObject({'''
          if old not in text:
              # Prettier has not run yet; handle the exact source emitted by the fixer.
              old = '''    expect(adapter).toBeDefined();
              await expect(
                adapter?.execute(
                  createAutonomousPhaseContext("abort-project", "Build an RPG"),
                  controller.signal,
                ),
              ).rejects.toMatchObject({'''
          if old not in text:
              old = '''    expect(adapter).toBeDefined();
    await expect(
      adapter?.execute(
        createAutonomousPhaseContext("abort-project", "Build an RPG"),
        controller.signal,
      ),
    ).rejects.toMatchObject({'''
              normalized = '''    if (!adapter) throw new Error("Lua adapter is missing");
    await expect(
      adapter.execute(
        createAutonomousPhaseContext("abort-project", "Build an RPG"),
        controller.signal,
      ),
    ).rejects.toMatchObject({'''
          if old not in text:
              raise SystemExit("Expected adapter assertion marker")
          path.write_text(text.replace(old, normalized, 1))
          PY

      - name: Remove one-shot helpers
        run: |
          git rm .github/workflows/runtime205-review-round2-fixer.yml
          git rm scripts/fix-runtime205-review-round2.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed TypeScript
        run: |
          npx prettier --write \
            server/src/orchestrator/OrchestratorTypes.ts \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousPhaseRegistry.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/AutonomousBoundedPhases.test.ts \
            server/src/routes/autonomous.ts

      - name: Validate focused lint
        run: |
          npx eslint \
            server/src/orchestrator/OrchestratorTypes.ts \
            server/src/orchestrator/AutonomousOrchestrator.ts \
            server/src/orchestrator/AutonomousPhaseRegistry.ts \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/AutonomousBoundedPhases.test.ts \
            server/src/routes/autonomous.ts \
            --max-warnings 0

      - name: Reject legacy timestamp recovery API
        run: |
          if grep -R --line-number --fixed-strings "checkpointTimestamp" server/src; then
            echo "Legacy checkpointTimestamp reference remains"
            exit 1
          fi

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run focused bounded orchestration tests
        run: |
          npm test -- \
            server/src/orchestrator/AutonomousOrchestrator.test.ts \
            server/src/orchestrator/AutonomousBoundedPhases.test.ts \
            server/src/__tests__/autonomousPipelineIntegration.test.ts

      - name: Validate repository formatting
        run: npm run format:check

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(runtime): harden bounded recovery contracts"
          git push origin HEAD:agent/runtime-2d-bounded-phases
