name: DATA-201B Inventory Refresh

on:
  push:
    branches:
      - agent/data-201b-compatibility-write-gate
    paths:
      - .github/workflows/data-201b-inventory-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-201b-compatibility-write-gate
          fetch-depth: 0

      - name: Regenerate canonical tracked inventories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/data-201b-inventory-refresh.yml
          node scripts/cleanup/generate-tracked-inventories.mjs
          git add _inventory_raw.txt ProjectStructure.txt project_structure.txt
          git commit -m "chore(storage): refresh compatibility gate inventories"
          git push origin HEAD:agent/data-201b-compatibility-write-gate
