name: Studio 1d Documentation Format Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md
          tar -czf studio-1d-docs-formatted.tgz \
            docs/00-project-control/CURRENT_STATE.md \
            docs/00-project-control/ROADMAP_STATUS.md \
            docs/00-project-control/STUDIO-1D_REAL_PLUGIN_ACCEPTANCE.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio-1d-docs-formatted-${{ github.sha }}
          path: studio-1d-docs-formatted.tgz
          retention-days: 2
