name: ARCH-206 Finalization Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-206-layer-debt-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/arch-206-finalize.mjs
      - run: node node_modules/prettier/bin/prettier.cjs --write architecture.manifest.json architecture.layer-debt.json package.json scripts/architecture/layer-debt-evidence.ts scripts/validate-layer-debt-evidence.ts server/src/__tests__/architecture.layer-debt-evidence.test.ts docs/02-audits/technical-v2/ARCH-205_IMPLEMENTATION_NOTES.md
      - run: |
          git rm --cached .github/workflows/arch-206-finalize.yml scripts/arch-206-finalize.mjs
          node scripts/cleanup/generate-tracked-inventories.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arch-206-finalized-files
          path: |
            architecture.manifest.json
            architecture.layer-debt.json
            package.json
            scripts/architecture/layer-debt-evidence.ts
            scripts/validate-layer-debt-evidence.ts
            server/src/__tests__/architecture.layer-debt-evidence.test.ts
            docs/02-audits/technical-v2/ARCH-205_IMPLEMENTATION_NOTES.md
            _inventory_raw.txt
            ProjectStructure.txt
          if-no-files-found: error
          retention-days: 1
