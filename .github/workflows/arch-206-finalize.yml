name: ARCH-206 Finalization Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-206-layer-debt-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Finalize manifest reasons and implementation contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const manifestPath = "architecture.manifest.json";
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const reasons = new Map([
            [
              "domains→infrastructure",
              "RUNTIME-2D owns the exact domain-to-runtime edges recorded in architecture.layer-debt.json from AssemblyBuilder.ts, CompilerAPI.ts, CompilerContextManager.ts, CompilerOrchestrator.ts, GenerationPipeline.ts, CIControlPipeline.ts, AutonomousOrchestrator.ts, GenerationArtifactRecorder.ts, StudioRuntime.ts, ArtifactTransferManager.ts and ProjectSyncManager.ts; replace direct socket and pipeline imports with runtime ports.",
            ],
            [
              "shared→api",
              "DURABILITY-2E owns the exact shared-to-platform edges recorded in architecture.layer-debt.json from common/middleware/security.ts and services/ChatPersistenceService.ts; invert auth, security and storage dependencies behind shared ports.",
            ],
            [
              "infrastructure→api",
              "DURABILITY-2E owns the exact pipeline-to-platform edge recorded in architecture.layer-debt.json from pipeline/v2/ArtifactStore.ts importing platform/storage/StorageFactory; move the storage contract below the API layer.",
            ],
            [
              "domains→api",
              "STUDIO-2F owns the exact studio-to-platform edge recorded in architecture.layer-debt.json from studio/v2/StudioRuntime.ts importing platform/storage/StorageProvider; extract a neutral Studio storage port.",
            ],
          ]);

          for (const edge of manifest.allowedLayerEdges ?? []) {
            const key = `${edge.from}→${edge.to}`;
            const reason = reasons.get(key);
            if (!reason) throw new Error(`Missing ARCH-206 reason for ${key}`);
            edge.reason = reason;
          }

          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const notes = `# ARCH-205 Implementation Contract

Tracks issues #108, #110 and completes the protected evidence work for ARCH-2B.

## Design principles

- The architecture decision is a pure value, not an incidental side effect of CLI logging.
- Report status and process exit code are derived from the same \`BoundaryGateDecision\`.
- Negative fixtures demonstrate rejection of invalid architecture states.
- Temporary layer exceptions remain visible as acknowledged debt and are never reported as clean architecture.
- Exception removal is evidence-driven: a manifest exception remains only while a real AST edge requires it.

## ARCH-205 implementation slice

- Added \`scripts/architecture/boundary-gate-core.ts\`.
- Replaced duplicated decision logic in \`scripts/validate-boundaries.ts\` with the pure core.
- Added focused Vitest fixtures for manifest completeness, stale subsystem declarations, unknown layers, duplicate and stale exceptions, forbidden layer edges, allowlisted debt, cycle normalization, non-allowlisted cycles, critical violations and unresolved imports.
- Added filesystem-backed AST fixtures proving static import, re-export, dynamic import and CommonJS discovery.
- Added review-driven regression coverage for malformed exception reasons and unresolved internal targets.
- Regenerated canonical tracked-file inventories and protected the result in CI.

## ARCH-206 closure slice

- Added the versioned \`architecture.layer-debt.json\` evidence document.
- Recorded all 18 active AST edges supporting the four retained \`allowedLayerEdges\` entries.
- Assigned each retained edge to exactly one owning milestone: \`RUNTIME-2D\`, \`DURABILITY-2E\` or \`STUDIO-2F\`.
- Added deterministic evidence construction and validation under \`scripts/architecture/layer-debt-evidence.ts\`.
- Added a real repository AST test and protected validation command that fail on evidence drift, stale owners or missing allowed-edge ownership.
- Replaced broad manifest reasons with concrete source-file summaries and remediation milestones; exact import specifiers remain canonical in \`architecture.layer-debt.json\`.

## Remaining work

None within the ARCH-2B evidence contract. Dependency inversion and removal of the four active exceptions continue under their recorded RUNTIME-2D, DURABILITY-2E and STUDIO-2F owners.
`;

          writeFileSync(
            "docs/02-audits/technical-v2/ARCH-205_IMPLEMENTATION_NOTES.md",
            notes,
          );
          NODE
      - name: Format final ARCH-206 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            architecture.manifest.json \
            architecture.layer-debt.json \
            package.json \
            scripts/architecture/layer-debt-evidence.ts \
            scripts/validate-layer-debt-evidence.ts \
            server/src/__tests__/architecture.layer-debt-evidence.test.ts \
            docs/02-audits/technical-v2/ARCH-205_IMPLEMENTATION_NOTES.md
      - name: Generate inventories for final tracked set
        run: |
          git rm --cached .github/workflows/arch-206-finalize.yml
          node scripts/generate-tracked-inventories.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arch-206-finalized-files
          path: |
            architecture.manifest.json
            architecture.layer-debt.json
            package.json
            scripts/architecture/layer-debt-evidence.ts
            scripts/validate-layer-debt-evidence.ts
            server/src/__tests__/architecture.layer-debt-evidence.test.ts
            docs/02-audits/technical-v2/ARCH-205_IMPLEMENTATION_NOTES.md
            _inventory_raw.txt
            ProjectStructure.txt
          if-no-files-found: error
          retention-days: 1
