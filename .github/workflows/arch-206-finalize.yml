name: ARCH-206 Inventory Finalization

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-206-layer-debt-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Commit final inventories
        run: |
          git rm .github/workflows/arch-206-finalize.yml
          git rm --ignore-unmatch scripts/arch-206-finalize.mjs
          node scripts/cleanup/generate-tracked-inventories.mjs
          git add _inventory_raw.txt ProjectStructure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(architecture): finalize layer debt inventories"
          git push origin HEAD:agent/arch-206-layer-debt-evidence
