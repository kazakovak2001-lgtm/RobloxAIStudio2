name: Studio Plugin Source Audit

on:
  push:
    branches: [studio-1d-real-plugin-acceptance]
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory canonical plugin source
        run: |
          find studio-plugin -type f -print | sort > plugin-tree.txt
          tar -czf studio-plugin-source.tgz studio-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: studio-plugin-source-${{ github.sha }}
          path: |
            plugin-tree.txt
            studio-plugin-source.tgz
          retention-days: 2
