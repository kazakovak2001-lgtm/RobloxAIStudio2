services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roblox_ai_studio_release}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - release_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-studio} -d ${POSTGRES_DB:-roblox_ai_studio_release}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "5000"
      STORAGE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-roblox_ai_studio_release}
      FRONTEND_URL: ${RELEASE_ORIGIN:?Set RELEASE_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/health",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: ${RELEASE_ORIGIN:?Set RELEASE_ORIGIN}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${RELEASE_PORT:-8443}:443"
    volumes:
      - ./release/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RELEASE_CERT_DIR:?Set RELEASE_CERT_DIR}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  release_postgres_data:
