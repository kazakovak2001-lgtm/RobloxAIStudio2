version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roblox_ai_studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d roblox_ai_studio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
